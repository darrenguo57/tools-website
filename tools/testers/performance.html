<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Test - ToolBox</title>
    <meta name="description" content="Test performance">
    
    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    
    <style>
        /* Tool Page Custom Styles */
        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .workspace-grid .full-width { grid-column: 1 / -1; }
        .textarea-wrap { position: relative; }
        .textarea-wrap textarea, .textarea-wrap input {
            width: 100%; min-height: 200px; padding: 1rem; border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); font-family: 'Courier New', monospace; font-size: 14px;
            resize: vertical; background: var(--color-bg); color: var(--color-text);
            box-sizing: border-box;
        }
        .textarea-wrap input { min-height: auto; resize: none; }
        .textarea-wrap textarea:focus, .textarea-wrap input:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .textarea-label { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: var(--font-size-sm); color: var(--color-text); }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1rem 0; }
        .char-count { font-size: 12px; color: var(--color-text-tertiary); text-align: right; margin-top: 0.25rem; }
        
        /* Performance Test Tool Specific Styles */
        .perf-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        @media (max-width: 900px) {
            .perf-layout { grid-template-columns: 1fr; }
        }
        .perf-input-section textarea {
            min-height: 300px;
        }
        .perf-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .perf-results {
            background: var(--color-bg-secondary);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
        }
        .perf-results.hidden {
            display: none;
        }
        .perf-score-section {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .perf-score-ring {
            width: 120px;
            height: 120px;
            margin: 0 auto 1rem;
        }
        .perf-score-ring svg {
            transform: rotate(-90deg);
        }
        .perf-score-ring circle {
            fill: none;
            stroke-width: 8;
        }
        .perf-score-ring .bg {
            stroke: var(--color-border);
        }
        .perf-score-ring .fg {
            stroke: #10B981;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }
        .perf-score-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 700;
        }
        .perf-score-ring-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }
        .perf-score-label {
            font-size: 14px;
            color: var(--color-text-secondary);
        }
        .perf-details {
            margin-bottom: 1.5rem;
        }
        .perf-details h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--color-text);
        }
        .perf-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--color-border);
            font-size: 13px;
        }
        .perf-detail-row:last-child {
            border-bottom: none;
        }
        .perf-detail-label {
            color: var(--color-text-secondary);
        }
        .perf-detail-value {
            font-weight: 500;
            color: var(--color-text);
        }
        .perf-suggestions h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--color-text);
        }
        .perf-suggestion {
            display: flex;
            gap: 0.75rem;
            padding: 0.75rem;
            background: var(--color-bg);
            border-radius: var(--radius-md);
            margin-bottom: 0.5rem;
        }
        .sug-icon {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
        }
        .sug-icon.good { color: #10B981; }
        .sug-icon.warn { color: #F59E0B; }
        .sug-icon.bad { color: #EF4444; }
        .sug-text {
            font-size: 13px;
            line-height: 1.5;
        }
        .sug-text strong {
            font-weight: 600;
        }
        .sug-text code {
            background: var(--color-bg-secondary);
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="toolbox"></i>
                <span>ToolBox</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>
    
    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_testing" data-i18n="cat_testing">Testing</a> / <span>Performance Test</span></div></div>
    
    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="zap"></i></div>
                    <h1>Performance Test</h1>
                    <p>Analyze HTML performance</p>
                </div>
                
                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <div class="perf-layout">
                        <!-- Input Section -->
                        <div class="perf-input-section">
                            <div class="textarea-label">
                                <i data-lucide="code"></i>
                                <span>HTML Code</span>
                            </div>
                            <div class="textarea-wrap">
                                <textarea id="htmlInput" placeholder="Paste your HTML code here..."></textarea>
                            </div>
                            
                            <div class="perf-actions">
                                <button id="btnAnalyze" class="btn btn-primary">
                                    <i data-lucide="play"></i> Analyze
                                </button>
                                <button id="btnSample" class="btn btn-secondary">
                                    <i data-lucide="file-text"></i> Load Sample
                                </button>
                                <button id="btnPaste" class="btn btn-secondary">
                                    <i data-lucide="clipboard"></i> Paste
                                </button>
                                <button id="btnClear" class="btn btn-danger">
                                    <i data-lucide="trash-2"></i> Clear
                                </button>
                            </div>
                        </div>
                        
                        <!-- Results Section -->
                        <div class="perf-results hidden" id="resultsSection">
                            <div class="perf-score-section">
                                <div class="perf-score-ring-wrapper">
                                    <svg class="perf-score-ring" viewBox="0 0 120 120">
                                        <circle class="bg" cx="60" cy="60" r="52"></circle>
                                        <circle class="fg" id="scoreRing" cx="60" cy="60" r="52" 
                                            stroke-dasharray="326.73" stroke-dashoffset="326.73"></circle>
                                    </svg>
                                    <span id="scoreValue" class="perf-score-value">0</span>
                                </div>
                                <div id="scoreLabel" class="perf-score-label">Score</div>
                            </div>
                            
                            <div class="perf-details">
                                <h4>Details</h4>
                                <div id="detailsList"></div>
                            </div>
                            
                            <div class="perf-suggestions">
                                <h4>Suggestions</h4>
                                <div id="suggestionsList"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
            <aside class="tool-sidebar">
            </aside>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="#" data-i18n="footer_about">About</a>
                <a href="#" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="#" data-i18n="footer_terms">Terms of Service</a>
                <a href="#" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 ToolBox. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>
    
    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>
    
    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>
    
    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }
        
        // Initialize performance tester
        initPerformanceTester();
    });
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    }
    
    var sampleHtml = '<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <meta name="description" content="Sample page for testing">\n    <title>Sample Page</title>\n    <link rel="stylesheet" href="styles.css">\n    <link rel="stylesheet" href="main.css">\n</head>\n<body>\n    <header>\n        <img src="logo.png" alt="Logo" width="100" height="50">\n        <nav>\n            <a href="#">Home</a>\n            <a href="#">About</a>\n        </nav>\n    </header>\n    <main>\n        <h1>Welcome</h1>\n        <p>This is a sample page.</p>\n        <img src="hero.jpg" alt="Hero image" width="800" height="400">\n    </main>\n    <script src="app.js"><\/script>\n</body>\n</html>';
    
    function initPerformanceTester() {
        function formatBytes(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function analyze() {
            var html = document.getElementById('htmlInput').value;
            if (!html.trim()) {
                showToast('Please enter HTML code to analyze');
                return;
            }

            var suggestions = [];
            var score = 100;
            var details = [];

            // HTML size
            var htmlSize = new Blob([html]).size;
            details.push({ label: 'HTML Document Size', value: formatBytes(htmlSize) });
            if (htmlSize > 100000) {
                score -= 15;
                suggestions.push({ type: 'bad', text: '<strong>Large HTML document</strong> (' + formatBytes(htmlSize) + '). Consider splitting into multiple pages or reducing inline content.' });
            } else if (htmlSize > 50000) {
                score -= 5;
                suggestions.push({ type: 'warn', text: '<strong>HTML document is somewhat large</strong> (' + formatBytes(htmlSize) + '). Consider optimizing content.' });
            } else {
                suggestions.push({ type: 'good', text: '<strong>HTML document size is good</strong> (' + formatBytes(htmlSize) + ').' });
            }

            // DOM elements
            var parser = new DOMParser();
            var doc = parser.parseFromString(html, 'text/html');
            var allElements = doc.querySelectorAll('*');
            var elementCount = allElements.length;
            details.push({ label: 'DOM Elements', value: elementCount });
            if (elementCount > 1500) {
                score -= 15;
                suggestions.push({ type: 'bad', text: '<strong>Too many DOM elements</strong> (' + elementCount + '). This can slow down rendering. Consider reducing nested elements.' });
            } else if (elementCount > 800) {
                score -= 5;
                suggestions.push({ type: 'warn', text: '<strong>Relatively high DOM element count</strong> (' + elementCount + '). Consider simplifying the structure.' });
            } else {
                suggestions.push({ type: 'good', text: '<strong>DOM element count is reasonable</strong> (' + elementCount + ').' });
            }

            // Images
            var images = doc.querySelectorAll('img');
            var imgCount = images.length;
            details.push({ label: 'Images', value: imgCount });
            var missingAlt = 0;
            var missingDimensions = 0;
            images.forEach(function(img) {
                if (!img.getAttribute('alt')) missingAlt++;
                if (!img.getAttribute('width') && !img.getAttribute('height')) missingDimensions++;
            });
            if (missingAlt > 0) {
                score -= 5 * Math.min(missingAlt, 3);
                suggestions.push({ type: 'bad', text: '<strong>' + missingAlt + ' image(s) missing alt attribute.</strong> Add descriptive alt text for accessibility and SEO.' });
            }
            if (missingDimensions > 0) {
                score -= 5;
                suggestions.push({ type: 'warn', text: '<strong>' + missingDimensions + ' image(s) missing width/height.</strong> Specify dimensions to prevent layout shift (CLS).' });
            }
            if (imgCount > 0 && missingAlt === 0 && missingDimensions === 0) {
                suggestions.push({ type: 'good', text: '<strong>All images have alt attributes and dimensions.</strong>' });
            }

            // CSS references
            var cssLinks = doc.querySelectorAll('link[rel="stylesheet"]');
            var inlineStyles = doc.querySelectorAll('[style]');
            var styleTags = doc.querySelectorAll('style');
            var cssCount = cssLinks.length;
            details.push({ label: 'External CSS Files', value: cssCount });
            details.push({ label: 'Inline Styles', value: inlineStyles.length });
            details.push({ label: 'Style Tags', value: styleTags.length });
            if (cssCount > 5) {
                score -= 10;
                suggestions.push({ type: 'bad', text: '<strong>Too many external CSS files</strong> (' + cssCount + '). Consider combining and minifying CSS files.' });
            } else if (cssCount > 2) {
                score -= 3;
                suggestions.push({ type: 'warn', text: '<strong>Multiple CSS files</strong> (' + cssCount + '). Consider combining to reduce HTTP requests.' });
            }
            if (inlineStyles.length > 5) {
                score -= 5;
                suggestions.push({ type: 'warn', text: '<strong>' + inlineStyles.length + ' inline styles found.</strong> Move styles to external CSS for better caching and maintainability.' });
            }

            // JS references
            var jsScripts = doc.querySelectorAll('script[src]');
            var inlineScripts = doc.querySelectorAll('script:not([src])');
            var jsCount = jsScripts.length;
            details.push({ label: 'External JS Files', value: jsCount });
            details.push({ label: 'Inline Scripts', value: inlineScripts.length });
            if (jsCount > 5) {
                score -= 10;
                suggestions.push({ type: 'bad', text: '<strong>Too many external JS files</strong> (' + jsCount + '). Consider bundling and minifying JavaScript.' });
            } else if (jsCount > 2) {
                score -= 3;
                suggestions.push({ type: 'warn', text: '<strong>Multiple JS files</strong> (' + jsCount + '). Consider combining to reduce requests.' });
            }
            if (inlineScripts.length > 2) {
                score -= 5;
                suggestions.push({ type: 'warn', text: '<strong>' + inlineScripts.length + ' inline script(s) found.</strong> Move to external files for better caching.' });
            }

            // Render-blocking resources
            var renderBlocking = 0;
            cssLinks.forEach(function(link) {
                if (!link.getAttribute('media') || link.getAttribute('media') === 'all') renderBlocking++;
            });
            jsScripts.forEach(function(script) {
                if (!script.getAttribute('async') && !script.getAttribute('defer')) renderBlocking++;
            });
            details.push({ label: 'Render-Blocking Resources', value: renderBlocking });
            if (renderBlocking > 4) {
                score -= 10;
                suggestions.push({ type: 'bad', text: '<strong>' + renderBlocking + ' render-blocking resources.</strong> Use async/defer for JS and preload critical CSS.' });
            } else if (renderBlocking > 2) {
                score -= 5;
                suggestions.push({ type: 'warn', text: '<strong>' + renderBlocking + ' render-blocking resources.</strong> Consider async/defer for scripts.' });
            }

            // Meta tags
            var hasViewport = !!doc.querySelector('meta[name="viewport"]');
            var hasDescription = !!doc.querySelector('meta[name="description"]');
            var hasCharset = !!doc.querySelector('meta[charset]');
            details.push({ label: 'Viewport Meta', value: hasViewport ? 'Yes' : 'Missing' });
            details.push({ label: 'Description Meta', value: hasDescription ? 'Yes' : 'Missing' });
            details.push({ label: 'Charset Meta', value: hasCharset ? 'Yes' : 'Missing' });
            if (!hasViewport) {
                score -= 10;
                suggestions.push({ type: 'bad', text: '<strong>Missing viewport meta tag.</strong> Add <code>&lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;</code> for mobile responsiveness.' });
            }
            if (!hasDescription) {
                score -= 5;
                suggestions.push({ type: 'warn', text: '<strong>Missing meta description.</strong> Add a meta description for better SEO.' });
            }

            // Tables for layout
            var tables = doc.querySelectorAll('table');
            if (tables.length > 0) {
                suggestions.push({ type: 'warn', text: '<strong>' + tables.length + ' table(s) found.</strong> Ensure tables are used for data, not layout. Use CSS Grid or Flexbox instead.' });
            }

            // Ensure score is in range
            score = Math.max(0, Math.min(100, score));

            // Update UI
            document.getElementById('resultsSection').style.display = 'block';

            // Score ring
            var circumference = 2 * Math.PI * 52;
            var offset = circumference - (score / 100) * circumference;
            var ring = document.getElementById('scoreRing');
            var color;
            if (score >= 80) color = '#10B981';
            else if (score >= 60) color = '#F59E0B';
            else if (score >= 40) color = '#F97316';
            else color = '#EF4444';
            ring.style.stroke = color;
            ring.style.strokeDashoffset = offset;
            document.getElementById('scoreValue').textContent = score;
            document.getElementById('scoreValue').style.color = color;

            var label;
            if (score >= 90) label = 'Excellent';
            else if (score >= 80) label = 'Good';
            else if (score >= 60) label = 'Fair';
            else if (score >= 40) label = 'Needs Improvement';
            else label = 'Poor';
            document.getElementById('scoreLabel').textContent = label;

            // Details
            var detailsHtml = '';
            details.forEach(function(d) {
                detailsHtml += '<div class="perf-detail-row"><span class="perf-detail-label">' + d.label + '</span><span class="perf-detail-value">' + d.value + '</span></div>';
            });
            document.getElementById('detailsList').innerHTML = detailsHtml;

            // Suggestions
            var sugHtml = '';
            suggestions.forEach(function(s) {
                var iconSvg;
                if (s.type === 'good') iconSvg = '<svg class="sug-icon good" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
                else if (s.type === 'warn') iconSvg = '<svg class="sug-icon warn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
                else iconSvg = '<svg class="sug-icon bad" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
                sugHtml += '<div class="perf-suggestion">' + iconSvg + '<div class="sug-text">' + s.text + '</div></div>';
            });
            document.getElementById('suggestionsList').innerHTML = sugHtml;
            
            showToast('Analysis complete! Score: ' + score);
        }

        document.getElementById('btnAnalyze').addEventListener('click', analyze);

        document.getElementById('btnSample').addEventListener('click', function() {
            document.getElementById('htmlInput').value = sampleHtml;
        });

        document.getElementById('btnPaste').addEventListener('click', function() {
            navigator.clipboard.readText().then(function(text) {
                document.getElementById('htmlInput').value = text;
                showToast('Content pasted from clipboard');
            }).catch(function() {
                showToast('Unable to read clipboard');
            });
        });

        document.getElementById('btnClear').addEventListener('click', function() {
            document.getElementById('htmlInput').value = '';
            document.getElementById('resultsSection').style.display = 'none';
            showToast('Cleared');
        });
    }
    </script>
</body>
</html>
