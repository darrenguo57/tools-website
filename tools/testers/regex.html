    <style>
        /* Tool Page Custom Styles */
        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .workspace-grid .full-width { grid-column: 1 / -1; }
        .textarea-wrap { position: relative; }
        .textarea-wrap textarea, .textarea-wrap input {
            width: 100%; min-height: 200px; padding: 1rem; border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); font-family: 'Courier New', monospace; font-size: 14px;
            resize: vertical; background: var(--color-bg); color: var(--color-text);
            box-sizing: border-box;
        }
        .textarea-wrap input { min-height: auto; resize: none; }
        .textarea-wrap textarea:focus, .textarea-wrap input:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .textarea-label { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: var(--font-size-sm); color: var(--color-text); }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1rem 0; }
        .char-count { font-size: 12px; color: var(--color-text-tertiary); text-align: right; margin-top: 0.25rem; }
        
        /* Regex Tool Specific Styles */
        .regex-pattern-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: var(--color-bg);
            color: var(--color-text);
            margin-bottom: 0.75rem;
        }
        .regex-pattern-input:focus {
            outline: none;
            border-color: var(--color-border-focus);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .regex-flags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .regex-flag-btn {
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-bg-secondary);
            color: var(--color-text);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .regex-flag-btn:hover {
            border-color: var(--color-border-focus);
        }
        .regex-flag-btn.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }
        .regex-highlight-area {
            min-height: 150px;
            padding: 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            background: var(--color-bg-secondary);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 1rem;
            word-break: break-all;
        }
        .regex-highlight-area mark {
            background: #FEF08A;
            color: #000;
            padding: 0 2px;
            border-radius: 2px;
        }
        :root[data-theme="dark"] .regex-highlight-area mark {
            background: #854D0E;
            color: #FEF9C3;
        }
        .regex-stats {
            display: flex;
            gap: 1.5rem;
            padding: 0.75rem 1rem;
            background: var(--color-bg-secondary);
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            font-size: 13px;
        }
        .regex-stats span { color: var(--color-text-secondary); }
        .regex-stats strong { color: var(--color-primary); }
        .regex-match-list {
            max-height: 250px;
            overflow-y: auto;
        }
        .regex-match-item {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 1rem;
            padding: 0.75rem;
            border-bottom: 1px solid var(--color-border);
        }
        .regex-match-item:last-child { border-bottom: none; }
        .regex-match-index {
            font-size: 11px;
            color: var(--color-text-tertiary);
            text-transform: uppercase;
        }
        .regex-match-value {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            background: var(--color-bg-secondary);
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            word-break: break-all;
        }
        .regex-match-groups {
            font-size: 12px;
            color: var(--color-text-secondary);
            margin-top: 0.25rem;
        }
        .regex-error {
            display: none;
            padding: 0.75rem 1rem;
            background: #FEE2E2;
            color: #DC2626;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            font-size: 13px;
        }
        :root[data-theme="dark"] .regex-error {
            background: rgba(220,38,38,0.2);
            color: #FCA5A5;
        }
        .regex-templates {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .regex-template-btn {
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-bg-secondary);
            color: var(--color-text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .regex-template-btn:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }
        
        @media (max-width: 768px) { .workspace-grid { grid-template-columns: 1fr; } }
    </style>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }
        
        // Initialize regex tester
        initRegexTester();
    });
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    }
    
    function copyOutput() {
        const output = document.getElementById('highlightArea');
        if (!output || !output.textContent) {
            showToast('Nothing to copy');
            return;
        }
        navigator.clipboard.writeText(output.textContent).then(() => {
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        }).catch(() => {
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        });
    }
    
    function clearAll() {
        const patternInput = document.getElementById('patternInput');
        const testInput = document.getElementById('testInput');
        const highlightArea = document.getElementById('highlightArea');
        const matchList = document.getElementById('matchList');
        const regexStats = document.getElementById('regexStats');
        const regexError = document.getElementById('regexError');
        
        if (patternInput) patternInput.value = '';
        if (testInput) testInput.value = '';
        if (highlightArea) highlightArea.innerHTML = '';
        if (matchList) matchList.innerHTML = '';
        if (regexStats) regexStats.innerHTML = '';
        if (regexError) {
            regexError.textContent = '';
            regexError.style.display = 'none';
        }
        showToast(typeof I18n !== 'undefined' ? I18n.t('toast.cleared') : 'Cleared');
    }
    
    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function initRegexTester() {
        var patternInput = document.getElementById('patternInput');
        var testInput = document.getElementById('testInput');
        var highlightArea = document.getElementById('highlightArea');
        var matchList = document.getElementById('matchList');
        var regexStats = document.getElementById('regexStats');
        var regexError = document.getElementById('regexError');

        var flags = { g: true, i: false, m: false, s: false };

        function getFlagsString() {
            var f = '';
            for (var k in flags) { if (flags[k]) f += k; }
            return f;
        }

        function runTest() {
            var pattern = patternInput.value;
            var testStr = testInput.value;

            if (!pattern) {
                highlightArea.innerHTML = escapeHtml(testStr);
                matchList.innerHTML = '<div style="color:var(--color-text-tertiary);font-size:var(--font-size-sm);text-align:center;padding:var(--space-4);">Enter a pattern to see matches</div>';
                regexStats.innerHTML = '';
                regexError.style.display = 'none';
                return;
            }

            try {
                var regex = new RegExp(pattern, getFlagsString());
                regexError.style.display = 'none';

                // Highlight
                var highlighted = escapeHtml(testStr);
                var matches = [];
                var match;

                if (flags.g) {
                    var tempRegex = new RegExp(pattern, getFlagsString());
                    while ((match = tempRegex.exec(testStr)) !== null) {
                        matches.push({ value: match[0], index: match.index, groups: match.slice(1) });
                        if (match[0].length === 0) { tempRegex.lastIndex++; }
                    }
                } else {
                    match = regex.exec(testStr);
                    if (match) {
                        matches.push({ value: match[0], index: match.index, groups: match.slice(1) });
                    }
                }

                // Build highlighted text (reverse order to preserve indices)
                if (matches.length > 0) {
                    var parts = [];
                    var lastIndex = 0;
                    matches.forEach(function(m) {
                        if (m.index >= lastIndex) {
                            parts.push(escapeHtml(testStr.slice(lastIndex, m.index)));
                            parts.push('<mark>' + escapeHtml(m.value) + '</mark>');
                            lastIndex = m.index + m.value.length;
                        }
                    });
                    parts.push(escapeHtml(testStr.slice(lastIndex)));
                    highlighted = parts.join('');
                }

                highlightArea.innerHTML = highlighted;

                // Stats
                regexStats.innerHTML = '<span>Matches: <strong>' + matches.length + '</strong></span>';

                // Match list
                if (matches.length === 0) {
                    matchList.innerHTML = '<div style="color:var(--color-text-tertiary);font-size:var(--font-size-sm);text-align:center;padding:var(--space-4);">No matches found</div>';
                } else {
                    var html = '';
                    matches.forEach(function(m, i) {
                        html += '<div class="regex-match-item">';
                        html += '<div class="regex-match-index">Match ' + (i + 1) + '<br>Index: ' + m.index + '</div>';
                        html += '<div><div class="regex-match-value">"' + escapeHtml(m.value) + '"</div>';
                        if (m.groups.length > 0) {
                            html += '<div class="regex-match-groups">';
                            m.groups.forEach(function(g, gi) {
                                if (g !== undefined) {
                                    html += 'Group ' + (gi + 1) + ': "' + escapeHtml(g) + '" ';
                                }
                            });
                            html += '</div>';
                        }
                        html += '</div></div>';
                    });
                    matchList.innerHTML = html;
                }

            } catch (e) {
                regexError.textContent = e.message;
                regexError.style.display = 'block';
                highlightArea.innerHTML = escapeHtml(testStr);
                matchList.innerHTML = '';
                regexStats.innerHTML = '';
            }
        }

        // Flag toggles
        document.querySelectorAll('.regex-flag-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var flag = this.dataset.flag;
                flags[flag] = !flags[flag];
                this.classList.toggle('active', flags[flag]);
                runTest();
            });
        });

        // Template buttons
        document.querySelectorAll('.regex-template-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                patternInput.value = this.dataset.pattern;
                testInput.value = this.dataset.test;
                runTest();
            });
        });

        // Real-time testing
        patternInput.addEventListener('input', runTest);
        testInput.addEventListener('input', runTest);

        // Initial run
        runTest();
    }
    </script>
