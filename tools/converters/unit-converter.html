<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter - UseEasyTool</title>
    <meta name="description" content="Convert units of measurement">

    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">

    <style>
        /* Tool Page Custom Styles */
        .converter-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1rem; }
        .category-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; justify-content: center; }
        .category-tab { padding: 0.5rem 1rem; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-bg); color: var(--color-text); cursor: pointer; transition: all 0.2s; }
        .category-tab:hover { border-color: var(--color-primary); }
        .category-tab.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }
        .converter-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; justify-content: center; }
        .converter-row input { width: 150px; min-height: auto; padding: 0.75rem 1rem; font-size: 18px; text-align: center; }
        .converter-row select { padding: 0.75rem 1rem; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-bg); color: var(--color-text); min-width: 150px; }
        .swap-btn { padding: 0.5rem; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        .result-display { text-align: center; padding: 1.5rem; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); margin-top: 1rem; }
        .result-value { font-size: 32px; font-weight: 600; color: var(--color-primary); font-family: 'Courier New', monospace; }
        .result-label { font-size: 14px; color: var(--color-text-tertiary); margin-top: 0.5rem; }
        .quick-ref { margin-top: 1rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.5rem; }
        .quick-ref-item { display: flex; justify-content: space-between; padding: 0.5rem; background: var(--color-bg); border-radius: var(--radius); font-size: 12px; }

        @media (max-width: 768px) {
            .converter-row { flex-direction: column; }
            .converter-row input, .converter-row select { width: 100%; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="UseEasyTool"></i>
                <span>UseEasyTool</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_converters" data-i18n="cat_converters">Converters</a> / <span>Unit Converter</span></div></div>

    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="ruler"></i></div>
                    <h1>Unit Converter</h1>
                    <p>Convert units of measurement</p>
                </div>

                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <div class="converter-card">
                        <div class="category-tabs" id="categoryTabs"></div>

                        <div class="converter-row">
                            <input type="number" id="valueInput" placeholder="Enter value" step="any">
                            <select id="fromUnit"></select>
                            <button class="btn btn-secondary swap-btn" id="swapBtn" title="Swap units"><i data-lucide="arrow-up-down"></i></button>
                            <select id="toUnit"></select>
                        </div>

                        <div class="result-display">
                            <div class="result-value" id="resultValue">-</div>
                            <div class="result-label" id="resultLabel"></div>
                        </div>

                        <div class="quick-ref" id="quickRef"></div>
                    </div>
                </div>

            </div>
            <aside class="tool-sidebar">
            </aside>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="../about.html" data-i18n="footer_about">About</a>
                <a href="../privacy.html" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="../terms.html" data-i18n="footer_terms">Terms of Service</a>
                <a href="../contact.html" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 UseEasyTool. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>

    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>

    <script>
    (function() {
        const valueInput = document.getElementById('valueInput');
        const fromUnit = document.getElementById('fromUnit');
        const toUnit = document.getElementById('toUnit');
        const resultValue = document.getElementById('resultValue');
        const resultLabel = document.getElementById('resultLabel');
        const quickRef = document.getElementById('quickRef');
        const categoryTabs = document.getElementById('categoryTabs');
        const swapBtn = document.getElementById('swapBtn');

        let currentCategory = 'length';

        const categories = {
            length: {
                name: 'Length',
                units: {
                    meter: { name: 'Meter (m)', factor: 1 },
                    kilometer: { name: 'Kilometer (km)', factor: 1000 },
                    centimeter: { name: 'Centimeter (cm)', factor: 0.01 },
                    millimeter: { name: 'Millimeter (mm)', factor: 0.001 },
                    mile: { name: 'Mile (mi)', factor: 1609.344 },
                    yard: { name: 'Yard (yd)', factor: 0.9144 },
                    foot: { name: 'Foot (ft)', factor: 0.3048 },
                    inch: { name: 'Inch (in)', factor: 0.0254 }
                }
            },
            weight: {
                name: 'Weight',
                units: {
                    kilogram: { name: 'Kilogram (kg)', factor: 1 },
                    gram: { name: 'Gram (g)', factor: 0.001 },
                    milligram: { name: 'Milligram (mg)', factor: 0.000001 },
                    pound: { name: 'Pound (lb)', factor: 0.453592 },
                    ounce: { name: 'Ounce (oz)', factor: 0.0283495 },
                    ton: { name: 'Metric Ton (t)', factor: 1000 }
                }
            },
            temperature: {
                name: 'Temperature',
                units: {
                    celsius: { name: 'Celsius (C)', factor: 1 },
                    fahrenheit: { name: 'Fahrenheit (F)', factor: 1 },
                    kelvin: { name: 'Kelvin (K)', factor: 1 }
                }
            },
            data: {
                name: 'Data',
                units: {
                    byte: { name: 'Byte (B)', factor: 1 },
                    kilobyte: { name: 'Kilobyte (KB)', factor: 1024 },
                    megabyte: { name: 'Megabyte (MB)', factor: 1048576 },
                    gigabyte: { name: 'Gigabyte (GB)', factor: 1073741824 },
                    terabyte: { name: 'Terabyte (TB)', factor: 1099511627776 }
                }
            },
            time: {
                name: 'Time',
                units: {
                    second: { name: 'Second (s)', factor: 1 },
                    millisecond: { name: 'Millisecond (ms)', factor: 0.001 },
                    minute: { name: 'Minute (min)', factor: 60 },
                    hour: { name: 'Hour (h)', factor: 3600 },
                    day: { name: 'Day (d)', factor: 86400 },
                    week: { name: 'Week (wk)', factor: 604800 }
                }
            }
        };

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }
        }

        function buildTabs() {
            categoryTabs.innerHTML = '';
            Object.keys(categories).forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'category-tab' + (key === currentCategory ? ' active' : '');
                btn.textContent = categories[key].name;
                btn.onclick = () => {
                    currentCategory = key;
                    buildTabs();
                    buildUnits();
                    convert();
                };
                categoryTabs.appendChild(btn);
            });
        }

        function buildUnits() {
            const cat = categories[currentCategory];
            const units = Object.keys(cat.units);
            fromUnit.innerHTML = '';
            toUnit.innerHTML = '';
            units.forEach(key => {
                const opt1 = document.createElement('option');
                opt1.value = key; opt1.textContent = cat.units[key].name;
                fromUnit.appendChild(opt1);
                const opt2 = document.createElement('option');
                opt2.value = key; opt2.textContent = cat.units[key].name;
                toUnit.appendChild(opt2);
            });
            if (units.length > 1) toUnit.value = units[1];
        }

        function convert() {
            const val = parseFloat(valueInput.value);
            if (isNaN(val)) {
                resultValue.textContent = '-';
                resultLabel.textContent = '';
                quickRef.innerHTML = '';
                return;
            }
            const from = fromUnit.value;
            const to = toUnit.value;
            const cat = categories[currentCategory];
            let result;

            if (currentCategory === 'temperature') {
                result = convertTemperature(val, from, to);
            } else {
                const baseVal = val * cat.units[from].factor;
                result = baseVal / cat.units[to].factor;
            }

            resultValue.textContent = formatNumber(result);
            resultLabel.textContent = val + ' ' + cat.units[from].name.split('(')[0].trim() + ' = ' + formatNumber(result) + ' ' + cat.units[to].name.split('(')[0].trim();

            buildQuickRef(val, from);
        }

        function convertTemperature(val, from, to) {
            let celsius;
            if (from === 'celsius') celsius = val;
            else if (from === 'fahrenheit') celsius = (val - 32) * 5 / 9;
            else celsius = val - 273.15;

            if (to === 'celsius') return celsius;
            if (to === 'fahrenheit') return celsius * 9 / 5 + 32;
            return celsius + 273.15;
        }

        function formatNumber(num) {
            if (Number.isInteger(num)) return num.toLocaleString();
            if (Math.abs(num) < 0.000001 || Math.abs(num) > 999999999) return num.toExponential(6);
            const str = num.toPrecision(10);
            return parseFloat(str).toLocaleString(undefined, { maximumFractionDigits: 8 });
        }

        function buildQuickRef(val, from) {
            const cat = categories[currentCategory];
            const units = Object.keys(cat.units);
            quickRef.innerHTML = '';
            units.forEach(key => {
                if (key === from) return;
                let result;
                if (currentCategory === 'temperature') {
                    result = convertTemperature(val, from, key);
                } else {
                    const baseVal = val * cat.units[from].factor;
                    result = baseVal / cat.units[key].factor;
                }
                const item = document.createElement('div');
                item.className = 'quick-ref-item';
                item.innerHTML = '<span>' + cat.units[key].name.split('(')[0].trim() + '</span><span>' + formatNumber(result) + '</span>';
                quickRef.appendChild(item);
            });
        }

        function swapUnits() {
            const temp = fromUnit.value;
            fromUnit.value = toUnit.value;
            toUnit.value = temp;
            convert();
        }

        // Event listeners
        valueInput.addEventListener('input', convert);
        fromUnit.addEventListener('change', convert);
        toUnit.addEventListener('change', convert);
        swapBtn.addEventListener('click', swapUnits);

        // Initialize
        buildTabs();
        buildUnits();
        convert();
    })();
    </script>
</body>
</html>
