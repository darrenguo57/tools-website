<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timestamp Converter - UseEasyTool</title>
    <meta name="description" content="Convert Unix timestamps">

    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">

    <style>
        /* Tool Page Custom Styles */
        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .workspace-grid .full-width { grid-column: 1 / -1; }
        .textarea-wrap { position: relative; }
        .textarea-wrap textarea, .textarea-wrap input {
            width: 100%; min-height: 200px; padding: 1rem; border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); font-family: 'Courier New', monospace; font-size: 14px;
            resize: vertical; background: var(--color-bg); color: var(--color-text);
            box-sizing: border-box;
        }
        .textarea-wrap input { min-height: auto; resize: none; }
        .textarea-wrap textarea:focus, .textarea-wrap input:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .textarea-label { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: var(--font-size-sm); color: var(--color-text); }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1rem 0; }
        .char-count { font-size: 12px; color: var(--color-text-tertiary); text-align: right; margin-top: 0.25rem; }

        .timestamp-input-group { display: flex; gap: 1rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; justify-content: center; }
        .timestamp-input-group input { width: auto; min-height: auto; padding: 0.5rem 1rem; font-size: 16px; }
        .timestamp-input-group select { padding: 0.5rem 1rem; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-bg); color: var(--color-text); }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .result-item { background: var(--color-surface); padding: 1rem; border-radius: var(--radius-lg); border: 1px solid var(--color-border); }
        .result-label { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 0.25rem; }
        .result-value { font-size: 16px; font-weight: 500; word-break: break-all; cursor: pointer; }
        .result-value:hover { color: var(--color-primary); }
        .live-timestamp { text-align: center; padding: 1rem; background: var(--color-surface); border-radius: var(--radius-lg); border: 1px solid var(--color-border); margin-bottom: 1rem; }
        .live-timestamp .value { font-size: 24px; font-weight: 600; font-family: 'Courier New', monospace; }
        .error-msg { color: #ef4444; font-size: 12px; margin-top: 0.25rem; display: none; }

        @media (max-width: 768px) { .workspace-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="UseEasyTool"></i>
                <span>UseEasyTool</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_converters" data-i18n="cat_converters">Converters</a> / <span>Timestamp Converter</span></div></div>

    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="clock"></i></div>
                    <h1>Timestamp Converter</h1>
                    <p>Convert Unix timestamps</p>
                </div>

                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <div class="live-timestamp">
                        <div class="result-label">Current Timestamp (seconds)</div>
                        <div class="value" id="liveTs">-</div>
                    </div>

                    <div class="timestamp-input-group">
                        <input type="text" id="tsInput" placeholder="Enter timestamp...">
                        <select id="tsUnit">
                            <option value="seconds">Seconds</option>
                            <option value="milliseconds">Milliseconds</option>
                        </select>
                        <button class="btn btn-primary" id="convertTsBtn"><i data-lucide="play"></i><span>Convert</span></button>
                        <button class="btn btn-secondary" id="nowBtn"><i data-lucide="clock"></i><span>Now</span></button>
                    </div>
                    <div class="error-msg" id="tsError"></div>

                    <div class="result-grid">
                        <div class="result-item">
                            <div class="result-label">ISO 8601</div>
                            <div class="result-value" id="resIso" onclick="copyResult(this)">-</div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">UTC</div>
                            <div class="result-value" id="resUtc" onclick="copyResult(this)">-</div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">Local</div>
                            <div class="result-value" id="resLocal" onclick="copyResult(this)">-</div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">Relative</div>
                            <div class="result-value" id="resRelative" onclick="copyResult(this)">-</div>
                        </div>
                    </div>
                </div>

            </div>
            <aside class="tool-sidebar">
            </aside>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="#" data-i18n="footer_about">About</a>
                <a href="#" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="#" data-i18n="footer_terms">Terms of Service</a>
                <a href="#" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 UseEasyTool. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>

    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>

    <script>
    (function() {
        const tsInput = document.getElementById('tsInput');
        const tsUnit = document.getElementById('tsUnit');
        const tsError = document.getElementById('tsError');
        const liveTs = document.getElementById('liveTs');
        const convertTsBtn = document.getElementById('convertTsBtn');
        const nowBtn = document.getElementById('nowBtn');

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }
        }

        function updateLive() {
            liveTs.textContent = Math.floor(Date.now() / 1000);
        }
        updateLive();
        setInterval(updateLive, 1000);

        function setCurrentTs() {
            tsInput.value = Math.floor(Date.now() / 1000);
            tsUnit.value = 'seconds';
            tsToDate();
        }

        function tsToDate() {
            tsError.style.display = 'none';
            const val = tsInput.value.trim();
            if (!val) { tsError.textContent = 'Please enter a timestamp'; tsError.style.display = 'block'; return; }

            const num = Number(val);
            if (isNaN(num)) { tsError.textContent = 'Invalid number'; tsError.style.display = 'block'; return; }

            let ms = tsUnit.value === 'seconds' ? num * 1000 : num;
            if (ms < -8640000000000 || ms > 8640000000000) {
                tsError.textContent = 'Timestamp out of range';
                tsError.style.display = 'block';
                return;
            }

            const date = new Date(ms);
            if (isNaN(date.getTime())) { tsError.textContent = 'Invalid timestamp'; tsError.style.display = 'block'; return; }

            document.getElementById('resIso').textContent = date.toISOString();
            document.getElementById('resUtc').textContent = date.toUTCString();
            document.getElementById('resLocal').textContent = date.toLocaleString();
            document.getElementById('resRelative').textContent = getRelativeTime(date);
        }

        function getRelativeTime(date) {
            const now = new Date();
            const diff = now - date;
            const absDiff = Math.abs(diff);
            const isPast = diff > 0;
            const prefix = isPast ? '' : 'in ';
            const suffix = isPast ? ' ago' : '';

            if (absDiff < 60000) return prefix + Math.floor(absDiff / 1000) + ' seconds' + suffix;
            if (absDiff < 3600000) return prefix + Math.floor(absDiff / 60000) + ' minutes' + suffix;
            if (absDiff < 86400000) return prefix + Math.floor(absDiff / 3600000) + ' hours' + suffix;
            if (absDiff < 2592000000) return prefix + Math.floor(absDiff / 86400000) + ' days' + suffix;
            if (absDiff < 31536000000) return prefix + Math.floor(absDiff / 2592000000) + ' months' + suffix;
            return prefix + (absDiff / 31536000000).toFixed(1) + ' years' + suffix;
        }

        window.copyResult = function(el) {
            const text = el.textContent;
            if (text === '-') return;
            navigator.clipboard.writeText(text).then(() => {
                showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied: ' + text);
            });
        };

        // Event listeners
        convertTsBtn.addEventListener('click', tsToDate);
        nowBtn.addEventListener('click', setCurrentTs);
        tsInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tsToDate(); });
    })();
    </script>
</body>
</html>
