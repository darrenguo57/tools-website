<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encoder/Decoder - ToolBox</title>
    <meta name="description" content="Encode and decode Base64 strings online">

    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">

    <style>
        /* Tool Page Custom Styles */
        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .workspace-grid .full-width { grid-column: 1 / -1; }
        .textarea-wrap { position: relative; }
        .textarea-wrap textarea, .textarea-wrap input {
            width: 100%; min-height: 200px; padding: 1rem; border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); font-family: 'Courier New', monospace; font-size: 14px;
            resize: vertical; background: var(--color-bg); color: var(--color-text);
            box-sizing: border-box;
        }
        .textarea-wrap input { min-height: auto; resize: none; }
        .textarea-wrap textarea:focus, .textarea-wrap input:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .textarea-label { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: var(--font-size-sm); color: var(--color-text); }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1rem 0; }
        .char-count { font-size: 12px; color: var(--color-text-tertiary); text-align: right; margin-top: 0.25rem; }

        @media (max-width: 768px) { .workspace-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="toolbox"></i>
                <span>ToolBox</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_converters" data-i18n="cat_converters">Converters</a> / <span>Base64 Encoder/Decoder</span></div></div>

    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="arrow-left-right"></i></div>
                    <h1>Base64 Encoder/Decoder</h1>
                    <p>Encode and decode Base64 strings online</p>
                </div>

                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <div class="workspace-grid">
                        <div>
                            <div class="textarea-label">
                                <i data-lucide="file-text"></i>
                                <span data-i18n="input_label">Input</span>
                            </div>
                            <div class="textarea-wrap">
                                <textarea id="inputArea" data-i18n-placeholder="input_placeholder" placeholder="Enter text..."></textarea>
                            </div>
                            <div class="char-count"><span id="inputCount">0</span> <span data-i18n="char_count">characters</span></div>
                        </div>
                        <div>
                            <div class="textarea-label">
                                <i data-lucide="file-output"></i>
                                <span data-i18n="output_label">Output</span>
                            </div>
                            <div class="textarea-wrap">
                                <textarea id="outputArea" data-i18n-placeholder="output_placeholder" placeholder="Result..." readonly></textarea>
                            </div>
                            <div class="char-count"><span id="outputCount">0</span> <span data-i18n="char_count">characters</span></div>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" id="encodeBtn"><i data-lucide="lock"></i><span data-i18n="btn_encode">Encode</span></button>
                        <button class="btn btn-primary" id="decodeBtn"><i data-lucide="unlock"></i><span data-i18n="btn_decode">Decode</span></button>
                        <button class="btn btn-secondary" id="copyBtn"><i data-lucide="copy"></i><span data-i18n="btn_copy">Copy</span></button>
                        <button class="btn btn-danger" id="clearBtn"><i data-lucide="trash-2"></i><span data-i18n="btn_clear">Clear</span></button>
                    </div>
                </div>

                <!-- Ad Slot -->
                <div class="ad-slot" style="margin-top:2rem">
                    <span data-i18n="ad_label">Advertisement</span>
                </div>
            </div>
            <aside class="tool-sidebar">
                <div class="ad-slot">
                    <span data-i18n="ad_label">Advertisement</span>
                </div>
            </aside>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="#" data-i18n="footer_about">About</a>
                <a href="#" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="#" data-i18n="footer_terms">Terms of Service</a>
                <a href="#" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 ToolBox. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>

    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>

    <script>
    (function() {
        const inputArea = document.getElementById('inputArea');
        const outputArea = document.getElementById('outputArea');
        const inputCount = document.getElementById('inputCount');
        const outputCount = document.getElementById('outputCount');
        const encodeBtn = document.getElementById('encodeBtn');
        const decodeBtn = document.getElementById('decodeBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }
        }

        function utf8ToBase64(str) {
            const encoder = new TextEncoder();
            const uint8Array = encoder.encode(str);
            let binary = '';
            uint8Array.forEach(byte => binary += String.fromCharCode(byte));
            return btoa(binary);
        }

        function base64ToUtf8(base64) {
            const binary = atob(base64);
            const uint8Array = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                uint8Array[i] = binary.charCodeAt(i);
            }
            return new TextDecoder().decode(uint8Array);
        }

        function encodeBase64() {
            const input = inputArea.value;
            if (!input) {
                showToast(typeof I18n !== 'undefined' ? I18n.t('toast.inputRequired') : 'Please enter some text to encode');
                return;
            }
            try {
                outputArea.value = utf8ToBase64(input);
                outputCount.textContent = outputArea.value.length;
                showToast(typeof I18n !== 'undefined' ? I18n.t('toast.converted') : 'Encoded successfully');
            } catch (e) {
                outputArea.value = '';
                outputCount.textContent = '0';
                showToast('Error: ' + e.message);
            }
        }

        function decodeBase64() {
            const input = inputArea.value.trim();
            if (!input) {
                showToast(typeof I18n !== 'undefined' ? I18n.t('toast.inputRequired') : 'Please enter Base64 string to decode');
                return;
            }
            try {
                outputArea.value = base64ToUtf8(input);
                outputCount.textContent = outputArea.value.length;
                showToast(typeof I18n !== 'undefined' ? I18n.t('toast.converted') : 'Decoded successfully');
            } catch (e) {
                outputArea.value = '';
                outputCount.textContent = '0';
                showToast(typeof I18n !== 'undefined' ? I18n.t('toast.error') : 'Invalid Base64 string');
            }
        }

        function copyOutput() {
            if (!outputArea.value) {
                showToast(typeof I18n !== 'undefined' ? I18n.t('toast.inputRequired') : 'Nothing to copy');
                return;
            }
            navigator.clipboard.writeText(outputArea.value).then(() => {
                showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied to clipboard');
            }).catch(() => {
                outputArea.select();
                document.execCommand('copy');
                showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied to clipboard');
            });
        }

        function clearAll() {
            inputArea.value = '';
            outputArea.value = '';
            inputCount.textContent = '0';
            outputCount.textContent = '0';
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.cleared') : 'Cleared');
        }

        // Event listeners
        encodeBtn.addEventListener('click', encodeBase64);
        decodeBtn.addEventListener('click', decodeBase64);
        copyBtn.addEventListener('click', copyOutput);
        clearBtn.addEventListener('click', clearAll);

        inputArea.addEventListener('input', () => {
            inputCount.textContent = inputArea.value.length;
        });
    })();
    </script>
</body>
</html>
