    <script>
    // Global variables
    const canvas = document.getElementById('gaugeCanvas');
    const ctx = canvas ? canvas.getContext('2d') : null;

    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }
    });
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    }
    
    function copyOutput() {
        const output = document.getElementById('outputArea');
        if (!output || !output.value) {
            showToast('Nothing to copy');
            return;
        }
        navigator.clipboard.writeText(output.value).then(() => {
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        }).catch(() => {
            output.select();
            document.execCommand('copy');
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        });
    }
    
    function clearAll() {
        const input = document.getElementById('inputArea');
        const output = document.getElementById('outputArea');
        const inputCount = document.getElementById('inputCount');
        const outputCount = document.getElementById('outputCount');
        if (input) input.value = '';
        if (output) output.value = '';
        if (inputCount) inputCount.textContent = '0';
        if (outputCount) outputCount.textContent = '0';
        showToast(typeof I18n !== 'undefined' ? I18n.t('toast.cleared') : 'Cleared');
    }
    
    function drawGauge() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = 500 * dpr;
      canvas.height = 350 * dpr;
      canvas.style.width = '500px';
      canvas.style.height = '350px';
      ctx.scale(dpr, dpr);

      const value = parseFloat(document.getElementById('gaugeValue').value) || 0;
      const min = parseFloat(document.getElementById('gaugeMin').value) || 0;
      const max = parseFloat(document.getElementById('gaugeMax').value) || 100;
      const unit = document.getElementById('gaugeUnit').value;
      const title = document.getElementById('gaugeTitle').value;
      const style = document.getElementById('gaugeStyle').value;
      const greenEnd = parseFloat(document.getElementById('greenEnd').value) || 60;
      const yellowEnd = parseFloat(document.getElementById('yellowEnd').value) || 80;
      const redEnd = parseFloat(document.getElementById('redEnd').value) || 100;

      const cx = 250, cy = 220;
      const radius = 160;
      const lineWidth = 25;

      let startAngle, endAngle;
      if (style === 'half') { startAngle = Math.PI; endAngle = 2 * Math.PI; }
      else if (style === 'threequarter') { startAngle = 0.75 * Math.PI; endAngle = 2.25 * Math.PI; }
      else { startAngle = 0; endAngle = 2 * Math.PI; }

      const totalAngle = endAngle - startAngle;
      const range = max - min;

      ctx.clearRect(0, 0, 500, 350);

      // Draw zones
      const zones = [
        { end: greenEnd, color: '#10B981' },
        { end: yellowEnd, color: '#F59E0B' },
        { end: redEnd, color: '#EF4444' }
      ];
      let prevEnd = min;
      zones.forEach(zone => {
        const sA = startAngle + ((prevEnd - min) / range) * totalAngle;
        const eA = startAngle + ((zone.end - min) / range) * totalAngle;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, sA, eA);
        ctx.strokeStyle = zone.color + '40';
        ctx.lineWidth = lineWidth;
        ctx.lineCap = 'butt';
        ctx.stroke();
        prevEnd = zone.end;
      });

      // Draw active arc
      const clampedValue = Math.max(min, Math.min(max, value));
      const valueAngle = startAngle + ((clampedValue - min) / range) * totalAngle;

      // Determine color
      let activeColor = '#10B981';
      if (clampedValue > yellowEnd) activeColor = '#EF4444';
      else if (clampedValue > greenEnd) activeColor = '#F59E0B';

      ctx.beginPath();
      ctx.arc(cx, cy, radius, startAngle, valueAngle);
      ctx.strokeStyle = activeColor;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Draw tick marks
      const tickCount = 10;
      for (let i = 0; i <= tickCount; i++) {
        const angle = startAngle + (i / tickCount) * totalAngle;
        const innerR = radius - lineWidth / 2 - 8;
        const outerR = radius - lineWidth / 2 - 3;
        ctx.beginPath();
        ctx.moveTo(cx + innerR * Math.cos(angle), cy + innerR * Math.sin(angle));
        ctx.lineTo(cx + outerR * Math.cos(angle), cy + outerR * Math.sin(angle));
        ctx.strokeStyle = '#9CA3AF';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Labels
        const labelR = radius + lineWidth / 2 + 18;
        const labelVal = min + (i / tickCount) * range;
        ctx.fillStyle = '#6B7280';
        ctx.font = '500 11px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(Math.round(labelVal).toString(), cx + labelR * Math.cos(angle), cy + labelR * Math.sin(angle));
      }

      // Needle
      const needleLen = radius - lineWidth / 2 - 15;
      const needleAngle = valueAngle;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(needleAngle);
      ctx.beginPath();
      ctx.moveTo(0, -3);
      ctx.lineTo(needleLen, 0);
      ctx.lineTo(0, 3);
      ctx.closePath();
      ctx.fillStyle = '#374151';
      ctx.fill();
      ctx.restore();

      // Center circle
      ctx.beginPath();
      ctx.arc(cx, cy, 12, 0, Math.PI * 2);
      ctx.fillStyle = '#374151';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();

      // Value text
      ctx.fillStyle = '#1F2937';
      ctx.font = '700 36px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(clampedValue + unit, cx, cy + 50);

      // Title
      ctx.fillStyle = '#6B7280';
      ctx.font = '500 14px Inter, sans-serif';
      ctx.fillText(title, cx, cy + 80);
    }

    document.getElementById('btnGenerate').addEventListener('click', drawGauge);

    document.getElementById('btnDownloadPNG').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'gauge-chart.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  })();
  </script>
