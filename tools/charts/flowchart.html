    <script>
    // Global variables
    let renderCount = 0;

    // Initialize Mermaid
    if (typeof mermaid !== 'undefined') {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'default',
        securityLevel: 'loose'
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }
    });
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    }
    
    function copyOutput() {
        const output = document.getElementById('outputArea');
        if (!output || !output.value) {
            showToast('Nothing to copy');
            return;
        }
        navigator.clipboard.writeText(output.value).then(() => {
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        }).catch(() => {
            output.select();
            document.execCommand('copy');
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        });
    }
    
    function clearAll() {
        const input = document.getElementById('inputArea');
        const output = document.getElementById('outputArea');
        const inputCount = document.getElementById('inputCount');
        const outputCount = document.getElementById('outputCount');
        if (input) input.value = '';
        if (output) output.value = '';
        if (inputCount) inputCount.textContent = '0';
        if (outputCount) outputCount.textContent = '0';
        showToast(typeof I18n !== 'undefined' ? I18n.t('toast.cleared') : 'Cleared');
    }
    
    function renderDiagram() {
      const code = document.getElementById('mermaidInput').value.trim();
      if (!code) return;
      const preview = document.getElementById('mermaidPreview');
      try {
        renderCount++;
        const id = 'mermaid-svg-' + renderCount;
        const { svg } = await mermaid.render(id, code);
        preview.innerHTML = svg;
      } catch(e) {
        preview.innerHTML = '<div style="color:var(--color-error);padding:var(--space-4);">Error: ' + e.message + '</div>';
      }
    }

    document.getElementById('btnRender').addEventListener('click', renderDiagram);

    document.getElementById('btnDownloadSVG').addEventListener('click', () => {
      const svg = document.querySelector('#mermaidPreview svg');
      if (!svg) return;
      const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml' });
      const link = document.createElement('a');
      link.download = 'flowchart.svg';
      link.href = URL.createObjectURL(blob);
      link.click();
    });

    document.getElementById('btnDownloadPNG').addEventListener('click', () => {
      const svg = document.querySelector('#mermaidPreview svg');
      if (!svg) return;
      const svgData = new XMLSerializer().serializeToString(svg);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = function() {
        canvas.width = img.width * 2;
        canvas.height = img.height * 2;
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.scale(2, 2);
        ctx.drawImage(img, 0, 0);
        const link = document.createElement('a');
        link.download = 'flowchart.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    });
  })();
  </script>
