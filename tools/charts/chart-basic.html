<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Charts - UseEasyTool</title>
    <meta name="description" content="Create basic charts">
    
    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    
    <style>
        /* Tool Page Custom Styles */
        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .workspace-grid .full-width { grid-column: 1 / -1; }
        .textarea-wrap { position: relative; }
        .textarea-wrap textarea, .textarea-wrap input {
            width: 100%; min-height: 200px; padding: 1rem; border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); font-family: 'Courier New', monospace; font-size: 14px;
            resize: vertical; background: var(--color-bg); color: var(--color-text);
            box-sizing: border-box;
        }
        .textarea-wrap input { min-height: auto; resize: none; }
        .textarea-wrap textarea:focus, .textarea-wrap input:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .textarea-label { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: var(--font-size-sm); color: var(--color-text); }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1rem 0; }
        .char-count { font-size: 12px; color: var(--color-text-tertiary); text-align: right; margin-top: 0.25rem; }
        .chart-controls { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .chart-controls label { display: flex; align-items: center; gap: 0.5rem; font-size: 14px; }
        .chart-controls select, .chart-controls input { padding: 0.5rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-text); }
        .chart-controls input[type="checkbox"] { width: auto; }
        .chart-container { position: relative; width: 100%; min-height: 400px; background: var(--color-surface); border-radius: var(--radius-lg); padding: 1rem; }
        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        .data-table th, .data-table td { padding: 0.5rem; text-align: left; border-bottom: 1px solid var(--color-border); }
        .data-table th { font-weight: 600; background: var(--color-bg); }
        .data-table input { width: 100%; padding: 0.5rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-text); }

        @media (max-width: 768px) { .workspace-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="UseEasyTool"></i>
                <span>UseEasyTool</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>
    
    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_charts" data-i18n="cat_charts">Charts</a> / <span>Basic Charts</span></div></div>
    
    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="bar-chart-3"></i></div>
                    <h1>Basic Charts</h1>
                    <p>Create basic charts</p>
                </div>
                
                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <div class="workspace-grid">
                        <div>
                            <div class="textarea-label">
                                <i data-lucide="file-text"></i>
                                <span data-i18n="input_label">Data Input</span>
                            </div>
                            <div class="chart-controls">
                                <label>
                                    <span>Type:</span>
                                    <select id="chartType">
                                        <option value="bar">Bar Chart</option>
                                        <option value="line">Line Chart</option>
                                        <option value="pie">Pie Chart</option>
                                        <option value="doughnut">Doughnut Chart</option>
                                        <option value="radar">Radar Chart</option>
                                        <option value="polarArea">Polar Area</option>
                                    </select>
                                </label>
                                <label>
                                    <span>Theme:</span>
                                    <select id="colorTheme">
                                        <option value="vibrant">Vibrant</option>
                                        <option value="pastel">Pastel</option>
                                        <option value="earth">Earth</option>
                                        <option value="ocean">Ocean</option>
                                        <option value="sunset">Sunset</option>
                                    </select>
                                </label>
                                <label>
                                    <span>Title:</span>
                                    <input type="text" id="chartTitle" placeholder="Chart Title">
                                </label>
                                <label>
                                    <input type="checkbox" id="showLegend" checked>
                                    <span>Legend</span>
                                </label>
                                <label>
                                    <input type="checkbox" id="enableAnimation" checked>
                                    <span>Animation</span>
                                </label>
                            </div>
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Label</th>
                                        <th>Value</th>
                                        <th style="width: 40px;"></th>
                                    </tr>
                                </thead>
                                <tbody id="dataBody">
                                    <tr>
                                        <td><input type="text" value="January" class="label-input"></td>
                                        <td><input type="number" value="65" class="value-input"></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <td><input type="text" value="February" class="label-input"></td>
                                        <td><input type="number" value="59" class="value-input"></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <td><input type="text" value="March" class="label-input"></td>
                                        <td><input type="number" value="80" class="value-input"></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <td><input type="text" value="April" class="label-input"></td>
                                        <td><input type="number" value="81" class="value-input"></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <td><input type="text" value="May" class="label-input"></td>
                                        <td><input type="number" value="56" class="value-input"></td>
                                        <td></td>
                                    </tr>
                                </tbody>
                            </table>
                            <div class="btn-group">
                                <button class="btn btn-secondary" id="btnAddRow"><i data-lucide="plus"></i><span>Add Row</span></button>
                                <button class="btn btn-secondary" id="btnClearData"><i data-lucide="trash-2"></i><span>Clear</span></button>
                                <button class="btn btn-primary" id="btnGenerate"><i data-lucide="play"></i><span>Generate</span></button>
                            </div>
                        </div>
                    </div>
                    <div class="chart-container">
                        <div id="chartPlaceholder" style="display: flex; align-items: center; justify-content: center; height: 400px; color: var(--color-text-tertiary);">
                            Click "Generate" to create chart
                        </div>
                        <canvas id="chartCanvas" style="display: none; max-height: 400px;"></canvas>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-secondary" id="btnDownloadPNG"><i data-lucide="download"></i><span data-i18n="btn_download_png">Download PNG</span></button>
                        <button class="btn btn-secondary" id="btnDownloadSVG"><i data-lucide="download"></i><span data-i18n="btn_download_svg">Download SVG</span></button>
                    </div>
                </div>
                
            </div>
            <aside class="tool-sidebar">
            </aside>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="#" data-i18n="footer_about">About</a>
                <a href="#" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="#" data-i18n="footer_terms">Terms of Service</a>
                <a href="#" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 UseEasyTool. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>
    
    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>
    
    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>
    
    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>

    <script>
    // Global variables
    let chartInstance = null;
    const colorThemes = {
      vibrant: ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899', '#06B6D4'],
      pastel: ['#93C5FD', '#86EFAC', '#FCD34D', '#FCA5A5', '#C4B5FD', '#F9A8D4', '#67E8F9'],
      earth: ['#92400E', '#78716C', '#84CC16', '#65A30D', '#A3E635', '#D97706', '#78716C'],
      ocean: ['#0EA5E9', '#06B6D4', '#0891B2', '#155E75', '#22D3EE', '#7DD3FC', '#0C4A6E'],
      sunset: ['#F97316', '#FB923C', '#FDBA74', '#FED7AA', '#FFEDD5', '#FF8C00', '#CC7000']
    };

    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }
    });
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    }
    
    function copyOutput() {
        const output = document.getElementById('outputArea');
        if (!output || !output.value) {
            showToast('Nothing to copy');
            return;
        }
        navigator.clipboard.writeText(output.value).then(() => {
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        }).catch(() => {
            output.select();
            document.execCommand('copy');
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        });
    }
    
    function clearAll() {
        const input = document.getElementById('inputArea');
        const output = document.getElementById('outputArea');
        const inputCount = document.getElementById('inputCount');
        const outputCount = document.getElementById('outputCount');
        if (input) input.value = '';
        if (output) output.value = '';
        if (inputCount) inputCount.textContent = '0';
        if (outputCount) outputCount.textContent = '0';
        showToast(typeof I18n !== 'undefined' ? I18n.t('toast.cleared') : 'Cleared');
    }
    
    function getColors(count) {
      const theme = document.getElementById('colorTheme').value;
      const palette = colorThemes[theme] || colorThemes.vibrant;
      const colors = [];
      for (let i = 0; i < count; i++) colors.push(palette[i % palette.length]);
      return colors;
    }

    function getData() {
      const labels = [], values = [];
      document.querySelectorAll('#dataBody tr').forEach(row => {
        const label = row.querySelector('.label-input').value.trim();
        const value = parseFloat(row.querySelector('.value-input').value);
        if (label && !isNaN(value)) { labels.push(label); values.push(value); }
      });
      return { labels, values };
    }

    function generateChart() {
      const { labels, values } = getData();
      if (labels.length === 0) return;

      const type = document.getElementById('chartType').value;
      const title = document.getElementById('chartTitle').value;
      const showLegend = document.getElementById('showLegend').checked;
      const enableAnimation = document.getElementById('enableAnimation').checked;
      const colors = getColors(labels.length);

      if (chartInstance) chartInstance.destroy();

      document.getElementById('chartPlaceholder').style.display = 'none';
      const canvas = document.getElementById('chartCanvas');
      canvas.style.display = 'block';

      const bgColors = colors.map(c => c + 'CC');
      const isCartesian = ['bar','line'].includes(type);

      const dataset = {
        label: title || 'Dataset',
        data: values,
        backgroundColor: type === 'line' ? colors[0] + '33' : bgColors,
        borderColor: type === 'line' ? colors[0] : colors,
        borderWidth: type === 'line' ? 3 : 2,
        tension: 0.4,
        fill: type === 'line',
        pointBackgroundColor: colors[0],
        pointRadius: type === 'line' ? 5 : 0,
        pointHoverRadius: type === 'line' ? 8 : 0,
        borderRadius: type === 'bar' ? 6 : 0,
      };

      chartInstance = new Chart(canvas, {
        type: type,
        data: { labels, datasets: [dataset] },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          animation: enableAnimation ? { duration: 800, easing: 'easeOutQuart' } : false,
          plugins: {
            legend: { display: showLegend, position: 'top', labels: { usePointStyle: true, padding: 20, font: { family: 'Inter', size: 13 } } },
            title: { display: !!title, text: title, font: { family: 'Inter', size: 18, weight: '600' }, padding: { bottom: 20 } },
            tooltip: { backgroundColor: 'rgba(0,0,0,0.8)', titleFont: { family: 'Inter' }, bodyFont: { family: 'Inter' }, cornerRadius: 8, padding: 12 }
          },
          scales: isCartesian ? {
            x: { grid: { display: false }, ticks: { font: { family: 'Inter', size: 12 } } },
            y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.06)' }, ticks: { font: { family: 'Inter', size: 12 } } }
          } : {}
        }
      });
    }

    function addRow(label, value) {
      const tbody = document.getElementById('dataBody');
      const tr = document.createElement('tr');
      tr.innerHTML = '<td><input type="text" value="' + (label||'') + '" class="label-input"></td><td><input type="number" value="' + (value||0) + '" class="value-input"></td><td><button class="btn-remove-row" title="Remove"><i data-lucide="x" style="width:16px;height:16px;"></i></button></td>';
      tbody.appendChild(tr);
      tr.querySelector('.btn-remove-row').addEventListener('click', function() { tr.remove(); });
      lucide.createIcons();
    }

    document.getElementById('btnAddRow').addEventListener('click', () => addRow('', 0));
    document.getElementById('btnClearData').addEventListener('click', () => { document.getElementById('dataBody').innerHTML = ''; });
    document.getElementById('btnGenerate').addEventListener('click', generateChart);

    document.getElementById('btnDownloadPNG').addEventListener('click', () => {
      if (!chartInstance) return;
      const link = document.createElement('a');
      link.download = 'chart.png';
      link.href = document.getElementById('chartCanvas').toDataURL('image/png', 1.0);
      link.click();
    });

    document.getElementById('btnDownloadSVG').addEventListener('click', () => {
      if (!chartInstance) return;
      const canvas = document.getElementById('chartCanvas');
      const svgData = '<svg xmlns="http://www.w3.org/2000/svg" width="' + canvas.width + '" height="' + canvas.height + '"><image href="' + canvas.toDataURL('image/png') + '" width="' + canvas.width + '" height="' + canvas.height + '"/></svg>';
      const blob = new Blob([svgData], { type: 'image/svg+xml' });
      const link = document.createElement('a');
      link.download = 'chart.svg';
      link.href = URL.createObjectURL(blob);
      link.click();
    });

    document.querySelectorAll('.btn-remove-row').forEach(btn => {
      btn.addEventListener('click', function() { this.closest('tr').remove(); });
    });
  })();
  </script>
</body>
</html>
