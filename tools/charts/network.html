    <script>
    // Global variables
    const canvas = document.getElementById('networkCanvas');
    const ctx = canvas ? canvas.getContext('2d') : null;
    let nodes = [];
    let edges = [];
    const colors = ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899', '#06B6D4'];

    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }
    });
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    }
    
    function copyOutput() {
        const output = document.getElementById('outputArea');
        if (!output || !output.value) {
            showToast('Nothing to copy');
            return;
        }
        navigator.clipboard.writeText(output.value).then(() => {
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        }).catch(() => {
            output.select();
            document.execCommand('copy');
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        });
    }
    
    function clearAll() {
        const input = document.getElementById('inputArea');
        const output = document.getElementById('outputArea');
        const inputCount = document.getElementById('inputCount');
        const outputCount = document.getElementById('outputCount');
        if (input) input.value = '';
        if (output) output.value = '';
        if (inputCount) inputCount.textContent = '0';
        if (outputCount) outputCount.textContent = '0';
        showToast(typeof I18n !== 'undefined' ? I18n.t('toast.cleared') : 'Cleared');
    }
    
    function parseInput() {
      const nodeNames = document.getElementById('nodesInput').value.split(',').map(s => s.trim()).filter(Boolean);
      const edgeLines = document.getElementById('edgesInput').value.trim().split('\n').filter(Boolean);
      const edgeList = edgeLines.map(l => {
        const parts = l.split('->').map(s => s.trim());
        return parts.length === 2 ? { source: parts[0], target: parts[1] } : null;
      }).filter(Boolean);

      nodes = nodeNames.map((name, i) => ({
        id: name, label: name,
        x: 0, y: 0, vx: 0, vy: 0,
        color: colors[i % colors.length]
      }));

      edges = edgeList.map(e => ({
        source: nodes.find(n => n.id === e.source),
        target: nodes.find(n => n.id === e.target)
      })).filter(e => e.source && e.target);
    }

    function applyLayout(type) {
      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);
      const cx = w / 2, cy = h / 2;

      if (type === 'circular') {
        const r = Math.min(w, h) * 0.35;
        nodes.forEach((n, i) => {
          const angle = (2 * Math.PI * i) / nodes.length - Math.PI / 2;
          n.x = cx + r * Math.cos(angle);
          n.y = cy + r * Math.sin(angle);
        });
      } else if (type === 'grid') {
        const cols = Math.ceil(Math.sqrt(nodes.length));
        const rows = Math.ceil(nodes.length / cols);
        const gapX = (w - 100) / cols;
        const gapY = (h - 100) / rows;
        nodes.forEach((n, i) => {
          n.x = 50 + (i % cols) * gapX + gapX / 2;
          n.y = 50 + Math.floor(i / cols) * gapY + gapY / 2;
        });
      } else {
        // Force-directed: initialize randomly
        nodes.forEach(n => {
          n.x = cx + (Math.random() - 0.5) * w * 0.5;
          n.y = cy + (Math.random() - 0.5) * h * 0.5;
          n.vx = 0; n.vy = 0;
        });
        // Run simulation
        for (let iter = 0; iter < 300; iter++) {
          const alpha = 1 - iter / 300;
          // Repulsion
          for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
              let dx = nodes[j].x - nodes[i].x;
              let dy = nodes[j].y - nodes[i].y;
              let dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
              let force = 5000 / (dist * dist) * alpha;
              let fx = (dx / dist) * force;
              let fy = (dy / dist) * force;
              nodes[i].vx -= fx; nodes[i].vy -= fy;
              nodes[j].vx += fx; nodes[j].vy += fy;
            }
          }
          // Attraction
          edges.forEach(e => {
            let dx = e.target.x - e.source.x;
            let dy = e.target.y - e.source.y;
            let dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
            let force = (dist - 120) * 0.01 * alpha;
            let fx = (dx / dist) * force;
            let fy = (dy / dist) * force;
            e.source.vx += fx; e.source.vy += fy;
            e.target.vx -= fx; e.target.vy -= fy;
          });
          // Center gravity
          nodes.forEach(n => {
            n.vx += (cx - n.x) * 0.001 * alpha;
            n.vy += (cy - n.y) * 0.001 * alpha;
            n.vx *= 0.9; n.vy *= 0.9;
            n.x += n.vx; n.y += n.vy;
          });
        }
      }
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.width / dpr;
      const h = canvas.height / dpr;
      const nodeR = parseInt(document.getElementById('nodeSize').value);

      ctx.clearRect(0, 0, w, h);

      // Draw edges
      edges.forEach(e => {
        ctx.strokeStyle = '#D1D5DB';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(e.source.x, e.source.y);
        ctx.lineTo(e.target.x, e.target.y);
        ctx.stroke();

        // Arrow
        const angle = Math.atan2(e.target.y - e.source.y, e.target.x - e.source.x);
        const arrowLen = 10;
        const ax = e.target.x - Math.cos(angle) * (nodeR + 4);
        const ay = e.target.y - Math.sin(angle) * (nodeR + 4);
        ctx.fillStyle = '#9CA3AF';
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax - arrowLen * Math.cos(angle - 0.3), ay - arrowLen * Math.sin(angle - 0.3));
        ctx.lineTo(ax - arrowLen * Math.cos(angle + 0.3), ay - arrowLen * Math.sin(angle + 0.3));
        ctx.closePath();
        ctx.fill();
      });

      // Draw nodes
      nodes.forEach(n => {
        // Shadow
        ctx.shadowColor = n.color + '40';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 2;

        ctx.fillStyle = n.color;
        ctx.beginPath();
        ctx.arc(n.x, n.y, nodeR, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;

        // Border
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Label
        ctx.fillStyle = '#fff';
        ctx.font = '600 ' + Math.max(10, nodeR * 0.6) + 'px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(n.label, n.x, n.y);
      });
    }

    function generate() {
      parseInput();
      if (nodes.length === 0) return;

      const dpr = window.devicePixelRatio || 1;
      const containerW = canvas.parentElement.getBoundingClientRect().width;
      canvas.width = containerW * dpr;
      canvas.height = 500 * dpr;
      canvas.style.width = containerW + 'px';
      canvas.style.height = '500px';
      ctx.scale(dpr, dpr);

      const layout = document.getElementById('layout').value;
      applyLayout(layout);
      draw();
    }

    document.getElementById('btnGenerate').addEventListener('click', generate);

    document.getElementById('btnDownloadPNG').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'network-graph.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  })();
  </script>
