<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Chart - ToolBox</title>
    <meta name="description" content="Live updating charts">
    
    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    
    <style>
        /* Tool Page Custom Styles */
        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .workspace-grid .full-width { grid-column: 1 / -1; }
        .textarea-wrap { position: relative; }
        .textarea-wrap textarea, .textarea-wrap input {
            width: 100%; min-height: 200px; padding: 1rem; border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); font-family: 'Courier New', monospace; font-size: 14px;
            resize: vertical; background: var(--color-bg); color: var(--color-text);
            box-sizing: border-box;
        }
        .textarea-wrap input { min-height: auto; resize: none; }
        .textarea-wrap textarea:focus, .textarea-wrap input:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .textarea-label { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: var(--font-size-sm); color: var(--color-text); }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1rem 0; }
        .char-count { font-size: 12px; color: var(--color-text-tertiary); text-align: right; margin-top: 0.25rem; }
        .chart-controls { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
        .chart-controls label { display: flex; align-items: center; gap: 0.5rem; font-size: 14px; }
        .chart-controls select, .chart-controls input { padding: 0.5rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-text); }
        .chart-container { position: relative; width: 100%; min-height: 400px; background: var(--color-surface); border-radius: var(--radius-lg); padding: 1rem; }
        .status-badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0.75rem; border-radius: var(--radius-full); font-size: 13px; font-weight: 500; }
        .status-badge.stopped { background: #E5E7EB; color: #6B7280; }
        .status-badge.paused { background: #FEF3C7; color: #92400E; }
        .status-badge.running { background: #D1FAE5; color: #065F46; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-dot.stopped { background: #9CA3AF; }
        .status-dot.paused { background: #F59E0B; }
        .status-dot.running { background: #10B981; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        @media (max-width: 768px) { .workspace-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="toolbox"></i>
                <span>ToolBox</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>
    
    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_charts" data-i18n="cat_charts">Charts</a> / <span>Real-time Chart</span></div></div>
    
    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="activity"></i></div>
                    <h1>Real-time Chart</h1>
                    <p>Live updating charts</p>
                </div>
                
                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <div class="chart-controls">
                        <div id="statusBadge" class="status-badge stopped">
                            <span class="status-dot stopped"></span>
                            <span>Stopped</span>
                        </div>
                        <label>
                            <span data-i18n="chart_type">Chart Type:</span>
                            <select id="chartType">
                                <option value="line">Line</option>
                                <option value="bar">Bar</option>
                            </select>
                        </label>
                        <label>
                            <span data-i18n="chart_data_source">Data Source:</span>
                            <select id="dataSource">
                                <option value="sine">Sine Wave</option>
                                <option value="random">Random</option>
                                <option value="incremental">Incremental</option>
                            </select>
                        </label>
                        <label>
                            <span data-i18n="chart_max_points">Max Points:</span>
                            <input type="number" id="maxPoints" value="30" min="10" max="100" style="width: 70px;">
                        </label>
                        <label>
                            <span>Speed (ms):</span>
                            <input type="range" id="speedSlider" min="100" max="2000" value="500" style="width: 100px;">
                        </label>
                        <span id="pointCount">0 points</span>
                    </div>
                    <div class="chart-container">
                        <canvas id="chartCanvas" style="max-height: 400px;"></canvas>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" id="btnStart"><i data-lucide="play"></i><span>Start</span></button>
                        <button class="btn btn-secondary" id="btnPause" disabled><i data-lucide="pause"></i><span>Pause</span></button>
                        <button class="btn btn-danger" id="btnReset"><i data-lucide="rotate-ccw"></i><span>Reset</span></button>
                    </div>
                </div>
                
            </div>
            <aside class="tool-sidebar">
            </aside>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="#" data-i18n="footer_about">About</a>
                <a href="#" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="#" data-i18n="footer_terms">Terms of Service</a>
                <a href="#" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 ToolBox. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>
    
    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>
    
    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>
    
    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>

    <script>
    // Global variables
    let chartInstance = null;
    let isRunning = false;
    let intervalId = null;
    let tick = 0;
    let dataPoints = [];
    let labels = [];
    const speedSlider = { value: 500 };

    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }
    });
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    }
    
    function copyOutput() {
        const output = document.getElementById('outputArea');
        if (!output || !output.value) {
            showToast('Nothing to copy');
            return;
        }
        navigator.clipboard.writeText(output.value).then(() => {
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        }).catch(() => {
            output.select();
            document.execCommand('copy');
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        });
    }
    
    function clearAll() {
        const input = document.getElementById('inputArea');
        const output = document.getElementById('outputArea');
        const inputCount = document.getElementById('inputCount');
        const outputCount = document.getElementById('outputCount');
        if (input) input.value = '';
        if (output) output.value = '';
        if (inputCount) inputCount.textContent = '0';
        if (outputCount) outputCount.textContent = '0';
        showToast(typeof I18n !== 'undefined' ? I18n.t('toast.cleared') : 'Cleared');
    }
    
    function getStatus() {
      return isRunning ? 'running' : (tick > 0 ? 'paused' : 'stopped');
    }

    function updateStatus() {
      const status = getStatus();
      const badge = document.getElementById('statusBadge');
      badge.className = 'status-badge ' + status;
      badge.innerHTML = '<span class="status-dot ' + status + '"></span> ' + status.charAt(0).toUpperCase() + status.slice(1);
      document.getElementById('pointCount').textContent = dataPoints.length + ' points';
    }

    function generateValue() {
      const source = document.getElementById('dataSource').value;
      switch(source) {
        case 'sine':
          return Math.sin(tick * 0.2) * 50 + 50 + (Math.random() - 0.5) * 10;
        case 'random':
          return Math.random() * 100;
        case 'incremental':
          return (tick * 2 % 100) + (Math.random() - 0.5) * 5;
        default:
          return Math.random() * 100;
      }
    }

    function initChart() {
      const canvas = document.getElementById('chartCanvas');
      const type = document.getElementById('chartType').value;
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(canvas, {
        type: type,
        data: {
          labels: labels,
          datasets: [{
            label: 'Live Data',
            data: dataPoints,
            borderColor: '#3B82F6',
            backgroundColor: type === 'bar' ? '#3B82F680' : '#3B82F620',
            borderWidth: 2,
            fill: type === 'line',
            tension: 0.4,
            pointRadius: type === 'line' ? 0 : undefined,
            pointHoverRadius: type === 'line' ? 5 : undefined,
            borderRadius: type === 'bar' ? 4 : undefined
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          animation: { duration: 200 },
          plugins: {
            legend: { display: false },
            tooltip: { backgroundColor: 'rgba(0,0,0,0.8)', titleFont: { family: 'Inter' }, bodyFont: { family: 'Inter' }, cornerRadius: 8, padding: 12 }
          },
          scales: {
            x: { display: false },
            y: { min: 0, max: 110, grid: { color: 'rgba(0,0,0,0.06)' }, ticks: { font: { family: 'Inter', size: 11 } } }
          }
        }
      });
    }

    function addDataPoint() {
      const maxPts = parseInt(document.getElementById('maxPoints').value);
      tick++;
      const value = generateValue();

      dataPoints.push(value);
      labels.push(tick.toString());

      if (dataPoints.length > maxPts) {
        dataPoints.shift();
        labels.shift();
      }

      chartInstance.update('none');
      updateStatus();
    }

    function start() {
      if (isRunning) return;
      isRunning = true;
      document.getElementById('btnStart').disabled = true;
      document.getElementById('btnPause').disabled = false;
      initChart();
      intervalId = setInterval(addDataPoint, parseInt(speedSlider.value));
      updateStatus();
    }

    function pause() {
      isRunning = false;
      clearInterval(intervalId);
      intervalId = null;
      document.getElementById('btnStart').disabled = false;
      document.getElementById('btnPause').disabled = true;
      updateStatus();
    }

    function reset() {
      pause();
      tick = 0;
      dataPoints = [];
      labels = [];
      if (chartInstance) chartInstance.destroy();
      chartInstance = null;
      updateStatus();
    }

    document.getElementById('btnStart').addEventListener('click', start);
    document.getElementById('btnPause').addEventListener('click', pause);
    document.getElementById('btnReset').addEventListener('click', reset);

    // Re-init chart type change when running
    document.getElementById('chartType').addEventListener('change', () => {
      if (isRunning || tick > 0) {
        initChart();
      }
    });

    updateStatus();
  })();
  </script>
</body>
</html>
