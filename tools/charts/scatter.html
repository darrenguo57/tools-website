<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scatter Plot - UseEasyTool</title>
    <meta name="description" content="Create scatter plots">
    
    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    
    <style>
        /* Tool Page Custom Styles */
        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .workspace-grid .full-width { grid-column: 1 / -1; }
        .textarea-wrap { position: relative; }
        .textarea-wrap textarea, .textarea-wrap input {
            width: 100%; min-height: 200px; padding: 1rem; border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); font-family: 'Courier New', monospace; font-size: 14px;
            resize: vertical; background: var(--color-bg); color: var(--color-text);
            box-sizing: border-box;
        }
        .textarea-wrap input { min-height: auto; resize: none; }
        .textarea-wrap textarea:focus, .textarea-wrap input:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .textarea-label { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: var(--font-size-sm); color: var(--color-text); }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1rem 0; }
        .char-count { font-size: 12px; color: var(--color-text-tertiary); text-align: right; margin-top: 0.25rem; }
        .chart-controls { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .chart-controls label { display: flex; align-items: center; gap: 0.5rem; font-size: 14px; }
        .chart-controls input[type="checkbox"] { width: auto; }
        .chart-container { position: relative; width: 100%; min-height: 400px; background: var(--color-surface); border-radius: var(--radius-lg); padding: 1rem; }
        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        .data-table th, .data-table td { padding: 0.5rem; text-align: left; border-bottom: 1px solid var(--color-border); }
        .data-table th { font-weight: 600; background: var(--color-bg); }
        .data-table input { width: 100%; padding: 0.5rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-text); }

        @media (max-width: 768px) { .workspace-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="UseEasyTool"></i>
                <span>UseEasyTool</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>
    
    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_charts" data-i18n="cat_charts">Charts</a> / <span>Scatter Plot</span></div></div>
    
    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="target"></i></div>
                    <h1>Scatter Plot</h1>
                    <p>Create scatter plots</p>
                </div>
                
                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <div class="workspace-grid">
                        <div>
                            <div class="textarea-label">
                                <i data-lucide="file-text"></i>
                                <span data-i18n="data_input">Data Input</span>
                            </div>
                            <div class="chart-controls">
                                <label>
                                    <input type="checkbox" id="showTrendline" checked>
                                    <span data-i18n="chart_trend_line">Trend Line</span>
                                </label>
                                <label>
                                    <input type="checkbox" id="showGrid" checked>
                                    <span>Grid</span>
                                </label>
                            </div>
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th data-i18n="col_x">X</th>
                                        <th data-i18n="col_y">Y</th>
                                        <th data-i18n="col_size">Size (optional)</th>
                                        <th data-i18n="col_label">Label (optional)</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="dataBody">
                                    <tr>
                                        <td><input type="number" value="10" class="x-val"></td>
                                        <td><input type="number" value="20" class="y-val"></td>
                                        <td><input type="number" value="5" class="r-val" placeholder="Optional"></td>
                                        <td><input type="text" value="A" class="label-val" placeholder="Optional"></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <td><input type="number" value="30" class="x-val"></td>
                                        <td><input type="number" value="45" class="y-val"></td>
                                        <td><input type="number" value="8" class="r-val" placeholder="Optional"></td>
                                        <td><input type="text" value="B" class="label-val" placeholder="Optional"></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <td><input type="number" value="50" class="x-val"></td>
                                        <td><input type="number" value="60" class="y-val"></td>
                                        <td><input type="number" value="6" class="r-val" placeholder="Optional"></td>
                                        <td><input type="text" value="C" class="label-val" placeholder="Optional"></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <td><input type="number" value="70" class="x-val"></td>
                                        <td><input type="number" value="35" class="y-val"></td>
                                        <td><input type="number" value="10" class="r-val" placeholder="Optional"></td>
                                        <td><input type="text" value="D" class="label-val" placeholder="Optional"></td>
                                        <td></td>
                                    </tr>
                                </tbody>
                            </table>
                            <div class="btn-group">
                                <button class="btn btn-secondary" id="btnAddRow"><i data-lucide="plus"></i><span data-i18n="btn_add_row">Add Row</span></button>
                                <button class="btn btn-secondary" id="btnClear"><i data-lucide="trash-2"></i><span>Clear</span></button>
                                <button class="btn btn-primary" id="btnGenerate"><i data-lucide="play"></i><span>Generate</span></button>
                            </div>
                        </div>
                    </div>
                    <div class="chart-container">
                        <div id="chartPlaceholder" style="display: flex; align-items: center; justify-content: center; height: 400px; color: var(--color-text-tertiary);">
                            Click "Generate" to create chart
                        </div>
                        <canvas id="chartCanvas" style="display: none; max-height: 400px;"></canvas>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-secondary" id="btnDownloadPNG"><i data-lucide="download"></i><span data-i18n="btn_download_png">Download PNG</span></button>
                    </div>
                </div>
                
            </div>
            <aside class="tool-sidebar">
            </aside>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="../about.html" data-i18n="footer_about">About</a>
                <a href="../privacy.html" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="../terms.html" data-i18n="footer_terms">Terms of Service</a>
                <a href="../contact.html" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 UseEasyTool. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>
    
    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>
    
    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>
    
    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>

    <script>
    // Global variables
    let chartInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }
    });
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    }
    
    function copyOutput() {
        const output = document.getElementById('outputArea');
        if (!output || !output.value) {
            showToast('Nothing to copy');
            return;
        }
        navigator.clipboard.writeText(output.value).then(() => {
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        }).catch(() => {
            output.select();
            document.execCommand('copy');
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        });
    }
    
    function clearAll() {
        const input = document.getElementById('inputArea');
        const output = document.getElementById('outputArea');
        const inputCount = document.getElementById('inputCount');
        const outputCount = document.getElementById('outputCount');
        if (input) input.value = '';
        if (output) output.value = '';
        if (inputCount) inputCount.textContent = '0';
        if (outputCount) outputCount.textContent = '0';
        showToast(typeof I18n !== 'undefined' ? I18n.t('toast.cleared') : 'Cleared');
    }
    
    function getData() {
      const points = [];
      document.querySelectorAll('#dataBody tr').forEach(row => {
        const x = parseFloat(row.querySelector('.x-val').value);
        const y = parseFloat(row.querySelector('.y-val').value);
        const r = parseFloat(row.querySelector('.r-val').value) || 5;
        const label = row.querySelector('.label-val').value.trim();
        if (!isNaN(x) && !isNaN(y)) points.push({ x, y, r, label });
      });
      return points;
    }

    function linearRegression(points) {
      const n = points.length;
      if (n < 2) return null;
      let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
      points.forEach(p => { sumX += p.x; sumY += p.y; sumXY += p.x * p.y; sumX2 += p.x * p.x; });
      const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
      const intercept = (sumY - slope * sumX) / n;
      return { slope, intercept };
    }

    function generate() {
      const points = getData();
      if (points.length === 0) return;

      const showTrend = document.getElementById('showTrendline').checked;
      const showGrid = document.getElementById('showGrid').checked;
      const hasBubble = points.some(p => p.r > 5);

      document.getElementById('chartPlaceholder').style.display = 'none';
      const canvas = document.getElementById('chartCanvas');
      canvas.style.display = 'block';

      if (chartInstance) chartInstance.destroy();

      const datasets = [{
        label: 'Data',
        data: points.map(p => ({ x: p.x, y: p.y, r: p.r })),
        backgroundColor: '#3B82F6AA',
        borderColor: '#3B82F6',
        borderWidth: 2,
        pointRadius: hasBubble ? undefined : 6,
        pointHoverRadius: hasBubble ? undefined : 9,
        hoverBackgroundColor: '#3B82F6'
      }];

      if (hasBubble) {
        datasets[0].bubble = { minRadius: 5 };
      }

      if (showTrend) {
        const reg = linearRegression(points);
        if (reg) {
          const xMin = Math.min(...points.map(p => p.x));
          const xMax = Math.max(...points.map(p => p.x));
          datasets.push({
            label: 'Trend Line',
            data: [{ x: xMin, y: reg.slope * xMin + reg.intercept }, { x: xMax, y: reg.slope * xMax + reg.intercept }],
            type: 'line',
            borderColor: '#EF4444',
            borderWidth: 2,
            borderDash: [6, 4],
            pointRadius: 0,
            fill: false,
            tension: 0
          });
        }
      }

      chartInstance = new Chart(canvas, {
        type: hasBubble ? 'bubble' : 'scatter',
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: { display: showTrend, position: 'top', labels: { usePointStyle: true, font: { family: 'Inter', size: 13 } } },
            tooltip: {
              backgroundColor: 'rgba(0,0,0,0.8)',
              titleFont: { family: 'Inter' },
              bodyFont: { family: 'Inter' },
              cornerRadius: 8,
              padding: 12,
              callbacks: {
                label: function(ctx) {
                  const p = ctx.raw;
                  let str = '(' + p.x + ', ' + p.y + ')';
                  if (p.r && hasBubble) str += ' Size: ' + p.r;
                  return str;
                }
              }
            }
          },
          scales: {
            x: { grid: { display: showGrid, color: 'rgba(0,0,0,0.06)' }, ticks: { font: { family: 'Inter', size: 12 } } },
            y: { grid: { display: showGrid, color: 'rgba(0,0,0,0.06)' }, ticks: { font: { family: 'Inter', size: 12 } } }
          }
        }
      });
    }

    function addRow() {
      const tbody = document.getElementById('dataBody');
      const tr = document.createElement('tr');
      tr.innerHTML = '<td><input type="number" value="" class="x-val"></td><td><input type="number" value="" class="y-val"></td><td><input type="number" value="" class="r-val" placeholder="Optional"></td><td><input type="text" value="" class="label-val" placeholder="Optional"></td><td><button class="btn-remove-row"><i data-lucide="x" style="width:14px;height:14px;"></i></button></td>';
      tbody.appendChild(tr);
      tr.querySelector('.btn-remove-row').addEventListener('click', () => tr.remove());
      lucide.createIcons();
    }

    document.getElementById('btnAddRow').addEventListener('click', addRow);
    document.getElementById('btnClear').addEventListener('click', () => { document.getElementById('dataBody').innerHTML = ''; });
    document.getElementById('btnGenerate').addEventListener('click', generate);

    document.querySelectorAll('.btn-remove-row').forEach(btn => {
      btn.addEventListener('click', function() { this.closest('tr').remove(); });
    });

    document.getElementById('btnDownloadPNG').addEventListener('click', () => {
      if (!chartInstance) return;
      const link = document.createElement('a');
      link.download = 'scatter-chart.png';
      link.href = document.getElementById('chartCanvas').toDataURL('image/png', 1.0);
      link.click();
    });
  })();
  </script>
</body>
</html>
