<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator - ToolBox</title>
    <meta name="description" content="Advanced math functions">
    
    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    
    <style>
        /* Tool Page Custom Styles */
        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .workspace-grid .full-width { grid-column: 1 / -1; }
        .textarea-wrap { position: relative; }
        .textarea-wrap textarea, .textarea-wrap input {
            width: 100%; min-height: 200px; padding: 1rem; border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); font-family: 'Courier New', monospace; font-size: 14px;
            resize: vertical; background: var(--color-bg); color: var(--color-text);
            box-sizing: border-box;
        }
        .textarea-wrap input { min-height: auto; resize: none; }
        .textarea-wrap textarea:focus, .textarea-wrap input:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .textarea-label { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: var(--font-size-sm); color: var(--color-text); }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1rem 0; }
        .char-count { font-size: 12px; color: var(--color-text-tertiary); text-align: right; margin-top: 0.25rem; }
        
        @media (max-width: 768px) { .workspace-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="toolbox"></i>
                <span>ToolBox</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>
    
    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_calculators" data-i18n="cat_calculators">Calculators</a> / <span>Scientific Calculator</span></div></div>
    
    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="calculator-variant"></i></div>
                    <h1>Scientific Calculator</h1>
                    <p>Advanced math functions</p>
                </div>
                
                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <div class="workspace-grid">
                        <div>
                            <div class="textarea-label">
                                <i data-lucide="file-text"></i>
                                <span data-i18n="input_label">Input</span>
                            </div>
                            <div class="textarea-wrap">
                                <textarea id="inputArea" data-i18n-placeholder="input_placeholder" placeholder="Enter text..."></textarea>
                            </div>
                            <div class="char-count"><span id="inputCount">0</span> <span data-i18n="char_count">characters</span></div>
                        </div>
                        <div>
                            <div class="textarea-label">
                                <i data-lucide="file-output"></i>
                                <span data-i18n="output_label">Output</span>
                            </div>
                            <div class="textarea-wrap">
                                <textarea id="outputArea" data-i18n-placeholder="output_placeholder" placeholder="Result..." readonly></textarea>
                            </div>
                            <div class="char-count"><span id="outputCount">0</span> <span data-i18n="char_count">characters</span></div>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="process()"><i data-lucide="play"></i><span>Process</span></button>
                        <button class="btn btn-secondary" onclick="copyOutput()"><i data-lucide="copy"></i><span data-i18n="btn_copy">Copy</span></button>
                        <button class="btn btn-danger" onclick="clearAll()"><i data-lucide="trash-2"></i><span data-i18n="btn_clear">Clear</span></button>
                    </div>
                </div>
                
                <!-- Ad Slot -->
                <div class="ad-slot" style="margin-top:2rem">
                    <span data-i18n="ad_label">Advertisement</span>
                </div>
            </div>
            <aside class="tool-sidebar">
                <div class="ad-slot">
                    <span data-i18n="ad_label">Advertisement</span>
                </div>
            </aside>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="#" data-i18n="footer_about">About</a>
                <a href="#" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="#" data-i18n="footer_terms">Terms of Service</a>
                <a href="#" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 ToolBox. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>
    
    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>
    
    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>
    
    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }
    });
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    }
    
    function copyOutput() {
        const output = document.getElementById('outputArea');
        if (!output || !output.value) {
            showToast('Nothing to copy');
            return;
        }
        navigator.clipboard.writeText(output.value).then(() => {
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        }).catch(() => {
            output.select();
            document.execCommand('copy');
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        });
    }
    
    function clearAll() {
        const input = document.getElementById('inputArea');
        const output = document.getElementById('outputArea');
        const inputCount = document.getElementById('inputCount');
        const outputCount = document.getElementById('outputCount');
        if (input) input.value = '';
        if (output) output.value = '';
        if (inputCount) inputCount.textContent = '0';
        if (outputCount) outputCount.textContent = '0';
        showToast(typeof I18n !== 'undefined' ? I18n.t('toast.cleared') : 'Cleared');
    }
    
    function updateDisplay() {
        resultEl.textContent = displayValue;
        expressionEl.textContent = expression;
      }

      function toRad(val) { return isDeg ? val * Math.PI / 180 : val; }
      function fromRad(val) { return isDeg ? val * 180 / Math.PI : val; }

      function factorial(n) {
        if (n < 0) return NaN;
        if (n === 0 || n === 1) return 1;
        if (n > 170) return Infinity;
        if (!Number.isInteger(n)) return gamma(n + 1);
        let result = 1;
        for (let i = 2; i <= n; i++) result *= i;
        return result;
      }

      function gamma(z) {
        if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
        z -= 1;
        const g = 7;
        const c = [0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
        let x = c[0];
        for (let i = 1; i < g + 2; i++) x += c[i] / (z + i);
        const t = z + g + 0.5;
        return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
      }

      function safeEval(expr) {
        try {
          let processed = expr
            .replace(/\bpi\b/gi, '(' + Math.PI + ')')
            .replace(/\be\b/g, '(' + Math.E + ')');

          let result = math.evaluate(processed);
          if (typeof result === 'object' && result !== null && result.toNumber) result = result.toNumber();
          if (typeof result !== 'number' || isNaN(result)) return 'Error';
          if (!isFinite(result)) return result > 0 ? 'Infinity' : '-Infinity';
          return parseFloat(result.toPrecision(12)).toString();
        } catch (e) {
          return 'Error';
        }
      }

      function inputNumber(num) {
        if (isNewInput) {
          displayValue = num;
          expression += num;
          isNewInput = false;
        } else {
          displayValue += num;
          expression += num;
        }
        updateDisplay();
      }

      function inputDecimal() {
        if (isNewInput) {
          displayValue = '0.';
          expression += '0.';
          isNewInput = false;
        } else if (!displayValue.includes('.')) {
          displayValue += '.';
          expression += '.';
        }
        updateDisplay();
      }

      function inputOperator(op) {
        const opSymbol = { '+': ' + ', '-': ' - ', '*': ' \u00d7 ', '/': ' \u00f7 ' };
        expression += opSymbol[op] || (' ' + op + ' ');
        isNewInput = true;
        updateDisplay();
      }

      function inputFunc(func) {
        const val = parseFloat(displayValue);
        let result;
        switch (func) {
          case 'sin': result = Math.sin(toRad(val)); break;
          case 'cos': result = Math.cos(toRad(val)); break;
          case 'tan': result = Math.tan(toRad(val)); break;
          case 'asin': result = fromRad(Math.asin(val)); break;
          case 'acos': result = fromRad(Math.acos(val)); break;
          case 'atan': result = fromRad(Math.atan(val)); break;
          case 'log': result = Math.log10(val); break;
          case 'ln': result = Math.log(val); break;
          case 'sqrt': result = Math.sqrt(val); break;
          case 'cbrt': result = Math.cbrt(val); break;
          case 'fact': result = factorial(val); break;
          case 'abs': result = Math.abs(val); break;
          case 'exp': result = Math.exp(val); break;
          case 'inv': result = val === 0 ? NaN : 1 / val; break;
          case 'pow':
            expression += '^';
            isNewInput = true;
            updateDisplay();
            return;
          default: return;
        }
        if (isNaN(result)) { displayValue = 'Error'; }
        else { displayValue = parseFloat(result.toPrecision(12)).toString(); }
        expression = func + '(' + displayValue + ')';
        isNewInput = true;
        updateDisplay();
      }

      function inputConst(c) {
        const val = c === 'pi' ? Math.PI.toString() : Math.E.toString();
        displayValue = val;
        expression += c;
        isNewInput = true;
        updateDisplay();
      }

      function inputParen(p) {
        expression += p;
        isNewInput = true;
        updateDisplay();
      }

      function calculate() {
        const result = safeEval(expression);
        if (result !== 'Error') {
          history.unshift({ expression: expression, result: result });
          if (history.length > 50) history.pop();
          renderHistory();
        }
        displayValue = result;
        lastResult = result;
        isNewInput = true;
        updateDisplay();
      }

      function clear() {
        expression = '';
        displayValue = '0';
        lastResult = null;
        isNewInput = true;
        updateDisplay();
      }

      function backspace() {
        if (isNewInput) return;
        expression = expression.slice(0, -1);
        displayValue = displayValue.slice(0, -1) || '0';
        updateDisplay();
      }

      function negate() {
        if (displayValue !== '0' && displayValue !== 'Error') {
          if (displayValue.startsWith('-')) {
            displayValue = displayValue.slice(1);
          } else {
            displayValue = '-' + displayValue;
          }
          updateDisplay();
        }
      }

      function percent() {
        const val = parseFloat(displayValue);
        if (!isNaN(val)) {
          displayValue = (val / 100).toString();
          updateDisplay();
        }
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function renderHistory() {
        if (history.length === 0) {
          historyList.innerHTML = '<div class="sci-calc-history-empty">No calculations yet</div>';
          return;
        }
        historyList.innerHTML = history.map(function(item, i) {
          return '<div class="sci-calc-history-item" data-index="' + i + '">' +
            '<span class="sci-calc-history-expr">' + escapeHtml(item.expression) + '</span>' +
            '<span class="sci-calc-history-val">= ' + escapeHtml(item.result) + '</span>' +
          '</div>';
        }).join('');
        historyList.querySelectorAll('.sci-calc-history-item').forEach(function(el) {
          el.addEventListener('click', function() {
            const idx = parseInt(this.dataset.index);
            displayValue = history[idx].result;
            expression = history[idx].result;
            isNewInput = true;
            updateDisplay();
          });
        });
      }

      // Mode toggle
      document.getElementById('btnDeg').addEventListener('click', function() {
        isDeg = true;
        this.classList.add('active');
        document.getElementById('btnRad').classList.remove('active');
      });
      document.getElementById('btnRad').addEventListener('click', function() {
        isDeg = false;
        this.classList.add('active');
        document.getElementById('btnDeg').classList.remove('active');
      });

      // Memory
      document.querySelectorAll('.sci-calc-mem-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const action = this.dataset.mem;
          const val = parseFloat(displayValue);
          switch (action) {
            case 'mc': memory = 0; break;
            case 'mr': displayValue = memory.toString(); isNewInput = true; updateDisplay(); break;
            case 'm+': memory += (isNaN(val) ? 0 : val); break;
            case 'm-': memory -= (isNaN(val) ? 0 : val); break;
            case 'ms': memory = isNaN(val) ? 0 : val; break;
          }
        });
      });

      // Button clicks
      document.querySelectorAll('.sci-calc-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const action = this.dataset.action;
          const value = this.dataset.value;
          switch (action) {
            case 'number': inputNumber(value); break;
            case 'decimal': inputDecimal(); break;
            case 'operator': inputOperator(value); break;
            case 'func': inputFunc(value); break;
            case 'const': inputConst(value); break;
            case 'paren': inputParen(value); break;
            case 'equals': calculate(); break;
            case 'clear': clear(); break;
            case 'backspace': backspace(); break;
            case 'percent': percent(); break;
            case 'negate': negate(); break;
          }
        });
      });

      // Keyboard support
      

    // Input character counter
    document.addEventListener('DOMContentLoaded', () => {
        const inputArea = document.getElementById('inputArea');
        const inputCount = document.getElementById('inputCount');
        if (inputArea && inputCount) {
            inputArea.addEventListener('input', () => {
                inputCount.textContent = inputArea.value.length;
            });
        }
    });
    </script>
</body>
</html>
