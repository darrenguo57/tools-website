<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standard Calculator - ToolBox</title>
    <meta name="description" content="Basic arithmetic calculator">
    
    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    
    <style>
        /* Tool Page Custom Styles */
        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .workspace-grid .full-width { grid-column: 1 / -1; }
        .textarea-wrap { position: relative; }
        .textarea-wrap textarea, .textarea-wrap input {
            width: 100%; min-height: 200px; padding: 1rem; border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); font-family: 'Courier New', monospace; font-size: 14px;
            resize: vertical; background: var(--color-bg); color: var(--color-text);
            box-sizing: border-box;
        }
        .textarea-wrap input { min-height: auto; resize: none; }
        .textarea-wrap textarea:focus, .textarea-wrap input:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .textarea-label { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: var(--font-size-sm); color: var(--color-text); }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1rem 0; }
        .char-count { font-size: 12px; color: var(--color-text-tertiary); text-align: right; margin-top: 0.25rem; }
        
        @media (max-width: 768px) { .workspace-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="toolbox"></i>
                <span>ToolBox</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>
    
    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_calculators" data-i18n="cat_calculators">Calculators</a> / <span>Standard Calculator</span></div></div>
    
    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="calculator"></i></div>
                    <h1>Standard Calculator</h1>
                    <p>Basic arithmetic calculator</p>
                </div>
                
                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <div class="workspace-grid">
                        <div>
                            <div class="textarea-label">
                                <i data-lucide="file-text"></i>
                                <span data-i18n="input_label">Input</span>
                            </div>
                            <div class="textarea-wrap">
                                <textarea id="inputArea" data-i18n-placeholder="input_placeholder" placeholder="Enter text..."></textarea>
                            </div>
                            <div class="char-count"><span id="inputCount">0</span> <span data-i18n="char_count">characters</span></div>
                        </div>
                        <div>
                            <div class="textarea-label">
                                <i data-lucide="file-output"></i>
                                <span data-i18n="output_label">Output</span>
                            </div>
                            <div class="textarea-wrap">
                                <textarea id="outputArea" data-i18n-placeholder="output_placeholder" placeholder="Result..." readonly></textarea>
                            </div>
                            <div class="char-count"><span id="outputCount">0</span> <span data-i18n="char_count">characters</span></div>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="process()"><i data-lucide="play"></i><span>Process</span></button>
                        <button class="btn btn-secondary" onclick="copyOutput()"><i data-lucide="copy"></i><span data-i18n="btn_copy">Copy</span></button>
                        <button class="btn btn-danger" onclick="clearAll()"><i data-lucide="trash-2"></i><span data-i18n="btn_clear">Clear</span></button>
                    </div>
                </div>
                
                <!-- Ad Slot -->
                <div class="ad-slot" style="margin-top:2rem">
                    <span data-i18n="ad_label">Advertisement</span>
                </div>
            </div>
            <aside class="tool-sidebar">
                <div class="ad-slot">
                    <span data-i18n="ad_label">Advertisement</span>
                </div>
            </aside>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="#" data-i18n="footer_about">About</a>
                <a href="#" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="#" data-i18n="footer_terms">Terms of Service</a>
                <a href="#" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 ToolBox. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>
    
    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>
    
    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>
    
    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }
    });
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    }
    
    function copyOutput() {
        const output = document.getElementById('outputArea');
        if (!output || !output.value) {
            showToast('Nothing to copy');
            return;
        }
        navigator.clipboard.writeText(output.value).then(() => {
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        }).catch(() => {
            output.select();
            document.execCommand('copy');
            showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
        });
    }
    
    function clearAll() {
        const input = document.getElementById('inputArea');
        const output = document.getElementById('outputArea');
        const inputCount = document.getElementById('inputCount');
        const outputCount = document.getElementById('outputCount');
        if (input) input.value = '';
        if (output) output.value = '';
        if (inputCount) inputCount.textContent = '0';
        if (outputCount) outputCount.textContent = '0';
        showToast(typeof I18n !== 'undefined' ? I18n.t('toast.cleared') : 'Cleared');
    }
    
    function updateDisplay() {
        resultEl.textContent = currentInput;
        if (operator && previousInput) {
          const opSymbol = { '+': '+', '-': '-', '*': '\u00d7', '/': '\u00f7' };
          expressionEl.textContent = previousInput + ' ' + (opSymbol[operator] || operator) + ' ';
        } else {
          expressionEl.textContent = '';
        }
      }

      function inputNumber(num) {
        if (shouldResetInput) {
          currentInput = num;
          shouldResetInput = false;
        } else {
          currentInput = currentInput === '0' ? num : currentInput + num;
        }
        updateDisplay();
      }

      function inputDecimal() {
        if (shouldResetInput) {
          currentInput = '0.';
          shouldResetInput = false;
        } else if (!currentInput.includes('.')) {
          currentInput += '.';
        }
        updateDisplay();
      }

      function inputOperator(op) {
        if (operator && !shouldResetInput) {
          calculate();
        }
        previousInput = currentInput;
        operator = op;
        shouldResetInput = true;
        updateDisplay();
      }

      function calculate() {
        if (!operator || !previousInput) return;
        const prev = parseFloat(previousInput);
        const curr = parseFloat(currentInput);
        let result;
        switch (operator) {
          case '+': result = prev + curr; break;
          case '-': result = prev - curr; break;
          case '*': result = prev * curr; break;
          case '/': result = curr === 0 ? 'Error' : prev / curr; break;
          default: return;
        }
        const expr = previousInput + ' ' + operator + ' ' + currentInput;
        const resultStr = typeof result === 'number' ? parseFloat(result.toPrecision(12)).toString() : result;

        history.unshift({ expression: expr, result: resultStr });
        if (history.length > 50) history.pop();
        renderHistory();

        currentInput = resultStr;
        operator = null;
        previousInput = '';
        shouldResetInput = true;
        updateDisplay();
      }

      function clear() {
        currentInput = '0';
        previousInput = '';
        operator = null;
        shouldResetInput = false;
        updateDisplay();
      }

      function clearEntry() {
        currentInput = '0';
        updateDisplay();
      }

      function percent() {
        currentInput = (parseFloat(currentInput) / 100).toString();
        updateDisplay();
      }

      function negate() {
        if (currentInput !== '0') {
          currentInput = currentInput.startsWith('-') ? currentInput.slice(1) : '-' + currentInput;
          updateDisplay();
        }
      }

      function renderHistory() {
        if (history.length === 0) {
          historyList.innerHTML = '<div class="calc-history-empty">No calculations yet</div>';
          return;
        }
        historyList.innerHTML = history.map(function(item, i) {
          return '<div class="calc-history-item" data-index="' + i + '">' +
            '<span class="calc-history-expr">' + escapeHtml(item.expression) + '</span>' +
            '<span class="calc-history-val">= ' + escapeHtml(item.result) + '</span>' +
          '</div>';
        }).join('');
        historyList.querySelectorAll('.calc-history-item').forEach(function(el) {
          el.addEventListener('click', function() {
            const idx = parseInt(this.dataset.index);
            currentInput = history[idx].result;
            shouldResetInput = true;
            updateDisplay();
          });
        });
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // Button clicks
      document.querySelectorAll('.calc-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const action = this.dataset.action;
          const value = this.dataset.value;
          switch (action) {
            case 'number': inputNumber(value); break;
            case 'decimal': inputDecimal(); break;
            case 'operator': inputOperator(value); break;
            case 'equals': calculate(); break;
            case 'clear': clear(); break;
            case 'ce': clearEntry(); break;
            case 'percent': percent(); break;
            case 'negate': negate(); break;
          }
        });
      });

      // Keyboard support
      

    // Input character counter
    document.addEventListener('DOMContentLoaded', () => {
        const inputArea = document.getElementById('inputArea');
        const inputCount = document.getElementById('inputCount');
        if (inputArea && inputCount) {
            inputArea.addEventListener('input', () => {
                inputCount.textContent = inputArea.value.length;
            });
        }
    });
    </script>
</body>
</html>
