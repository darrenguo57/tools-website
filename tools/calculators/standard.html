<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standard Calculator - ToolBox</title>
    <meta name="description" content="Basic arithmetic calculator">
    
    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    
    <style>
        .calc-container {
            max-width: 400px;
            margin: 0 auto;
        }
        .calc-display {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .calc-expression {
            font-size: 1rem;
            color: var(--color-text-secondary);
            text-align: right;
            min-height: 1.5rem;
            word-break: break-all;
        }
        .calc-result {
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--color-text);
            text-align: right;
            word-break: break-all;
        }
        .calc-history {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--color-border-light);
        }
        .calc-history-title {
            font-size: 0.75rem;
            color: var(--color-text-tertiary);
            margin-bottom: 0.5rem;
        }
        .calc-history-empty {
            color: var(--color-text-tertiary);
            font-size: 0.875rem;
            text-align: center;
            padding: 0.5rem;
        }
        .calc-history-item {
            display: flex;
            justify-content: space-between;
            padding: 0.375rem 0.5rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .calc-history-item:hover {
            background: var(--color-bg-tertiary);
        }
        .calc-history-expr {
            color: var(--color-text-secondary);
            font-size: 0.875rem;
        }
        .calc-history-val {
            color: var(--color-text);
            font-size: 0.875rem;
            font-weight: 500;
        }
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }
        .calc-btn {
            padding: 1.25rem;
            font-size: 1.25rem;
            font-weight: 500;
            border: none;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.15s;
            background: var(--color-surface);
            color: var(--color-text);
            border: 1px solid var(--color-border);
        }
        .calc-btn:hover {
            background: var(--color-bg-tertiary);
        }
        .calc-btn:active {
            transform: scale(0.98);
        }
        .calc-btn.operator {
            background: var(--color-primary-light);
            color: var(--color-primary);
            border-color: var(--color-primary);
        }
        .calc-btn.operator:hover {
            background: var(--color-primary);
            color: white;
        }
        .calc-btn.equals {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }
        .calc-btn.equals:hover {
            background: var(--color-primary-dark, #2563eb);
        }
        .calc-btn.clear {
            background: var(--color-error-light);
            color: var(--color-error);
            border-color: var(--color-error);
        }
        .calc-btn.span-2 {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="toolbox"></i>
                <span>ToolBox</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>
    
    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_calculators" data-i18n="cat_calculators">Calculators</a> / <span>Standard Calculator</span></div></div>
    
    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="calculator"></i></div>
                    <h1>Standard Calculator</h1>
                    <p>Basic arithmetic calculator</p>
                </div>
                
                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <div class="calc-container">
                        <div class="calc-display">
                            <div class="calc-expression" id="expressionEl"></div>
                            <div class="calc-result" id="resultEl">0</div>
                            <div class="calc-history" id="historyList">
                                <div class="calc-history-empty">No calculations yet</div>
                            </div>
                        </div>
                        <div class="calc-buttons">
                            <button class="calc-btn clear" data-action="clear">C</button>
                            <button class="calc-btn operator" data-action="negate">+/-</button>
                            <button class="calc-btn operator" data-action="percent">%</button>
                            <button class="calc-btn operator" data-action="operator" data-value="/">/</button>
                            
                            <button class="calc-btn" data-action="number" data-value="7">7</button>
                            <button class="calc-btn" data-action="number" data-value="8">8</button>
                            <button class="calc-btn" data-action="number" data-value="9">9</button>
                            <button class="calc-btn operator" data-action="operator" data-value="*">x</button>
                            
                            <button class="calc-btn" data-action="number" data-value="4">4</button>
                            <button class="calc-btn" data-action="number" data-value="5">5</button>
                            <button class="calc-btn" data-action="number" data-value="6">6</button>
                            <button class="calc-btn operator" data-action="operator" data-value="-">-</button>
                            
                            <button class="calc-btn" data-action="number" data-value="1">1</button>
                            <button class="calc-btn" data-action="number" data-value="2">2</button>
                            <button class="calc-btn" data-action="number" data-value="3">3</button>
                            <button class="calc-btn operator" data-action="operator" data-value="+">+</button>
                            
                            <button class="calc-btn span-2" data-action="number" data-value="0">0</button>
                            <button class="calc-btn" data-action="decimal">.</button>
                            <button class="calc-btn equals" data-action="equals">=</button>
                        </div>
                    </div>
                </div>
                
            </div>
            <aside class="tool-sidebar">
            </aside>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="#" data-i18n="footer_about">About</a>
                <a href="#" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="#" data-i18n="footer_terms">Terms of Service</a>
                <a href="#" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 ToolBox. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>
    
    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>
    
    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>
    
    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>
    
    <script>
    (function() {
        // Calculator state
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetInput = false;
        let history = [];
        
        // DOM elements
        const resultEl = document.getElementById('resultEl');
        const expressionEl = document.getElementById('expressionEl');
        const historyList = document.getElementById('historyList');
        
        function updateDisplay() {
            resultEl.textContent = currentInput;
            if (operator && previousInput) {
                const opSymbol = { '+': '+', '-': '-', '*': '\u00d7', '/': '\u00f7' };
                expressionEl.textContent = previousInput + ' ' + (opSymbol[operator] || operator) + ' ';
            } else {
                expressionEl.textContent = '';
            }
        }
        
        function inputNumber(num) {
            if (shouldResetInput) {
                currentInput = num;
                shouldResetInput = false;
            } else {
                currentInput = currentInput === '0' ? num : currentInput + num;
            }
            updateDisplay();
        }
        
        function inputDecimal() {
            if (shouldResetInput) {
                currentInput = '0.';
                shouldResetInput = false;
            } else if (!currentInput.includes('.')) {
                currentInput += '.';
            }
            updateDisplay();
        }
        
        function inputOperator(op) {
            if (operator && !shouldResetInput) {
                calculate();
            }
            previousInput = currentInput;
            operator = op;
            shouldResetInput = true;
            updateDisplay();
        }
        
        function calculate() {
            if (!operator || !previousInput) return;
            const prev = parseFloat(previousInput);
            const curr = parseFloat(currentInput);
            let result;
            switch (operator) {
                case '+': result = prev + curr; break;
                case '-': result = prev - curr; break;
                case '*': result = prev * curr; break;
                case '/': result = curr === 0 ? 'Error' : prev / curr; break;
                default: return;
            }
            const expr = previousInput + ' ' + operator + ' ' + currentInput;
            const resultStr = typeof result === 'number' ? parseFloat(result.toPrecision(12)).toString() : result;
            
            history.unshift({ expression: expr, result: resultStr });
            if (history.length > 50) history.pop();
            renderHistory();
            
            currentInput = resultStr;
            operator = null;
            previousInput = '';
            shouldResetInput = true;
            updateDisplay();
        }
        
        function clear() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            shouldResetInput = false;
            updateDisplay();
        }
        
        function negate() {
            if (currentInput !== '0') {
                currentInput = currentInput.startsWith('-') ? currentInput.slice(1) : '-' + currentInput;
                updateDisplay();
            }
        }
        
        function percent() {
            currentInput = (parseFloat(currentInput) / 100).toString();
            updateDisplay();
        }
        
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="calc-history-empty">No calculations yet</div>';
                return;
            }
            historyList.innerHTML = history.map(function(item, i) {
                return '<div class="calc-history-item" data-index="' + i + '">' +
                    '<span class="calc-history-expr">' + escapeHtml(item.expression) + '</span>' +
                    '<span class="calc-history-val">= ' + escapeHtml(item.result) + '</span>' +
                '</div>';
            }).join('');
            historyList.querySelectorAll('.calc-history-item').forEach(function(el) {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    currentInput = history[idx].result;
                    shouldResetInput = true;
                    updateDisplay();
                });
            });
        }
        
        // Button clicks
        document.querySelectorAll('.calc-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const action = this.dataset.action;
                const value = this.dataset.value;
                switch (action) {
                    case 'number': inputNumber(value); break;
                    case 'decimal': inputDecimal(); break;
                    case 'operator': inputOperator(value); break;
                    case 'equals': calculate(); break;
                    case 'clear': clear(); break;
                    case 'percent': percent(); break;
                    case 'negate': negate(); break;
                }
            });
        });
        
        // Keyboard support
        document.addEventListener('keydown', function(e) {
            if (e.key >= '0' && e.key <= '9') {
                inputNumber(e.key);
            } else if (e.key === '.') {
                inputDecimal();
            } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                inputOperator(e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                calculate();
            } else if (e.key === 'Escape') {
                clear();
            } else if (e.key === '%') {
                percent();
            } else if (e.key === 'Backspace') {
                if (currentInput.length > 1) {
                    currentInput = currentInput.slice(0, -1);
                } else {
                    currentInput = '0';
                }
                updateDisplay();
            }
        });
        
        // Initialize
        updateDisplay();
    })();
    </script>
</body>
</html>
