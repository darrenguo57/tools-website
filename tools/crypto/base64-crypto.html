<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encode/Decode - ToolBox</title>
    <meta name="description" content="Encode and decode Base64 strings online with full Unicode support. Fast, secure, client-side only.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    <style>
        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .workspace-grid .full-width { grid-column: 1 / -1; }
        .textarea-wrap { position: relative; }
        .textarea-wrap textarea {
            width: 100%; min-height: 200px; padding: 1rem; border: 1px solid var(--border, #e2e8f0);
            border-radius: 0.5rem; font-family: 'Courier New', monospace; font-size: 14px;
            resize: vertical; background: var(--bg, #fff); color: var(--text, #1e293b);
            box-sizing: border-box;
        }
        .textarea-wrap textarea:focus { outline: none; border-color: var(--primary, #3b82f6); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .textarea-label { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1rem 0; }
        .btn {
            padding: 0.5rem 1.25rem; border-radius: 0.5rem; border: none; cursor: pointer;
            font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 0.4rem;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--primary, #3b82f6); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover, #2563eb); }
        .btn-secondary { background: var(--bg-secondary, #f1f5f9); color: var(--text, #1e293b); border: 1px solid var(--border, #e2e8f0); }
        .btn-secondary:hover { background: var(--bg-tertiary, #e2e8f0); }
        .btn-success { background: #10b981; color: #fff; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .toast {
            position: fixed; bottom: 2rem; right: 2rem; padding: 0.75rem 1.5rem;
            background: #1e293b; color: #fff; border-radius: 0.5rem; font-size: 14px;
            transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 9999;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .char-count { font-size: 12px; color: var(--text-muted, #94a3b8); text-align: right; margin-top: 0.25rem; }
        @media (max-width: 768px) { .workspace-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo"><i data-lucide="lock" style="width:28px;height:28px"></i> ToolBox</a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" onclick="I18n.setLang(I18n.currentLang==='en'?'zh':'en')">EN</button>
                <button class="theme-btn" onclick="document.body.classList.toggle('dark')"><i data-lucide="sun"></i></button>
            </div>
        </div>
    </header>
    <div class="breadcrumb"><div class="container"><a href="../../index.html">Home</a> / <a href="../../index.html#crypto">Encryption</a> / <span>Base64 Encode/Decode</span></div></div>
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="lock"></i></div>
                    <h1>Base64 Encode / Decode</h1>
                    <p>Encode text to Base64 or decode Base64 back to text. Supports full Unicode characters including CJK, emoji, and more.</p>
                </div>
                <div class="tool-workspace">
                    <div class="workspace-grid">
                        <div>
                            <div class="textarea-label"><i data-lucide="file-text" style="width:16px;height:16px"></i> Input</div>
                            <div class="textarea-wrap">
                                <textarea id="inputArea" placeholder="Enter text to encode or Base64 string to decode..."></textarea>
                            </div>
                            <div class="char-count"><span id="inputCount">0</span> characters</div>
                        </div>
                        <div>
                            <div class="textarea-label"><i data-lucide="file-output" style="width:16px;height:16px"></i> Output</div>
                            <div class="textarea-wrap">
                                <textarea id="outputArea" placeholder="Result will appear here..." readonly></textarea>
                            </div>
                            <div class="char-count"><span id="outputCount">0</span> characters</div>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="encodeBase64()"><i data-lucide="arrow-right" style="width:16px;height:16px"></i> Encode</button>
                        <button class="btn btn-success" onclick="decodeBase64()"><i data-lucide="arrow-left" style="width:16px;height:16px"></i> Decode</button>
                        <button class="btn btn-secondary" onclick="swapValues()"><i data-lucide="arrow-left-right" style="width:16px;height:16px"></i> Swap</button>
                        <button class="btn btn-secondary" onclick="copyOutput()"><i data-lucide="copy" style="width:16px;height:16px"></i> Copy</button>
                        <button class="btn btn-danger" onclick="clearAll()"><i data-lucide="trash-2" style="width:16px;height:16px"></i> Clear</button>
                    </div>
                </div>
                <div class="ad-slot" style="margin-top:2rem"><div class="ad-placeholder">Advertisement</div></div>
            </div>
            <aside class="tool-sidebar">
                <div class="ad-slot"><div class="ad-placeholder">Advertisement</div></div>
            </aside>
        </div>
    </main>
    <footer class="footer"><div class="container"><p>&copy; 2024 ToolBox. All rights reserved.</p></div></footer>
    <div class="toast" id="toast"></div>
    <script src="https://unpkg.com/lucide@0.453.0"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script>
    lucide.createIcons();

    const inputArea = document.getElementById('inputArea');
    const outputArea = document.getElementById('outputArea');
    const inputCount = document.getElementById('inputCount');
    const outputCount = document.getElementById('outputCount');

    inputArea.addEventListener('input', () => {
        inputCount.textContent = inputArea.value.length;
    });

    function utf8ToBase64(str) {
        const encoder = new TextEncoder();
        const uint8Array = encoder.encode(str);
        let binary = '';
        uint8Array.forEach(byte => binary += String.fromCharCode(byte));
        return btoa(binary);
    }

    function base64ToUtf8(base64) {
        const binary = atob(base64);
        const uint8Array = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            uint8Array[i] = binary.charCodeAt(i);
        }
        return new TextDecoder().decode(uint8Array);
    }

    function encodeBase64() {
        const input = inputArea.value;
        if (!input) { showToast('Please enter some text to encode'); return; }
        try {
            outputArea.value = utf8ToBase64(input);
            outputCount.textContent = outputArea.value.length;
            showToast('Encoded successfully');
        } catch (e) {
            outputArea.value = '';
            outputCount.textContent = '0';
            showToast('Error: ' + e.message);
        }
    }

    function decodeBase64() {
        const input = inputArea.value.trim();
        if (!input) { showToast('Please enter Base64 string to decode'); return; }
        try {
            outputArea.value = base64ToUtf8(input);
            outputCount.textContent = outputArea.value.length;
            showToast('Decoded successfully');
        } catch (e) {
            outputArea.value = '';
            outputCount.textContent = '0';
            showToast('Invalid Base64 string');
        }
    }

    function swapValues() {
        const temp = inputArea.value;
        inputArea.value = outputArea.value;
        outputArea.value = temp;
        inputCount.textContent = inputArea.value.length;
        outputCount.textContent = outputArea.value.length;
    }

    function copyOutput() {
        if (!outputArea.value) { showToast('Nothing to copy'); return; }
        navigator.clipboard.writeText(outputArea.value).then(() => {
            showToast('Copied to clipboard');
        }).catch(() => {
            outputArea.select();
            document.execCommand('copy');
            showToast('Copied to clipboard');
        });
    }

    function clearAll() {
        inputArea.value = '';
        outputArea.value = '';
        inputCount.textContent = '0';
        outputCount.textContent = '0';
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
    </script>
</body>
</html>
