<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Signature - ToolBox</title>
    <meta name="description" content="URL signing">
    
    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>
    
    <!-- CryptoJS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    
    <style>
        /* Tool Page Custom Styles */
        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .workspace-grid .full-width { grid-column: 1 / -1; }
        .textarea-wrap { position: relative; }
        .textarea-wrap textarea, .textarea-wrap input {
            width: 100%; min-height: 200px; padding: 1rem; border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); font-family: 'Courier New', monospace; font-size: 14px;
            resize: vertical; background: var(--color-bg); color: var(--color-text);
            box-sizing: border-box;
        }
        .textarea-wrap input { min-height: auto; resize: none; }
        .textarea-wrap textarea:focus, .textarea-wrap input:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .textarea-label { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: var(--font-size-sm); color: var(--color-text); }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1rem 0; }
        .char-count { font-size: 12px; color: var(--color-text-tertiary); text-align: right; margin-top: 0.25rem; }
        
        /* Options Panel */
        .options-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1rem;
            padding: 1rem;
            background: var(--color-bg-secondary);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
        }
        .option-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .option-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--color-text-secondary);
        }
        .option-group select, .option-group input {
            padding: 0.5rem 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-bg);
            color: var(--color-text);
            font-size: 14px;
            min-width: 150px;
        }
        .option-group input[type="text"], .option-group input[type="password"] {
            min-width: 250px;
        }
        
        /* Result Display */
        .result-display {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-top: 1rem;
        }
        .result-display .result-label {
            font-weight: 600;
            font-size: 12px;
            color: var(--color-text-secondary);
            margin-bottom: 0.5rem;
        }
        .result-display .result-value {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            word-break: break-all;
            background: var(--color-bg);
            padding: 0.75rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            margin-bottom: 1rem;
        }
        .result-details {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            background: var(--color-bg);
            padding: 0.75rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            color: var(--color-text-secondary);
        }
        
        @media (max-width: 768px) {
            .workspace-grid { grid-template-columns: 1fr; }
            .options-panel { flex-direction: column; }
            .option-group input[type="text"], .option-group input[type="password"] { width: 100%; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="toolbox"></i>
                <span>ToolBox</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>
    
    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_crypto" data-i18n="cat_crypto">Encryption</a> / <span>URL Signature</span></div></div>
    
    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="pen-tool"></i></div>
                    <h1>URL Signature</h1>
                    <p>URL signing</p>
                </div>
                
                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <!-- Options Panel -->
                    <div class="options-panel">
                        <div class="option-group" style="flex: 1;">
                            <label>URL</label>
                            <input type="text" id="urlInput" placeholder="https://example.com/api?param=value">
                        </div>
                        <div class="option-group">
                            <label>Secret Key</label>
                            <input type="password" id="secretKey" placeholder="Your secret key">
                        </div>
                        <div class="option-group">
                            <label>Algorithm</label>
                            <select id="signAlgo">
                                <option value="HMAC-SHA256">HMAC-SHA256</option>
                                <option value="HMAC-SHA1">HMAC-SHA1</option>
                                <option value="HMAC-MD5">HMAC-MD5</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label>Expires (Unix Timestamp)</label>
                            <input type="text" id="expiresInput" placeholder="Optional: 1234567890">
                        </div>
                    </div>
                    
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="generateSignature()">
                            <i data-lucide="pen-tool"></i> Generate Signature
                        </button>
                        <button class="btn btn-secondary" onclick="copyResult()">
                            <i data-lucide="copy"></i> Copy URL
                        </button>
                        <button class="btn btn-danger" onclick="clearAll()">
                            <i data-lucide="trash-2"></i> Clear
                        </button>
                    </div>
                    
                    <!-- Result Display -->
                    <div class="result-display">
                        <div class="result-label">Signed URL</div>
                        <div class="result-value" id="resultUrl">-</div>
                        
                        <div class="result-label">Signature Details</div>
                        <div class="result-details" id="resultDetails">Algorithm: (none)
Sign String: (none)
Signature: (none)
Expires: (none)</div>
                    </div>
                </div>
                
                <!-- Ad Slot -->
                <div class="ad-slot" style="margin-top:2rem">
                    <span data-i18n="ad_label">Advertisement</span>
                </div>
            </div>
            <aside class="tool-sidebar">
                <div class="ad-slot">
                    <span data-i18n="ad_label">Advertisement</span>
                </div>
            </aside>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="#" data-i18n="footer_about">About</a>
                <a href="#" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="#" data-i18n="footer_terms">Terms of Service</a>
                <a href="#" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 ToolBox. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>
    
    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>
    
    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>
    
    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }
    });
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    }
    
    function generateSignature() {
        if (typeof CryptoJS === 'undefined') {
            showToast('CryptoJS library not loaded');
            return;
        }
        
        const urlInput = document.getElementById('urlInput');
        const secretKey = document.getElementById('secretKey');
        const signAlgo = document.getElementById('signAlgo');
        const expiresInput = document.getElementById('expiresInput');
        
        const url = urlInput.value.trim();
        const key = secretKey.value.trim();
        const algo = signAlgo.value;
        const expires = expiresInput.value.trim();

        if (!url) { showToast('Please enter a URL'); return; }
        if (!key) { showToast('Please enter a secret key'); return; }

        try {
            let signString = url;
            if (expires) {
                signString += expires;
            }

            let hash;
            switch (algo) {
                case 'HMAC-SHA256':
                    hash = CryptoJS.HmacSHA256(signString, key).toString(CryptoJS.enc.Hex);
                    break;
                case 'HMAC-SHA1':
                    hash = CryptoJS.HmacSHA1(signString, key).toString(CryptoJS.enc.Hex);
                    break;
                case 'HMAC-MD5':
                    hash = CryptoJS.HmacMD5(signString, key).toString(CryptoJS.enc.Hex);
                    break;
                default:
                    hash = CryptoJS.HmacSHA256(signString, key).toString(CryptoJS.enc.Hex);
            }

            const separator = url.includes('?') ? '&' : '?';
            let signedUrl = url + separator + 'signature=' + encodeURIComponent(hash);
            if (expires) {
                signedUrl += '&expires=' + encodeURIComponent(expires);
            }

            document.getElementById('resultUrl').textContent = signedUrl;

            const details = [
                'Algorithm: ' + algo,
                'Sign String: ' + signString,
                'Signature: ' + hash,
                expires ? 'Expires: ' + expires : 'Expires: (none)'
            ].join('\n');
            document.getElementById('resultDetails').textContent = details;

            showToast('Signature generated successfully');
        } catch (e) {
            showToast('Error: ' + e.message);
        }
    }

    function copyResult() {
        const result = document.getElementById('resultUrl').textContent;
        if (!result || result === '-') {
            showToast('No result to copy');
            return;
        }
        navigator.clipboard.writeText(result).then(() => {
            showToast('Copied to clipboard');
        }).catch(() => {
            showToast('Failed to copy');
        });
    }

    function clearAll() {
        document.getElementById('urlInput').value = '';
        document.getElementById('secretKey').value = '';
        document.getElementById('expiresInput').value = '';
        document.getElementById('resultUrl').textContent = '-';
        document.getElementById('resultDetails').textContent = 'Algorithm: (none)\nSign String: (none)\nSignature: (none)\nExpires: (none)';
        
        showToast('Cleared');
    }
    </script>
</body>
</html>
