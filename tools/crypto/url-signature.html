<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Signature Generator - ToolBox</title>
    <meta name="description" content="Generate HMAC signatures for URLs. Supports HMAC-SHA256, HMAC-SHA1, HMAC-MD5 with expiration time.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    <style>
        .workspace-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        .textarea-wrap { position: relative; }
        .textarea-wrap textarea {
            width: 100%; min-height: 80px; padding: 1rem; border: 1px solid var(--border, #e2e8f0);
            border-radius: 0.5rem; font-family: 'Courier New', monospace; font-size: 14px;
            resize: vertical; background: var(--bg, #fff); color: var(--text, #1e293b);
            box-sizing: border-box;
        }
        .textarea-wrap textarea:focus { outline: none; border-color: var(--primary, #3b82f6); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .textarea-label { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1rem 0; }
        .btn {
            padding: 0.5rem 1.25rem; border-radius: 0.5rem; border: none; cursor: pointer;
            font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 0.4rem;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--primary, #3b82f6); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover, #2563eb); }
        .btn-secondary { background: var(--bg-secondary, #f1f5f9); color: var(--text, #1e293b); border: 1px solid var(--border, #e2e8f0); }
        .btn-secondary:hover { background: var(--bg-tertiary, #e2e8f0); }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .toast {
            position: fixed; bottom: 2rem; right: 2rem; padding: 0.75rem 1.5rem;
            background: #1e293b; color: #fff; border-radius: 0.5rem; font-size: 14px;
            transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 9999;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .options-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem; margin-bottom: 1rem;
        }
        .option-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .option-group label { font-weight: 600; font-size: 13px; color: var(--text-muted, #64748b); }
        .option-group input, .option-group select {
            padding: 0.5rem 0.75rem; border: 1px solid var(--border, #e2e8f0);
            border-radius: 0.375rem; font-size: 14px; background: var(--bg, #fff);
            color: var(--text, #1e293b);
        }
        .option-group input:focus, .option-group select:focus {
            outline: none; border-color: var(--primary, #3b82f6);
        }
        .result-box {
            background: var(--bg-secondary, #f8fafc); border: 1px solid var(--border, #e2e8f0);
            border-radius: 0.5rem; padding: 1rem; margin-top: 0.5rem; position: relative;
        }
        .result-box-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;
        }
        .result-box-label { font-weight: 600; font-size: 13px; color: var(--text-muted, #64748b); }
        .result-box pre {
            font-family: 'Courier New', monospace; font-size: 13px; word-break: break-all;
            white-space: pre-wrap; color: var(--text, #1e293b); background: var(--bg, #fff);
            padding: 0.75rem; border-radius: 0.375rem; border: 1px solid var(--border, #e2e8f0);
        }
        .copy-btn-sm {
            background: none; border: none; cursor: pointer; color: var(--primary, #3b82f6);
            padding: 0.2rem; border-radius: 0.25rem; display: flex; align-items: center;
        }
        .copy-btn-sm:hover { background: var(--bg-tertiary, #e2e8f0); }
        .char-count { font-size: 12px; color: var(--text-muted, #94a3b8); text-align: right; margin-top: 0.25rem; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo"><i data-lucide="link" style="width:28px;height:28px"></i> ToolBox</a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" onclick="I18n.setLang(I18n.currentLang==='en'?'zh':'en')">EN</button>
                <button class="theme-btn" onclick="document.body.classList.toggle('dark')"><i data-lucide="sun"></i></button>
            </div>
        </div>
    </header>
    <div class="breadcrumb"><div class="container"><a href="../../index.html">Home</a> / <a href="../../index.html#crypto">Encryption</a> / <span>URL Signature</span></div></div>
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="link"></i></div>
                    <h1>URL Signature Generator</h1>
                    <p>Generate HMAC-based signatures for URLs with optional expiration time. Supports HMAC-SHA256, HMAC-SHA1, and HMAC-MD5 algorithms.</p>
                </div>
                <div class="tool-workspace">
                    <div class="options-grid">
                        <div class="option-group">
                            <label for="urlInput"><i data-lucide="globe" style="width:14px;height:14px"></i> URL</label>
                            <input type="text" id="urlInput" placeholder="https://example.com/api/data">
                        </div>
                        <div class="option-group">
                            <label for="secretKey"><i data-lucide="key" style="width:14px;height:14px"></i> Secret Key</label>
                            <input type="text" id="secretKey" placeholder="Enter your secret key...">
                        </div>
                        <div class="option-group">
                            <label for="expiresInput"><i data-lucide="clock" style="width:14px;height:14px"></i> Expires (Unix Timestamp, optional)</label>
                            <input type="text" id="expiresInput" placeholder="e.g. 1700000000">
                        </div>
                        <div class="option-group">
                            <label for="signAlgo"><i data-lucide="shield" style="width:14px;height:14px"></i> Signature Algorithm</label>
                            <select id="signAlgo">
                                <option value="HMAC-SHA256">HMAC-SHA256</option>
                                <option value="HMAC-SHA1">HMAC-SHA1</option>
                                <option value="HMAC-MD5">HMAC-MD5</option>
                            </select>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="generateSignature()"><i data-lucide="zap" style="width:16px;height:16px"></i> Generate</button>
                        <button class="btn btn-secondary" onclick="copyResult()"><i data-lucide="copy" style="width:16px;height:16px"></i> Copy</button>
                        <button class="btn btn-danger" onclick="clearAll()"><i data-lucide="trash-2" style="width:16px;height:16px"></i> Clear</button>
                    </div>
                    <div class="result-box">
                        <div class="result-box-header">
                            <span class="result-box-label">Signed URL</span>
                            <button class="copy-btn-sm" onclick="copyResult()" title="Copy"><i data-lucide="clipboard-copy" style="width:14px;height:14px"></i></button>
                        </div>
                        <pre id="resultUrl">-</pre>
                    </div>
                    <div class="result-box" style="margin-top:0.75rem">
                        <div class="result-box-header">
                            <span class="result-box-label">Signature Details</span>
                        </div>
                        <pre id="resultDetails">-</pre>
                    </div>
                </div>
                <div class="ad-slot" style="margin-top:2rem"><div class="ad-placeholder">Advertisement</div></div>
            </div>
            <aside class="tool-sidebar">
                <div class="ad-slot"><div class="ad-placeholder">Advertisement</div></div>
            </aside>
        </div>
    </main>
    <footer class="footer"><div class="container"><p>&copy; 2024 ToolBox. All rights reserved.</p></div></footer>
    <div class="toast" id="toast"></div>
    <script src="https://unpkg.com/lucide@0.453.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script>
    lucide.createIcons();

    function generateSignature() {
        const url = document.getElementById('urlInput').value.trim();
        const key = document.getElementById('secretKey').value.trim();
        const expires = document.getElementById('expiresInput').value.trim();
        const algo = document.getElementById('signAlgo').value;

        if (!url) { showToast('Please enter a URL'); return; }
        if (!key) { showToast('Please enter a secret key'); return; }

        try {
            let signString = url;
            if (expires) {
                signString += expires;
            }

            let hash;
            switch (algo) {
                case 'HMAC-SHA256':
                    hash = CryptoJS.HmacSHA256(signString, key).toString(CryptoJS.enc.Hex);
                    break;
                case 'HMAC-SHA1':
                    hash = CryptoJS.HmacSHA1(signString, key).toString(CryptoJS.enc.Hex);
                    break;
                case 'HMAC-MD5':
                    hash = CryptoJS.HmacMD5(signString, key).toString(CryptoJS.enc.Hex);
                    break;
                default:
                    hash = CryptoJS.HmacSHA256(signString, key).toString(CryptoJS.enc.Hex);
            }

            const separator = url.includes('?') ? '&' : '?';
            let signedUrl = url + separator + 'signature=' + encodeURIComponent(hash);
            if (expires) {
                signedUrl += '&expires=' + encodeURIComponent(expires);
            }

            document.getElementById('resultUrl').textContent = signedUrl;

            const details = [
                'Algorithm: ' + algo,
                'Sign String: ' + signString,
                'Signature: ' + hash,
                expires ? 'Expires: ' + expires : 'Expires: (none)'
            ].join('\n');
            document.getElementById('resultDetails').textContent = details;

            showToast('Signature generated successfully');
        } catch (e) {
            showToast('Error: ' + e.message);
        }
    }

    function copyResult() {
        const result = document.getElementById('resultUrl').textContent;
        if (!result || result === '-') { showToast('No result to copy'); return; }
        navigator.clipboard.writeText(result).then(() => showToast('Copied to clipboard'));
    }

    function clearAll() {
        document.getElementById('urlInput').value = '';
        document.getElementById('secretKey').value = '';
        document.getElementById('expiresInput').value = '';
        document.getElementById('resultUrl').textContent = '-';
        document.getElementById('resultDetails').textContent = '-';
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
    </script>
</body>
</html>
