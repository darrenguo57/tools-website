<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSA Encrypt - ToolBox</title>
    <meta name="description" content="RSA encryption">
    
    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>
    
    <!-- JSEncrypt Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    
    <style>
        /* Tool Page Custom Styles */
        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .workspace-grid .full-width { grid-column: 1 / -1; }
        .textarea-wrap { position: relative; }
        .textarea-wrap textarea, .textarea-wrap input {
            width: 100%; min-height: 200px; padding: 1rem; border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); font-family: 'Courier New', monospace; font-size: 14px;
            resize: vertical; background: var(--color-bg); color: var(--color-text);
            box-sizing: border-box;
        }
        .textarea-wrap input { min-height: auto; resize: none; }
        .textarea-wrap textarea:focus, .textarea-wrap input:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .textarea-label { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: var(--font-size-sm); color: var(--color-text); }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1rem 0; }
        .char-count { font-size: 12px; color: var(--color-text-tertiary); text-align: right; margin-top: 0.25rem; }
        
        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .tab-btn {
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .tab-btn:hover { background: var(--color-bg-secondary); }
        .tab-btn.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Key Display */
        .key-display {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .key-display .key-label {
            font-weight: 600;
            font-size: 12px;
            color: var(--color-text-secondary);
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .key-display .key-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            word-break: break-all;
            background: var(--color-bg);
            padding: 0.75rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            max-height: 150px;
            overflow-y: auto;
        }
        
        /* Options Panel */
        .options-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1rem;
            padding: 1rem;
            background: var(--color-bg-secondary);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
        }
        .option-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .option-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--color-text-secondary);
        }
        .option-group select, .option-group input {
            padding: 0.5rem 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-bg);
            color: var(--color-text);
            font-size: 14px;
            min-width: 150px;
        }
        
        @media (max-width: 768px) {
            .workspace-grid { grid-template-columns: 1fr; }
            .options-panel { flex-direction: column; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="toolbox"></i>
                <span>ToolBox</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>
    
    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_crypto" data-i18n="cat_crypto">Encryption</a> / <span>RSA Encrypt</span></div></div>
    
    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="key"></i></div>
                    <h1>RSA Encrypt</h1>
                    <p>RSA encryption</p>
                </div>
                
                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <!-- Tabs -->
                    <div class="tabs">
                        <button class="tab-btn active" onclick="switchTab('generate')">
                            <i data-lucide="key"></i> Generate Keys
                        </button>
                        <button class="tab-btn" onclick="switchTab('crypt')">
                            <i data-lucide="lock"></i> Encrypt/Decrypt
                        </button>
                    </div>
                    
                    <!-- Generate Keys Tab -->
                    <div id="tab-generate" class="tab-content active">
                        <div class="options-panel">
                            <div class="option-group">
                                <label>Key Length</label>
                                <select id="keyLength">
                                    <option value="512">512 bits</option>
                                    <option value="1024">1024 bits</option>
                                    <option value="2048" selected>2048 bits</option>
                                    <option value="4096">4096 bits</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="btn-group">
                            <button class="btn btn-primary" onclick="generateKeyPair()">
                                <i data-lucide="plus"></i> Generate Key Pair
                            </button>
                        </div>
                        
                        <div class="key-display">
                            <div class="key-label">
                                <span>Public Key</span>
                                <button class="btn btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 12px;" onclick="copyKey('publicKey')">
                                    <i data-lucide="copy"></i> Copy
                                </button>
                            </div>
                            <div class="key-value" id="publicKey">-</div>
                        </div>
                        
                        <div class="key-display">
                            <div class="key-label">
                                <span>Private Key</span>
                                <button class="btn btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 12px;" onclick="copyKey('privateKey')">
                                    <i data-lucide="copy"></i> Copy
                                </button>
                            </div>
                            <div class="key-value" id="privateKey">-</div>
                        </div>
                    </div>
                    
                    <!-- Encrypt/Decrypt Tab -->
                    <div id="tab-crypt" class="tab-content">
                        <div class="workspace-grid">
                            <div>
                                <div class="textarea-label">
                                    <i data-lucide="file-text"></i>
                                    <span>Plaintext / Ciphertext</span>
                                </div>
                                <div class="textarea-wrap">
                                    <textarea id="cryptInput" placeholder="Enter text..."></textarea>
                                </div>
                                <div class="char-count"><span id="cryptInputCount">0</span> characters</div>
                            </div>
                            <div>
                                <div class="textarea-label">
                                    <i data-lucide="file-output"></i>
                                    <span>Result</span>
                                </div>
                                <div class="textarea-wrap">
                                    <textarea id="cryptOutput" placeholder="Result..." readonly></textarea>
                                </div>
                                <div class="char-count"><span id="cryptOutputCount">0</span> characters</div>
                            </div>
                        </div>
                        
                        <div class="options-panel">
                            <div class="option-group" style="flex: 1;">
                                <label>Paste Public Key (for encrypt) or Private Key (for decrypt)</label>
                                <input type="text" id="cryptKey" placeholder="Paste your key here...">
                            </div>
                        </div>
                        
                        <div class="btn-group">
                            <button class="btn btn-primary" onclick="rsaEncrypt()">
                                <i data-lucide="lock"></i> Encrypt
                            </button>
                            <button class="btn btn-secondary" onclick="rsaDecrypt()">
                                <i data-lucide="unlock"></i> Decrypt
                            </button>
                            <button class="btn btn-secondary" onclick="copyCryptOutput()">
                                <i data-lucide="copy"></i> Copy
                            </button>
                            <button class="btn btn-danger" onclick="clearCrypt()">
                                <i data-lucide="trash-2"></i> Clear
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Ad Slot -->
                <div class="ad-slot" style="margin-top:2rem">
                    <span data-i18n="ad_label">Advertisement</span>
                </div>
            </div>
            <aside class="tool-sidebar">
                <div class="ad-slot">
                    <span data-i18n="ad_label">Advertisement</span>
                </div>
            </aside>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="#" data-i18n="footer_about">About</a>
                <a href="#" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="#" data-i18n="footer_terms">Terms of Service</a>
                <a href="#" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 ToolBox. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>
    
    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>
    
    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>
    
    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }
        
        // Input character counter
        const cryptInput = document.getElementById('cryptInput');
        const cryptInputCount = document.getElementById('cryptInputCount');
        if (cryptInput && cryptInputCount) {
            cryptInput.addEventListener('input', () => {
                cryptInputCount.textContent = cryptInput.value.length;
            });
        }
    });
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    }
    
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        if (tab === 'generate') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-generate').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-crypt').classList.add('active');
        }
        
        lucide.createIcons();
    }

    function generateKeyPair() {
        if (typeof JSEncrypt === 'undefined') {
            showToast('JSEncrypt library not loaded');
            return;
        }
        
        const bitLength = parseInt(document.getElementById('keyLength').value);
        showToast('Generating ' + bitLength + '-bit key pair...');
        
        setTimeout(() => {
            try {
                const crypt = new JSEncrypt({ default_key_size: bitLength });
                crypt.getKey();
                document.getElementById('publicKey').textContent = crypt.getPublicKey();
                document.getElementById('privateKey').textContent = crypt.getPrivateKey();
                showToast('Key pair generated successfully');
            } catch (e) {
                showToast('Error generating key pair: ' + e.message);
            }
        }, 50);
    }

    function copyKey(id) {
        const text = document.getElementById(id).textContent;
        if (!text || text === '-') {
            showToast('No key to copy');
            return;
        }
        navigator.clipboard.writeText(text).then(() => {
            showToast('Copied to clipboard');
        }).catch(() => {
            showToast('Failed to copy');
        });
    }

    function rsaEncrypt() {
        if (typeof JSEncrypt === 'undefined') {
            showToast('JSEncrypt library not loaded');
            return;
        }
        
        const cryptKey = document.getElementById('cryptKey').value.trim();
        const cryptInput = document.getElementById('cryptInput');
        const cryptOutput = document.getElementById('cryptOutput');
        const cryptOutputCount = document.getElementById('cryptOutputCount');
        
        const input = cryptInput.value;
        
        if (!cryptKey) { showToast('Please paste a public key'); return; }
        if (!input) { showToast('Please enter plaintext to encrypt'); return; }

        try {
            const crypt = new JSEncrypt();
            crypt.setPublicKey(cryptKey);
            const encrypted = crypt.encrypt(input);
            
            if (encrypted === false) {
                showToast('Encryption failed - check your public key');
                cryptOutput.value = '';
                cryptOutputCount.textContent = '0';
                return;
            }
            
            cryptOutput.value = encrypted;
            cryptOutputCount.textContent = cryptOutput.value.length;
            showToast('Encrypted successfully');
        } catch (e) {
            cryptOutput.value = '';
            cryptOutputCount.textContent = '0';
            showToast('Encryption error: ' + e.message);
        }
    }

    function rsaDecrypt() {
        if (typeof JSEncrypt === 'undefined') {
            showToast('JSEncrypt library not loaded');
            return;
        }
        
        const cryptKey = document.getElementById('cryptKey').value.trim();
        const cryptInput = document.getElementById('cryptInput');
        const cryptOutput = document.getElementById('cryptOutput');
        const cryptOutputCount = document.getElementById('cryptOutputCount');
        
        const input = cryptInput.value.trim();
        
        if (!cryptKey) { showToast('Please paste a private key'); return; }
        if (!input) { showToast('Please enter ciphertext to decrypt'); return; }

        try {
            const crypt = new JSEncrypt();
            crypt.setPrivateKey(cryptKey);
            const decrypted = crypt.decrypt(input);
            
            if (decrypted === false || decrypted === null) {
                showToast('Decryption failed - check your private key or ciphertext');
                cryptOutput.value = '';
                cryptOutputCount.textContent = '0';
                return;
            }
            
            cryptOutput.value = decrypted;
            cryptOutputCount.textContent = cryptOutput.value.length;
            showToast('Decrypted successfully');
        } catch (e) {
            cryptOutput.value = '';
            cryptOutputCount.textContent = '0';
            showToast('Decryption error: ' + e.message);
        }
    }

    function copyCryptOutput() {
        const cryptOutput = document.getElementById('cryptOutput');
        if (!cryptOutput.value) {
            showToast('Nothing to copy');
            return;
        }
        navigator.clipboard.writeText(cryptOutput.value).then(() => {
            showToast('Copied to clipboard');
        }).catch(() => {
            showToast('Failed to copy');
        });
    }

    function clearCrypt() {
        const cryptInput = document.getElementById('cryptInput');
        const cryptOutput = document.getElementById('cryptOutput');
        const cryptKey = document.getElementById('cryptKey');
        const cryptInputCount = document.getElementById('cryptInputCount');
        const cryptOutputCount = document.getElementById('cryptOutputCount');
        
        cryptInput.value = '';
        cryptOutput.value = '';
        cryptKey.value = '';
        cryptInputCount.textContent = '0';
        cryptOutputCount.textContent = '0';
        
        showToast('Cleared');
    }
    </script>
</body>
</html>
