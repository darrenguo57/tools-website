            background: var(--color-bg);

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }
        
        // Input character counter
        const messageInput = document.getElementById('messageInput');
        const messageCount = document.getElementById('messageCount');
        if (messageInput && messageCount) {
            messageInput.addEventListener('input', () => {
                messageCount.textContent = messageInput.value.length;
            });
        }
    });
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    }
    
    function calculateHMAC() {
        if (typeof CryptoJS === 'undefined') {
            showToast('CryptoJS library not loaded');
            return;
        }
        
        const messageInput = document.getElementById('messageInput');
        const hmacKey = document.getElementById('hmacKey');
        const hmacAlgo = document.getElementById('hmacAlgo');
        const hmacFormat = document.getElementById('hmacFormat');
        const hmacResult = document.getElementById('hmacResult');
        
        const message = messageInput.value;
        const key = hmacKey.value.trim();
        const algo = hmacAlgo.value;
        const format = hmacFormat.value;

        if (!message) { showToast('Please enter a message'); return; }
        if (!key) { showToast('Please enter a secret key'); return; }

        try {
            let hash;
            switch (algo) {
                case 'HMAC-MD5':
                    hash = CryptoJS.HmacMD5(message, key);
                    break;
                case 'HMAC-SHA1':
                    hash = CryptoJS.HmacSHA1(message, key);
                    break;
                case 'HMAC-SHA256':
                    hash = CryptoJS.HmacSHA256(message, key);
                    break;
                case 'HMAC-SHA512':
                    hash = CryptoJS.HmacSHA512(message, key);
                    break;
                default:
                    hash = CryptoJS.HmacSHA256(message, key);
            }

            const result = format === 'Hex' ? hash.toString(CryptoJS.enc.Hex) : hash.toString(CryptoJS.enc.Base64);
            hmacResult.textContent = result;
            showToast('HMAC calculated successfully');
        } catch (e) {
            hmacResult.textContent = '-';
            showToast('Error: ' + e.message);
        }
    }

    function copyResult() {
        const result = document.getElementById('hmacResult').textContent;
        if (!result || result === '-') {
            showToast('No result to copy');
            return;
        }
        navigator.clipboard.writeText(result).then(() => {
            showToast('Copied to clipboard');
        }).catch(() => {
            showToast('Failed to copy');
        });
    }

    function clearAll() {
        const messageInput = document.getElementById('messageInput');
        const hmacKey = document.getElementById('hmacKey');
        const hmacResult = document.getElementById('hmacResult');
        const messageCount = document.getElementById('messageCount');
        
        messageInput.value = '';
        hmacKey.value = '';
        hmacResult.textContent = '-';
        messageCount.textContent = '0';
        
        showToast('Cleared');
    }
    </script>
