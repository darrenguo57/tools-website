<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter - UseEasyTool</title>
    <meta name="description" content="Format and validate JSON">

    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">

    <style>
        /* Tool Page Custom Styles */
        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .workspace-grid .full-width { grid-column: 1 / -1; }
        .textarea-wrap { position: relative; }
        .textarea-wrap textarea, .textarea-wrap input {
            width: 100%; min-height: 200px; padding: 1rem; border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); font-family: 'Courier New', monospace; font-size: 14px;
            resize: vertical; background: var(--color-bg); color: var(--color-text);
            box-sizing: border-box;
        }
        .textarea-wrap input { min-height: auto; resize: none; }
        .textarea-wrap textarea:focus, .textarea-wrap input:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .textarea-label { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: var(--font-size-sm); color: var(--color-text); }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1rem 0; }
        .char-count { font-size: 12px; color: var(--color-text-tertiary); text-align: right; margin-top: 0.25rem; }
        .message-box { padding: 0.75rem 1rem; border-radius: var(--radius-md); margin-bottom: 1rem; font-size: 14px; display: none; }
        .message-box.show { display: block; }
        .error-box { background: rgba(220, 38, 38, 0.1); border: 1px solid rgba(220, 38, 38, 0.3); color: #dc2626; }
        .success-box { background: rgba(22, 163, 74, 0.1); border: 1px solid rgba(22, 163, 74, 0.3); color: #16a34a; }

        /* JSON Syntax Highlighting */
        .json-key { color: #2762d4; }
        .json-string { color: #0d7a3f; }
        .json-number { color: #b35900; }
        .json-boolean { color: #a020f0; }
        .json-null { color: #808080; }

        @media (max-width: 768px) { .workspace-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="UseEasyTool"></i>
                <span>UseEasyTool</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_formatters" data-i18n="cat_formatters">Formatters</a> / <span>JSON Formatter</span></div></div>

    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="braces"></i></div>
                    <h1>JSON Formatter</h1>
                    <p>Format and validate JSON</p>
                </div>

                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <!-- Message Boxes -->
                    <div class="message-box error-box" id="errorMsg"></div>
                    <div class="message-box success-box" id="successMsg"></div>

                    <div class="workspace-grid">
                        <div>
                            <div class="textarea-label">
                                <i data-lucide="file-text"></i>
                                <span data-i18n="input_label">Input</span>
                            </div>
                            <div class="textarea-wrap">
                                <textarea id="inputArea" data-i18n-placeholder="input_placeholder" placeholder="Enter JSON here..."></textarea>
                            </div>
                            <div class="char-count"><span id="inputCount">0</span> <span data-i18n="char_count">characters</span></div>
                        </div>
                        <div>
                            <div class="textarea-label">
                                <i data-lucide="file-output"></i>
                                <span data-i18n="output_label">Output</span>
                            </div>
                            <div class="textarea-wrap">
                                <div id="outputArea" style="min-height:200px;padding:1rem;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-bg);color:var(--color-text);font-family:'Courier New',monospace;font-size:14px;white-space:pre-wrap;overflow:auto;"><span style="color:#8b949e;">Formatted JSON will appear here...</span></div>
                            </div>
                            <div class="char-count"><span id="outputCount">0</span> <span data-i18n="char_count">characters</span></div>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" id="btnFormat"><i data-lucide="play"></i><span data-i18n="btn_format">Format</span></button>
                        <button class="btn btn-secondary" id="btnMinify"><i data-lucide="minimize-2"></i><span data-i18n="btn_minify">Minify</span></button>
                        <button class="btn btn-secondary" id="btnValidate"><i data-lucide="check-circle"></i><span data-i18n="btn_validate">Validate</span></button>
                        <button class="btn btn-secondary" id="btnCopy"><i data-lucide="copy"></i><span data-i18n="btn_copy">Copy</span></button>
                        <button class="btn btn-secondary" id="btnPaste"><i data-lucide="clipboard"></i><span data-i18n="btn_paste">Paste</span></button>
                        <button class="btn btn-danger" id="btnClear"><i data-lucide="trash-2"></i><span data-i18n="btn_clear">Clear</span></button>
                    </div>
                </div>

            </div>
            <aside class="tool-sidebar">
            </aside>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="#" data-i18n="footer_about">About</a>
                <a href="#" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="#" data-i18n="footer_terms">Terms of Service</a>
                <a href="#" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 UseEasyTool. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>

    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }

        // Initialize character counter
        const inputArea = document.getElementById('inputArea');
        const inputCount = document.getElementById('inputCount');
        const outputArea = document.getElementById('outputArea');
        const outputCount = document.getElementById('outputCount');

        if (inputArea && inputCount) {
            inputArea.addEventListener('input', () => {
                inputCount.textContent = inputArea.value.length;
            });
        }

        // Variables
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        let lastResult = '';

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
            successMsg.classList.remove('show');
        }

        function showSuccess(msg) {
            successMsg.textContent = msg;
            successMsg.classList.add('show');
            errorMsg.classList.remove('show');
        }

        function clearMessages() {
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
        }

        function getIndent() {
            return '\t';
        }

        function syntaxHighlight(json) {
            if (typeof json !== 'string') json = JSON.stringify(json, null, getIndent());
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(
                /("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
                function(match) {
                    let cls = 'json-number';
                    if (/^"/.test(match)) {
                        if (/:$/.test(match)) {
                            cls = 'json-key';
                        } else {
                            cls = 'json-string';
                        }
                    } else if (/true|false/.test(match)) {
                        cls = 'json-boolean';
                    } else if (/null/.test(match)) {
                        cls = 'json-null';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                }
            );
        }

        function parseJSON(str) {
            try {
                return { obj: JSON.parse(str), error: null };
            } catch (e) {
                const match = e.message.match(/position\s+(\d+)/i);
                let lineInfo = '';
                if (match) {
                    const pos = parseInt(match[1]);
                    const lines = str.substring(0, pos).split('\n');
                    lineInfo = ' (Line ' + lines.length + ', Column ' + lines[lines.length - 1].length + ')';
                }
                return { obj: null, error: e.message + lineInfo };
            }
        }

        function updateOutputCount() {
            if (outputArea && outputCount && lastResult) {
                outputCount.textContent = lastResult.length;
            }
        }

        // Format button
        document.getElementById('btnFormat').addEventListener('click', function() {
            clearMessages();
            const val = inputArea.value.trim();
            if (!val) { showError('Please enter JSON data.'); return; }
            const result = parseJSON(val);
            if (result.error) { showError('Invalid JSON: ' + result.error); outputArea.innerHTML = ''; return; }
            lastResult = JSON.stringify(result.obj, null, getIndent());
            outputArea.innerHTML = syntaxHighlight(lastResult);
            showSuccess('JSON formatted successfully!');
            updateOutputCount();
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });

        // Minify button
        document.getElementById('btnMinify').addEventListener('click', function() {
            clearMessages();
            const val = inputArea.value.trim();
            if (!val) { showError('Please enter JSON data.'); return; }
            const result = parseJSON(val);
            if (result.error) { showError('Invalid JSON: ' + result.error); outputArea.innerHTML = ''; return; }
            lastResult = JSON.stringify(result.obj);
            outputArea.innerHTML = syntaxHighlight(lastResult);
            showSuccess('JSON minified successfully! Size: ' + lastResult.length + ' characters.');
            updateOutputCount();
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });

        // Validate button
        document.getElementById('btnValidate').addEventListener('click', function() {
            clearMessages();
            const val = inputArea.value.trim();
            if (!val) { showError('Please enter JSON data.'); return; }
            const result = parseJSON(val);
            if (result.error) {
                showError('Invalid JSON: ' + result.error);
                outputArea.innerHTML = '';
            } else {
                showSuccess('Valid JSON! Root type: ' + (Array.isArray(result.obj) ? 'Array' : typeof result.obj) + ', Size: ' + JSON.stringify(result.obj).length + ' chars.');
                lastResult = JSON.stringify(result.obj, null, getIndent());
                outputArea.innerHTML = syntaxHighlight(lastResult);
                updateOutputCount();
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        });

        // Copy button
        document.getElementById('btnCopy').addEventListener('click', function() {
            if (!lastResult) { showError('No result to copy.'); return; }
            navigator.clipboard.writeText(lastResult).then(function() {
                showSuccess('Copied to clipboard!');
            }).catch(function() {
                showError('Failed to copy to clipboard.');
            });
        });

        // Paste button
        document.getElementById('btnPaste').addEventListener('click', function() {
            navigator.clipboard.readText().then(function(text) {
                inputArea.value = text;
                inputCount.textContent = text.length;
            }).catch(function() {
                showError('Failed to read clipboard. Please paste manually.');
            });
        });

        // Clear button
        document.getElementById('btnClear').addEventListener('click', function() {
            inputArea.value = '';
            outputArea.innerHTML = '<span style="color:#8b949e;">Formatted JSON will appear here...</span>';
            inputCount.textContent = '0';
            outputCount.textContent = '0';
            lastResult = '';
            clearMessages();
        });
    });
    </script>
</body>
</html>
