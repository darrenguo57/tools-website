        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        .textarea-wrap textarea:focus, .textarea-wrap input:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .textarea-label { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: var(--font-size-sm); color: var(--color-text); }

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }

        // Initialize character counter
        const inputArea = document.getElementById('inputArea');
        const inputCount = document.getElementById('inputCount');
        const outputArea = document.getElementById('outputArea');
        const outputCount = document.getElementById('outputCount');

        if (inputArea && inputCount) {
            inputArea.addEventListener('input', () => {
                inputCount.textContent = inputArea.value.length;
            });
        }

        // Variables
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        let lastResult = '';

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
            successMsg.classList.remove('show');
        }

        function showSuccess(msg) {
            successMsg.textContent = msg;
            successMsg.classList.add('show');
            errorMsg.classList.remove('show');
        }

        function clearMessages() {
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
        }

        function formatXML(xml, indent) {
            const PADDING = indent || '  ';
            let formatted = '';
            let pad = 0;

            // Normalize line breaks
            xml = xml.replace(/(>)(<)(\/*)/g, '$1\n$2$3');
            xml.split('\n').forEach(function(node) {
                node = node.trim();
                if (!node) return;

                let padding = '';
                if (node.match(/<\w[^>]*[^/]>.*$/)) {
                    // Opening tag
                    padding = PADDING.repeat(pad);
                    if (!node.match(/<\w[^>]*[^/]>.*<\/\w[^>]*>/)) {
                        // Not self-closing, not immediately closed
                        pad++;
                    }
                } else if (node.match(/^<\/\w/)) {
                    // Closing tag
                    pad = Math.max(0, pad - 1);
                    padding = PADDING.repeat(pad);
                } else if (node.match(/^<\w[^>]*\/>/)) {
                    // Self-closing tag
                    padding = PADDING.repeat(pad);
                } else {
                    padding = PADDING.repeat(pad);
                }

                formatted += padding + node + '\n';
            });

            return formatted.trim();
        }

        function minifyXML(xml) {
            return xml.replace(/>\s+</g, '><').replace(/\s+/g, ' ').trim();
        }

        function validateXML(xml) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(xml, 'text/xml');
            const errorNode = doc.querySelector('parsererror');
            if (errorNode) {
                const msg = errorNode.textContent;
                // Try to extract line number
                const lineMatch = msg.match(/line\s+(\d+)/i);
                const colMatch = msg.match(/column\s+(\d+)/i);
                let info = 'Invalid XML.';
                if (lineMatch) info += ' Line ' + lineMatch[1] + '.';
                if (colMatch) info += ' Column ' + colMatch[1] + '.';
                info += ' ' + msg.substring(0, 200);
                return { valid: false, message: info };
            }
            return { valid: true, message: 'Valid XML document.' };
        }

        function highlightXML(xml) {
            // Escape HTML first
            let escaped = xml.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // Highlight XML prolog
            escaped = escaped.replace(/(&lt;\?[\s\S]*?\?&gt;)/g, '<span class="xml-prolog">$1</span>');

            // Highlight comments
            escaped = escaped.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="xml-comment">$1</span>');

            // Highlight CDATA
            escaped = escaped.replace(/(&lt;!\[CDATA\[[\s\S]*?\]\]&gt;)/g, '<span class="xml-cdata">$1</span>');

            // Highlight tags
            escaped = escaped.replace(/(&lt;\/?)([\w:-]+)/g, '$1<span class="xml-tag">$2</span>');

            // Highlight closing bracket
            escaped = escaped.replace(/(\/?&gt;)/g, '<span class="xml-tag">$1</span>');

            // Highlight attributes name="value"
            escaped = escaped.replace(/([\w:-]+)(=)(&quot;|&#39;|")(.*?)(\3)/g,
                '<span class="xml-attr-name">$1</span>$2<span class="xml-attr-value">$3$4$5</span>');

            // Highlight attribute values with single quotes
            escaped = escaped.replace(/([\w:-]+)(=)(&#39;)(.*?)(&#39;)/g,
                '<span class="xml-attr-name">$1</span>$2<span class="xml-attr-value">$3$4$5</span>');

            return escaped;
        }

        function updateOutputCount() {
            if (outputArea && outputCount && lastResult) {
                outputCount.textContent = lastResult.length;
            }
        }

        // Format button
        document.getElementById('btnFormat').addEventListener('click', function() {
            clearMessages();
            const val = inputArea.value.trim();
            if (!val) { showError('Please enter XML data.'); return; }
            const validation = validateXML(val);
            if (!validation.valid) { showError(validation.message); return; }
            lastResult = formatXML(val);
            outputArea.innerHTML = highlightXML(lastResult);
            showSuccess('XML formatted successfully!');
            updateOutputCount();
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });

        // Minify button
        document.getElementById('btnMinify').addEventListener('click', function() {
            clearMessages();
            const val = inputArea.value.trim();
            if (!val) { showError('Please enter XML data.'); return; }
            const validation = validateXML(val);
            if (!validation.valid) { showError(validation.message); return; }
            lastResult = minifyXML(val);
            outputArea.innerHTML = highlightXML(lastResult);
            showSuccess('XML minified! Size: ' + lastResult.length + ' characters.');
            updateOutputCount();
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });

        // Validate button
        document.getElementById('btnValidate').addEventListener('click', function() {
            clearMessages();
            const val = inputArea.value.trim();
            if (!val) { showError('Please enter XML data.'); return; }
            const validation = validateXML(val);
            if (validation.valid) {
                showSuccess(validation.message);
                lastResult = formatXML(val);
                outputArea.innerHTML = highlightXML(lastResult);
                updateOutputCount();
                if (typeof lucide !== 'undefined') lucide.createIcons();
            } else {
                showError(validation.message);
                outputArea.innerHTML = '';
            }
        });

        // Copy button
        document.getElementById('btnCopy').addEventListener('click', function() {
            if (!lastResult) { showError('No result to copy.'); return; }
            navigator.clipboard.writeText(lastResult).then(function() {
                showSuccess('Copied to clipboard!');
            }).catch(function() {
                showError('Failed to copy.');
            });
        });

        // Paste button
        document.getElementById('btnPaste').addEventListener('click', function() {
            navigator.clipboard.readText().then(function(text) {
                inputArea.value = text;
                inputCount.textContent = text.length;
            }).catch(function() {
                showError('Failed to read clipboard.');
            });
        });

        // Clear button
        document.getElementById('btnClear').addEventListener('click', function() {
            inputArea.value = '';
            outputArea.innerHTML = '<span style="color:#8b949e;">Formatted XML will appear here...</span>';
            inputCount.textContent = '0';
            outputCount.textContent = '0';
            lastResult = '';
            clearMessages();
        });
    });
    </script>
