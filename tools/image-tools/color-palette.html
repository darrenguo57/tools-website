<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker - ToolBox</title>
    <meta name="description" content="Extract color palette from images">
    
    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    
    <style>
        /* Color Palette Tool Styles */
        .palette-upload { border: 2px dashed var(--color-border); border-radius: var(--radius-xl); padding: 3rem 2rem; text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 1.5rem; }
        .palette-upload:hover { border-color: var(--color-primary); background: var(--color-primary-light); }
        .palette-preview { background: var(--color-bg-secondary); border-radius: var(--radius-lg); padding: 1rem; margin-bottom: 1.5rem; display: none; }
        .palette-preview.active { display: block; }
        .palette-preview img { max-width: 100%; max-height: 300px; border-radius: var(--radius-md); }
        .palette-bar { display: flex; border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 1.5rem; min-height: 60px; }
        .palette-bar-item { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; min-height: 60px; }
        .palette-bar-item:hover { transform: scaleY(1.2); }
        .palette-bar-item .color-label { font-size: 10px; font-weight: 600; opacity: 0; transition: opacity 0.2s; }
        .palette-bar-item:hover .color-label { opacity: 1; }
        .palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .color-card { background: var(--color-bg-secondary); border-radius: var(--radius-lg); overflow: hidden; }
        .color-swatch { height: 100px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .color-swatch .copy-hint { font-size: 11px; opacity: 0; transition: opacity 0.2s; }
        .color-swatch:hover .copy-hint { opacity: 1; }
        .color-info { padding: 0.75rem; }
        .color-info-row { display: flex; justify-content: space-between; align-items: center; padding: 0.25rem 0; font-size: 12px; }
        .color-info-row span:first-child { color: var(--color-text-tertiary); }
        .color-info-value { font-family: monospace; font-size: 11px; }
        .color-info-copy { background: none; border: none; cursor: pointer; padding: 2px; color: var(--color-text-tertiary); }
        .color-info-copy:hover { color: var(--color-primary); }
        .palette-export { background: var(--color-bg-secondary); border-radius: var(--radius-lg); padding: 1rem; margin-bottom: 1rem; }
        .export-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .export-tab { padding: 0.5rem 1rem; border: 1px solid var(--color-border); background: var(--color-bg); border-radius: var(--radius-md); cursor: pointer; font-size: 13px; }
        .export-tab:hover { background: var(--color-bg-tertiary); }
        .export-tab.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }
        .export-output { width: 100%; min-height: 150px; padding: 1rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-text); font-family: monospace; font-size: 12px; resize: vertical; box-sizing: border-box; }
        
        @media (max-width: 768px) { .palette-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="toolbox"></i>
                <span>ToolBox</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>
    
    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_image_tools" data-i18n="cat_image_tools">Image Tools</a> / <span data-i18n="palette_title">Color Picker</span></div></div>
    
    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="pipette"></i></div>
                    <h1 data-i18n="palette_title">Color Picker</h1>
                    <p data-i18n="palette_desc">Extract beautiful color palettes from images</p>
                </div>
                
                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <!-- Options -->
                    <div style="display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:1rem;padding:1rem;background:var(--color-bg-secondary);border-radius:var(--radius-lg)">
                        <div style="display:flex;align-items:center;gap:0.5rem">
                            <label style="font-size:14px;color:var(--color-text-secondary)">Colors:</label>
                            <input type="number" id="colorCount" value="8" min="2" max="16" style="width:60px;padding:0.5rem;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg);color:var(--color-text)">
                        </div>
                    </div>
                    
                    <!-- Upload Zone -->
                    <div class="palette-upload" id="dropzone" onclick="document.getElementById('fileInput').click()">
                        <i data-lucide="upload-cloud" style="width:48px;height:48px;color:var(--color-text-tertiary);margin-bottom:1rem"></i>
                        <div style="font-weight:500;margin-bottom:0.25rem" data-i18n="palette_upload_text">Drop image here or click to upload</div>
                        <div style="font-size:12px;color:var(--color-text-tertiary)" data-i18n="palette_upload_hint">Supports: JPG, PNG, WebP, GIF</div>
                        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">
                    </div>
                    
                    <!-- Image Preview -->
                    <div class="palette-preview" id="imagePreview"></div>
                    
                    <!-- Actions -->
                    <div class="btn-group" id="editorArea" style="display:none">
                        <button class="btn btn-primary" onclick="extractColors()">
                            <i data-lucide="palette"></i> <span data-i18n="btn_extract">Extract Palette</span>
                        </button>
                        <button class="btn btn-danger" onclick="clearAll()">
                            <i data-lucide="trash-2"></i> <span data-i18n="btn_clear">Clear</span>
                        </button>
                    </div>
                    
                    <!-- Palette Bar -->
                    <div class="palette-bar" id="paletteBar" style="display:none"></div>
                    
                    <!-- Color Grid -->
                    <div class="palette-grid" id="colorGrid" style="display:none"></div>
                    
                    <!-- Export Section -->
                    <div class="palette-export" id="exportSection" style="display:none">
                        <div style="font-weight:600;margin-bottom:1rem">Export Palette</div>
                        <div class="export-tabs">
                            <button class="export-tab active" onclick="setExportFormat('css')">CSS</button>
                            <button class="export-tab" onclick="setExportFormat('json')">JSON</button>
                            <button class="export-tab" onclick="setExportFormat('tailwind')">Tailwind</button>
                        </div>
                        <textarea class="export-output" id="exportOutput" readonly></textarea>
                        <div class="btn-group" style="justify-content:flex-start;margin-top:1rem">
                            <button class="btn btn-secondary" onclick="copyExport()">
                                <i data-lucide="copy"></i> <span data-i18n="btn_copy">Copy</span>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Ad Slot -->
                <div class="ad-slot" style="margin-top:2rem">
                    <span data-i18n="ad_label">Advertisement</span>
                </div>
            </div>
            <aside class="tool-sidebar">
                <div class="ad-slot">
                    <span data-i18n="ad_label">Advertisement</span>
                </div>
            </aside>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="#" data-i18n="footer_about">About</a>
                <a href="#" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="#" data-i18n="footer_terms">Terms of Service</a>
                <a href="#" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 ToolBox. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>
    
    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>
    
    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>
    
    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>
    
    <script>
    // Global state
    let currentImage = null;
    let paletteColors = [];
    
    // DOM Elements
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const imagePreview = document.getElementById('imagePreview');
    const paletteBar = document.getElementById('paletteBar');
    const colorGrid = document.getElementById('colorGrid');
    const exportSection = document.getElementById('exportSection');
    const editorArea = document.getElementById('editorArea');
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        if (typeof I18n !== 'undefined') {
            I18n.init();
        }
        
        // Dropzone events
        dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
        dropzone.addEventListener('drop', e => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        });
    });
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    }
    
    function handleFile(file) {
        if (!file || !file.type.startsWith('image/')) { showToast('Please select an image file'); return; }
        const img = new Image();
        img.onload = () => {
            currentImage = img;
            imagePreview.classList.add('active');
            imagePreview.innerHTML = '<img src="' + img.src + '" alt="Uploaded image">';
            editorArea.style.display = 'flex';
            showToast('Image loaded. Click Extract Palette to analyze colors.');
        };
        img.src = URL.createObjectURL(file);
    }
    
    function extractColors() {
        if (!currentImage) { showToast('Please upload an image first'); return; }
    
        const count = parseInt(document.getElementById('colorCount').value) || 8;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
    
        // Scale down for performance
        const maxDim = 200;
        const scale = Math.min(maxDim / currentImage.width, maxDim / currentImage.height, 1);
        canvas.width = Math.round(currentImage.width * scale);
        canvas.height = Math.round(currentImage.height * scale);
        ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
    
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = imageData.data;
    
        // Collect pixels
        const pixelArray = [];
        for (let i = 0; i < pixels.length; i += 4) {
            pixelArray.push([pixels[i], pixels[i + 1], pixels[i + 2]]);
        }
    
        // Median cut algorithm
        paletteColors = medianCut(pixelArray, count);
    
        // Render palette
        renderPalette();
        showToast('Palette extracted: ' + paletteColors.length + ' colors');
    }
    
    function medianCut(pixels, numColors) {
        if (pixels.length === 0) return [];
        if (numColors <= 1) {
            const avg = averageColor(pixels);
            return [avg];
        }
    
        let buckets = [pixels];
    
        while (buckets.length < numColors) {
            let maxRange = -1;
            let maxIndex = 0;
            let splitChannel = 0;
    
            for (let i = 0; i < buckets.length; i++) {
                const bucket = buckets[i];
                if (bucket.length < 2) continue;
                for (let ch = 0; ch < 3; ch++) {
                    const vals = bucket.map(p => p[ch]);
                    const range = Math.max(...vals) - Math.min(...vals);
                    if (range > maxRange) {
                        maxRange = range;
                        maxIndex = i;
                        splitChannel = ch;
                    }
                }
            }
    
            if (maxRange <= 0) break;
    
            const bucket = buckets[maxIndex];
            bucket.sort((a, b) => a[splitChannel] - b[splitChannel]);
            const mid = Math.floor(bucket.length / 2);
            buckets.splice(maxIndex, 1, bucket.slice(0, mid), bucket.slice(mid));
        }
    
        return buckets.map(bucket => averageColor(bucket));
    }
    
    function averageColor(pixels) {
        let r = 0, g = 0, b = 0;
        for (const p of pixels) { r += p[0]; g += p[1]; b += p[2]; }
        const n = pixels.length;
        return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
    }
    
    function rgbToHex(r, g, b) {
        return '#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('');
    }
    
    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) { h = s = 0; }
        else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                case g: h = ((b - r) / d + 2) / 6; break;
                case b: h = ((r - g) / d + 4) / 6; break;
            }
        }
        return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
    }
    
    function getContrastColor(r, g, b) {
        const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return luminance > 0.5 ? '#000000' : '#ffffff';
    }
    
    function renderPalette() {
        // Palette bar
        paletteBar.style.display = 'flex';
        paletteBar.innerHTML = paletteColors.map((c, i) => {
            const hex = rgbToHex(c[0], c[1], c[2]);
            const contrast = getContrastColor(c[0], c[1], c[2]);
            return '<div class="palette-bar-item" style="background:' + hex + '" onclick="copyColor(\'' + hex + '\')" title="Click to copy ' + hex + '"><span class="color-label" style="color:' + contrast + '">' + hex + '</span></div>';
        }).join('');
    
        // Color grid
        colorGrid.style.display = 'grid';
        colorGrid.innerHTML = paletteColors.map((c, i) => {
            const hex = rgbToHex(c[0], c[1], c[2]);
            const rgb = 'rgb(' + c[0] + ', ' + c[1] + ', ' + c[2] + ')';
            const hsl = rgbToHsl(c[0], c[1], c[2]);
            const hslStr = 'hsl(' + hsl[0] + ', ' + hsl[1] + '%, ' + hsl[2] + '%)';
            const contrast = getContrastColor(c[0], c[1], c[2]);
            return '<div class="color-card"><div class="color-swatch" style="background:' + hex + '" onclick="copyColor(\'' + hex + '\')"><span class="copy-hint" style="color:' + contrast + '">Click to copy</span></div><div class="color-info"><div class="color-info-row"><span>HEX</span><span style="display:flex;align-items:center;gap:0.25rem"><span class="color-info-value">' + hex + '</span><button class="color-info-copy" onclick="copyColor(\'' + hex + '\')"><i data-lucide="copy" style="width:12px;height:12px"></i></button></span></div><div class="color-info-row"><span>RGB</span><span style="display:flex;align-items:center;gap:0.25rem"><span class="color-info-value">' + rgb + '</span><button class="color-info-copy" onclick="copyColor(\'' + rgb + '\')"><i data-lucide="copy" style="width:12px;height:12px"></i></button></span></div><div class="color-info-row"><span>HSL</span><span style="display:flex;align-items:center;gap:0.25rem"><span class="color-info-value">' + hslStr + '</span><button class="color-info-copy" onclick="copyColor(\'' + hslStr + '\')"><i data-lucide="copy" style="width:12px;height:12px"></i></button></span></div></div></div>';
        }).join('');
    
        lucide.createIcons();
        exportSection.style.display = 'block';
        exportAs('css');
    }
    
    function copyColor(color) {
        navigator.clipboard.writeText(color).then(() => showToast('Copied: ' + color))
            .catch(() => showToast('Copied: ' + color));
    }
    
    function setExportFormat(format) {
        document.querySelectorAll('.export-tab').forEach(tab => tab.classList.remove('active'));
        event.target.classList.add('active');
        exportAs(format);
    }
    
    function exportAs(format) {
        if (paletteColors.length === 0) return;
        let output = '';
        if (format === 'css') {
            output = ':root {\n' + paletteColors.map((c, i) => {
                const hex = rgbToHex(c[0], c[1], c[2]);
                return '  --color-' + (i + 1) + ': ' + hex + ';';
            }).join('\n') + '\n}';
        } else if (format === 'json') {
            output = JSON.stringify(paletteColors.map((c, i) => ({
                name: 'Color ' + (i + 1),
                hex: rgbToHex(c[0], c[1], c[2]),
                rgb: 'rgb(' + c[0] + ', ' + c[1] + ', ' + c[2] + ')',
                hsl: rgbToHsl(c[0], c[1], c[2])
            })), null, 2);
        } else if (format === 'tailwind') {
            output = '// tailwind.config.js\nmodule.exports = {\n  theme: {\n    extend: {\n      colors: {\n' + paletteColors.map((c, i) => {
                const hex = rgbToHex(c[0], c[1], c[2]);
                return '        \'palette-' + (i + 1) + '\': \'' + hex + '\',';
            }).join('\n') + '\n      }\n    }\n  }\n}';
        }
        document.getElementById('exportOutput').value = output;
    }
    
    function copyExport() {
        const output = document.getElementById('exportOutput').value;
        if (!output) return;
        navigator.clipboard.writeText(output).then(() => showToast('Export copied to clipboard'));
    }
    
    function clearAll() {
        currentImage = null;
        paletteColors = [];
        imagePreview.classList.remove('active');
        imagePreview.innerHTML = '';
        paletteBar.style.display = 'none';
        paletteBar.innerHTML = '';
        colorGrid.style.display = 'none';
        colorGrid.innerHTML = '';
        exportSection.style.display = 'none';
        editorArea.style.display = 'none';
        fileInput.value = '';
    }
    </script>
</body>
