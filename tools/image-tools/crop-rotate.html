<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Crop & Rotate - ToolBox</title>
    <meta name="description" content="Crop, rotate, and flip images online. Free tool with canvas-based editing.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    <style>
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1rem 0; }
        .btn {
            padding: 0.5rem 1.25rem; border-radius: 0.5rem; border: none; cursor: pointer;
            font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 0.4rem;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--primary, #3b82f6); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover, #2563eb); }
        .btn-secondary { background: var(--bg-secondary, #f1f5f9); color: var(--text, #1e293b); border: 1px solid var(--border, #e2e8f0); }
        .btn-secondary:hover { background: var(--bg-tertiary, #e2e8f0); }
        .btn-success { background: #10b981; color: #fff; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-warning { background: #f59e0b; color: #fff; }
        .btn-warning:hover { background: #d97706; }
        .toast {
            position: fixed; bottom: 2rem; right: 2rem; padding: 0.75rem 1.5rem;
            background: #1e293b; color: #fff; border-radius: 0.5rem; font-size: 14px;
            transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 9999;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .dropzone {
            border: 2px dashed var(--border, #e2e8f0); border-radius: 0.75rem;
            padding: 2.5rem; text-align: center; cursor: pointer; transition: all 0.2s;
            background: var(--bg-secondary, #f8fafc);
        }
        .dropzone:hover, .dropzone.dragover { border-color: var(--primary, #3b82f6); background: rgba(59,130,246,0.05); }
        .dropzone-icon { width: 48px; height: 48px; color: var(--text-muted, #94a3b8); margin: 0 auto 0.75rem; }
        .dropzone-text { font-size: 14px; color: var(--text-secondary, #64748b); }
        .canvas-container {
            position: relative; border: 1px solid var(--border, #e2e8f0); border-radius: 0.75rem;
            overflow: hidden; background: repeating-conic-gradient(#e5e7eb 0% 25%, #fff 0% 50%) 50% / 20px 20px;
            display: flex; align-items: center; justify-content: center; min-height: 300px;
        }
        .canvas-container canvas { display: block; max-width: 100%; }
        .crop-overlay {
            position: absolute; border: 2px dashed #3b82f6; background: rgba(59,130,246,0.15);
            cursor: move; display: none; z-index: 10;
        }
        .crop-overlay::before, .crop-overlay::after {
            content: ''; position: absolute; background: rgba(59,130,246,0.3);
        }
        .crop-overlay::before { top: 50%; left: 0; right: 0; height: 1px; }
        .crop-overlay::after { left: 50%; top: 0; bottom: 0; width: 1px; }
        .toolbar {
            display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.75rem;
            background: var(--bg-secondary, #f8fafc); border: 1px solid var(--border, #e2e8f0);
            border-radius: 0.75rem; margin-bottom: 1rem;
        }
        .toolbar-group { display: flex; gap: 0.25rem; align-items: center; }
        .toolbar-divider { width: 1px; height: 24px; background: var(--border, #e2e8f0); margin: 0 0.25rem; }
        .toolbar-btn {
            padding: 0.4rem 0.6rem; border: 1px solid var(--border, #e2e8f0); border-radius: 0.375rem;
            background: var(--bg, #fff); color: var(--text, #1e293b); cursor: pointer;
            font-size: 13px; display: flex; align-items: center; gap: 0.3rem; transition: all 0.2s;
        }
        .toolbar-btn:hover { background: var(--primary, #3b82f6); color: #fff; border-color: var(--primary, #3b82f6); }
        .toolbar-btn.active { background: var(--primary, #3b82f6); color: #fff; border-color: var(--primary, #3b82f6); }
        .toolbar-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .toolbar-btn:disabled:hover { background: var(--bg, #fff); color: var(--text, #1e293b); border-color: var(--border, #e2e8f0); }
        .info-bar {
            display: flex; justify-content: space-between; padding: 0.5rem 0.75rem;
            background: var(--bg-secondary, #f8fafc); border: 1px solid var(--border, #e2e8f0);
            border-radius: 0.5rem; font-size: 12px; color: var(--text-muted, #94a3b8); margin-bottom: 1rem;
        }
        .angle-input {
            width: 60px; padding: 0.25rem 0.35rem; border: 1px solid var(--border, #e2e8f0);
            border-radius: 0.25rem; font-size: 13px; text-align: center;
            background: var(--bg, #fff); color: var(--text, #1e293b);
        }
        .empty-state { text-align: center; padding: 2rem; color: var(--text-muted, #94a3b8); font-size: 14px; }
        .preview-section { margin-top: 1rem; }
        .preview-section h4 { font-size: 14px; font-weight: 600; margin-bottom: 0.5rem; color: var(--text, #1e293b); }
        .preview-canvas-wrap {
            border: 1px solid var(--border, #e2e8f0); border-radius: 0.5rem; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: repeating-conic-gradient(#e5e7eb 0% 25%, #fff 0% 50%) 50% / 20px 20px;
        }
        .preview-canvas-wrap canvas { display: block; max-width: 100%; }
        @media (max-width: 768px) { .toolbar { flex-direction: column; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo"><i data-lucide="image" style="width:28px;height:28px"></i> ToolBox</a>
            <div class="header-search"><i data-lucide="search"></i><input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools..."></div>
            <div class="header-actions">
                <button class="lang-btn" onclick="I18n.setLang(I18n.currentLang==='en'?'zh':'en')">EN</button>
                <button class="theme-btn" onclick="document.body.classList.toggle('dark')"><i data-lucide="sun"></i></button>
            </div>
        </div>
    </header>
    <div class="breadcrumb"><div class="container"><a href="../../index.html">Home</a> / <a href="../../index.html#image-tools">Image Tools</a> / <span>Crop & Rotate</span></div></div>
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="crop"></i></div>
                    <h1>Image Crop & Rotate</h1>
                    <p>Crop, rotate, and flip images with an interactive canvas editor.</p>
                </div>
                <div class="tool-workspace">
                    <div class="dropzone" id="dropzone">
                        <div class="dropzone-icon"><i data-lucide="upload-cloud"></i></div>
                        <div class="dropzone-text">Drag & drop an image here, or click to select</div>
                        <div class="dropzone-hint">Supports JPEG, PNG, WebP, GIF, BMP</div>
                        <input type="file" id="fileInput" accept="image/*" hidden>
                    </div>

                    <div id="editorArea" style="display:none">
                        <!-- Toolbar -->
                        <div class="toolbar">
                            <div class="toolbar-group">
                                <button class="toolbar-btn" id="btnCrop" onclick="toggleCropMode()"><i data-lucide="crop" style="width:14px;height:14px"></i> Crop</button>
                            </div>
                            <div class="toolbar-divider"></div>
                            <div class="toolbar-group">
                                <button class="toolbar-btn" onclick="rotate(-90)"><i data-lucide="rotate-ccw" style="width:14px;height:14px"></i> -90</button>
                                <button class="toolbar-btn" onclick="rotate(90)"><i data-lucide="rotate-cw" style="width:14px;height:14px"></i> +90</button>
                                <input type="number" class="angle-input" id="freeAngle" value="0" min="-360" max="360">
                                <button class="toolbar-btn" onclick="rotateFree()"><i data-lucide="refresh-cw" style="width:14px;height:14px"></i> Apply</button>
                            </div>
                            <div class="toolbar-divider"></div>
                            <div class="toolbar-group">
                                <button class="toolbar-btn" onclick="flip('h')"><i data-lucide="flip-horizontal" style="width:14px;height:14px"></i> Flip H</button>
                                <button class="toolbar-btn" onclick="flip('v')"><i data-lucide="flip-vertical" style="width:14px;height:14px"></i> Flip V</button>
                            </div>
                            <div class="toolbar-divider"></div>
                            <div class="toolbar-group">
                                <button class="toolbar-btn" onclick="resetImage()"><i data-lucide="undo-2" style="width:14px;height:14px"></i> Reset</button>
                            </div>
                        </div>

                        <!-- Info Bar -->
                        <div class="info-bar">
                            <span id="imageInfo">-</span>
                            <span id="cropInfo" style="display:none">Crop: -</span>
                        </div>

                        <!-- Canvas -->
                        <div class="canvas-container" id="canvasContainer">
                            <canvas id="mainCanvas"></canvas>
                            <div class="crop-overlay" id="cropOverlay"></div>
                        </div>

                        <!-- Actions -->
                        <div class="btn-group" style="margin-top:1rem">
                            <button class="btn btn-primary" id="btnApplyCrop" onclick="applyCrop()" style="display:none"><i data-lucide="check" style="width:16px;height:16px"></i> Apply Crop</button>
                            <button class="btn btn-success" onclick="downloadResult()"><i data-lucide="download" style="width:16px;height:16px"></i> Download</button>
                            <button class="btn btn-danger" onclick="clearAll()"><i data-lucide="trash-2" style="width:16px;height:16px"></i> Clear</button>
                        </div>
                    </div>
                </div>
                <div class="ad-slot" style="margin-top:2rem"><div class="ad-placeholder">Advertisement</div></div>
            </div>
            <aside class="tool-sidebar"><div class="ad-slot"><div class="ad-placeholder">Advertisement</div></div></aside>
        </div>
    </main>
    <footer class="footer"><div class="container"><p>&copy; 2024 ToolBox. All rights reserved.</p></div></footer>
    <div class="toast" id="toast"></div>
    <script src="https://unpkg.com/lucide@0.453.0"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script>
    lucide.createIcons();

    let originalImage = null;
    let currentRotation = 0;
    let flipH = false, flipV = false;
    let cropMode = false;
    let cropRect = { x: 0, y: 0, w: 0, h: 0 };
    let isDragging = false, dragStart = { x: 0, y: 0 };
    let fileName = 'image';

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasContainer');
    const cropOverlay = document.getElementById('cropOverlay');

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', e => { e.preventDefault(); dropzone.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

    function handleFile(file) {
        if (!file || !file.type.startsWith('image/')) { showToast('Please select an image file'); return; }
        fileName = file.name.replace(/\.[^.]+$/, '');
        const img = new Image();
        img.onload = () => {
            originalImage = img;
            currentRotation = 0;
            flipH = false;
            flipV = false;
            dropzone.style.display = 'none';
            document.getElementById('editorArea').style.display = 'block';
            renderCanvas();
            showToast('Image loaded');
        };
        img.src = URL.createObjectURL(file);
    }

    function renderCanvas() {
        if (!originalImage) return;
        const rad = currentRotation * Math.PI / 180;
        const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
        const w = originalImage.width, h = originalImage.height;
        const newW = Math.round(w * cos + h * sin);
        const newH = Math.round(w * sin + h * cos);

        // Scale to fit container
        const maxW = container.clientWidth || 800;
        const maxH = 500;
        const scale = Math.min(maxW / newW, maxH / newH, 1);
        canvas.width = Math.round(newW * scale);
        canvas.height = Math.round(newH * scale);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(rad);
        ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
        ctx.drawImage(originalImage, -w * scale / 2, -h * scale / 2, w * scale, h * scale);
        ctx.restore();

        document.getElementById('imageInfo').textContent =
            `Original: ${originalImage.width} x ${originalImage.height} | Canvas: ${canvas.width} x ${canvas.height} | Rotation: ${currentRotation}`;
    }

    function rotate(deg) {
        currentRotation = (currentRotation + deg) % 360;
        if (currentRotation < 0) currentRotation += 360;
        document.getElementById('freeAngle').value = currentRotation;
        renderCanvas();
    }

    function rotateFree() {
        currentRotation = parseInt(document.getElementById('freeAngle').value) || 0;
        renderCanvas();
    }

    function flip(dir) {
        if (dir === 'h') flipH = !flipH;
        else flipV = !flipV;
        renderCanvas();
    }

    function resetImage() {
        currentRotation = 0;
        flipH = false;
        flipV = false;
        document.getElementById('freeAngle').value = 0;
        cropMode = false;
        cropOverlay.style.display = 'none';
        document.getElementById('btnApplyCrop').style.display = 'none';
        document.getElementById('btnCrop').classList.remove('active');
        document.getElementById('cropInfo').style.display = 'none';
        renderCanvas();
        showToast('Reset to original');
    }

    // Crop functionality
    function toggleCropMode() {
        cropMode = !cropMode;
        document.getElementById('btnCrop').classList.toggle('active', cropMode);
        if (!cropMode) {
            cropOverlay.style.display = 'none';
            document.getElementById('btnApplyCrop').style.display = 'none';
            document.getElementById('cropInfo').style.display = 'none';
        } else {
            showToast('Click and drag on the image to select crop area');
        }
    }

    container.addEventListener('mousedown', startCrop);
    container.addEventListener('mousemove', moveCrop);
    container.addEventListener('mouseup', endCrop);
    container.addEventListener('touchstart', e => { e.preventDefault(); startCrop(e.touches[0]); });
    container.addEventListener('touchmove', e => { e.preventDefault(); moveCrop(e.touches[0]); });
    container.addEventListener('touchend', e => { e.preventDefault(); endCrop(e); });

    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function startCrop(e) {
        if (!cropMode) return;
        isDragging = true;
        const pos = getCanvasCoords(e);
        dragStart = pos;
        cropRect = { x: pos.x, y: pos.y, w: 0, h: 0 };
        cropOverlay.style.display = 'block';
        updateCropOverlay();
    }

    function moveCrop(e) {
        if (!isDragging || !cropMode) return;
        const pos = getCanvasCoords(e);
        cropRect.x = Math.min(dragStart.x, pos.x);
        cropRect.y = Math.min(dragStart.y, pos.y);
        cropRect.w = Math.abs(pos.x - dragStart.x);
        cropRect.h = Math.abs(pos.y - dragStart.y);
        updateCropOverlay();
    }

    function endCrop(e) {
        if (!isDragging) return;
        isDragging = false;
        if (cropRect.w > 5 && cropRect.h > 5) {
            document.getElementById('btnApplyCrop').style.display = 'inline-flex';
            document.getElementById('cropInfo').style.display = 'inline';
            document.getElementById('cropInfo').textContent =
                `Crop: ${Math.round(cropRect.w)} x ${Math.round(cropRect.h)} at (${Math.round(cropRect.x)}, ${Math.round(cropRect.y)})`;
        } else {
            cropOverlay.style.display = 'none';
        }
    }

    function updateCropOverlay() {
        cropOverlay.style.left = cropRect.x + 'px';
        cropOverlay.style.top = cropRect.y + 'px';
        cropOverlay.style.width = cropRect.w + 'px';
        cropOverlay.style.height = cropRect.h + 'px';
    }

    function applyCrop() {
        if (cropRect.w < 5 || cropRect.h < 5) { showToast('Please select a crop area first'); return; }

        // Get the cropped image data from canvas
        const imageData = ctx.getImageData(
            Math.round(cropRect.x), Math.round(cropRect.y),
            Math.round(cropRect.w), Math.round(cropRect.h)
        );

        // Create a new image from cropped data
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = Math.round(cropRect.w);
        tempCanvas.height = Math.round(cropRect.h);
        tempCanvas.getContext('2d').putImageData(imageData, 0, 0);

        const img = new Image();
        img.onload = () => {
            originalImage = img;
            currentRotation = 0;
            flipH = false;
            flipV = false;
            document.getElementById('freeAngle').value = 0;
            cropMode = false;
            cropOverlay.style.display = 'none';
            document.getElementById('btnApplyCrop').style.display = 'none';
            document.getElementById('btnCrop').classList.remove('active');
            document.getElementById('cropInfo').style.display = 'none';
            renderCanvas();
            showToast('Crop applied');
        };
        img.src = tempCanvas.toDataURL();
    }

    function downloadResult() {
        if (!originalImage) { showToast('No image to download'); return; }
        const link = document.createElement('a');
        link.download = fileName + '_edited.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('Image downloaded');
    }

    function clearAll() {
        originalImage = null;
        currentRotation = 0;
        flipH = false;
        flipV = false;
        cropMode = false;
        dropzone.style.display = '';
        document.getElementById('editorArea').style.display = 'none';
        fileInput.value = '';
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
    </script>
</body>
</html>
