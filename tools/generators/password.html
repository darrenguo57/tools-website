<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - UseEasyTool</title>
    <meta name="description" content="Generate secure passwords">

    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">

    <style>
        /* Tool Page Custom Styles */
        .pwd-options { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; padding: 1rem; background: var(--color-bg-secondary); border-radius: var(--radius-lg); border: 1px solid var(--color-border-light); }
        .pwd-option { display: flex; flex-direction: column; gap: 0.25rem; }
        .pwd-option label { font-size: var(--font-size-sm); color: var(--color-text-secondary); font-weight: 500; }
        .pwd-option input, .pwd-option select { padding: 0.5rem 0.75rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-text); font-size: var(--font-size-sm); min-width: 120px; }
        .pwd-option input:focus, .pwd-option select:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .pwd-display { min-height: 80px; padding: 1.5rem; background: var(--color-bg-secondary); border-radius: var(--radius-lg); border: 1px solid var(--color-border-light); text-align: center; }
        .pwd-text { font-family: var(--font-family-mono); font-size: 1.5rem; color: var(--color-text); word-break: break-all; margin-bottom: 1rem; }
        .strength-bar { display: flex; gap: 4px; max-width: 300px; margin: 0 auto 0.5rem; }
        .strength-bar__segment { flex: 1; height: 6px; background: var(--color-border); border-radius: 3px; }
        .strength-bar__segment.active-weak { background: #ef4444; }
        .strength-bar__segment.active-medium { background: #f59e0b; }
        .strength-bar__segment.active-strong { background: #22c55e; }
        .strength-bar__segment.active-very-strong { background: #10b981; }
        .strength-label { font-size: var(--font-size-sm); font-weight: 600; }
        .strength-label.weak { color: #ef4444; }
        .strength-label.medium { color: #f59e0b; }
        .strength-label.strong { color: #22c55e; }
        .strength-label.very-strong { color: #10b981; }
        .pwd-actions { display: flex; gap: 0.5rem; margin-top: 1rem; justify-content: center; flex-wrap: wrap; }
        .toggle-group { display: flex; gap: 1.5rem; flex-wrap: wrap; }
        .tool-toggle { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        .tool-toggle__switch { width: 44px; height: 24px; background: var(--color-border); border-radius: 12px; position: relative; transition: background 0.2s; }
        .tool-toggle__switch::after { content: ''; position: absolute; width: 18px; height: 18px; background: white; border-radius: 50%; top: 3px; left: 3px; transition: transform 0.2s; }
        .tool-toggle__switch--active { background: var(--color-primary); }
        .tool-toggle__switch--active::after { transform: translateX(20px); }
        .tool-toggle__label { font-size: var(--font-size-sm); color: var(--color-text); }

        @media (max-width: 768px) {
            .pwd-options { flex-direction: column; }
            .pwd-option { width: 100%; }
            .pwd-option input, .pwd-option select { width: 100%; }
            .toggle-group { flex-direction: column; gap: 0.75rem; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="UseEasyTool"></i>
                <span>UseEasyTool</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_generators" data-i18n="cat_generators">Generators</a> / <span>Password Generator</span></div></div>

    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="key-round"></i></div>
                    <h1>Password Generator</h1>
                    <p>Generate secure passwords</p>
                </div>

                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <div class="workspace-grid">
                        <!-- Options Panel -->
                        <div class="full-width">
                            <div class="pwd-options">
                                <div class="pwd-option">
                                    <label for="pwdLength">Length</label>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <input type="range" id="pwdLength" min="4" max="64" value="16" style="flex: 1;">
                                        <span id="pwdLengthDisplay" style="font-weight: 600; color: var(--color-primary); min-width: 30px;">16</span>
                                    </div>
                                </div>
                                <div class="pwd-option" style="flex: 1;">
                                    <label>Character Types</label>
                                    <div class="toggle-group">
                                        <div class="tool-toggle" id="toggleUpper" role="switch" aria-checked="true" tabindex="0">
                                            <div class="tool-toggle__switch tool-toggle__switch--active"></div>
                                            <span class="tool-toggle__label">ABC</span>
                                        </div>
                                        <div class="tool-toggle" id="toggleLower" role="switch" aria-checked="true" tabindex="0">
                                            <div class="tool-toggle__switch tool-toggle__switch--active"></div>
                                            <span class="tool-toggle__label">abc</span>
                                        </div>
                                        <div class="tool-toggle" id="toggleNumbers" role="switch" aria-checked="true" tabindex="0">
                                            <div class="tool-toggle__switch tool-toggle__switch--active"></div>
                                            <span class="tool-toggle__label">123</span>
                                        </div>
                                        <div class="tool-toggle" id="toggleSpecial" role="switch" aria-checked="true" tabindex="0">
                                            <div class="tool-toggle__switch tool-toggle__switch--active"></div>
                                            <span class="tool-toggle__label">!@#</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="pwd-option">
                                    <label for="excludeChars">Exclude Characters</label>
                                    <input type="text" id="excludeChars" placeholder="e.g., 0O1lI">
                                </div>
                            </div>
                        </div>

                        <!-- Results Panel -->
                        <div class="full-width">
                            <div class="pwd-display">
                                <div class="pwd-text" id="pwdText">Click Generate</div>
                                <div class="strength-bar">
                                    <div class="strength-bar__segment" id="seg1"></div>
                                    <div class="strength-bar__segment" id="seg2"></div>
                                    <div class="strength-bar__segment" id="seg3"></div>
                                    <div class="strength-bar__segment" id="seg4"></div>
                                </div>
                                <div class="strength-label" id="strengthLabel">-</div>
                            </div>
                            <div class="pwd-actions">
                                <button class="btn btn-primary" id="btnGenerate"><i data-lucide="play"></i><span>Generate</span></button>
                                <button class="btn btn-secondary" id="btnCopy"><i data-lucide="copy"></i><span>Copy</span></button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <aside class="tool-sidebar">
            </aside>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="#" data-i18n="footer_about">About</a>
                <a href="#" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="#" data-i18n="footer_terms">Terms of Service</a>
                <a href="#" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 UseEasyTool. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>

    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>

    <script>
    (function() {
        // Character sets
        const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const LOWER = 'abcdefghijklmnopqrstuvwxyz';
        const NUMBERS = '0123456789';
        const SPECIAL = '!@#$%^&*()_+-=[]{}|;:,.<>?';

        // State
        let useUpper = true;
        let useLower = true;
        let useNumbers = true;
        let useSpecial = true;

        const pwdText = document.getElementById('pwdText');
        const pwdLength = document.getElementById('pwdLength');
        const pwdLengthDisplay = document.getElementById('pwdLengthDisplay');
        const strengthLabel = document.getElementById('strengthLabel');
        const seg1 = document.getElementById('seg1');
        const seg2 = document.getElementById('seg2');
        const seg3 = document.getElementById('seg3');
        const seg4 = document.getElementById('seg4');

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
            if (typeof I18n !== 'undefined') {
                I18n.init();
            }

            // Length slider display
            pwdLength.addEventListener('input', () => {
                pwdLengthDisplay.textContent = pwdLength.value;
            });

            // Setup toggles
            setupToggle('toggleUpper', (v) => { useUpper = v; });
            setupToggle('toggleLower', (v) => { useLower = v; });
            setupToggle('toggleNumbers', (v) => { useNumbers = v; });
            setupToggle('toggleSpecial', (v) => { useSpecial = v; });

            // Generate button
            document.getElementById('btnGenerate').addEventListener('click', generatePassword);

            // Copy button
            document.getElementById('btnCopy').addEventListener('click', () => {
                const pwd = pwdText.textContent;
                if (pwd === 'Click Generate') return;
                navigator.clipboard.writeText(pwd).then(() => {
                    showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
                });
            });

            // Auto-generate on load
            generatePassword();
        });

        function setupToggle(id, callback) {
            const el = document.getElementById(id);
            el.addEventListener('click', () => {
                const active = el.classList.toggle('tool-toggle__switch--active');
                el.setAttribute('aria-checked', active);
                callback(active);
            });
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }
        }

        function getCharset() {
            let charset = '';
            if (useUpper) charset += UPPER;
            if (useLower) charset += LOWER;
            if (useNumbers) charset += NUMBERS;
            if (useSpecial) charset += SPECIAL;
            const exclude = document.getElementById('excludeChars').value;
            if (exclude) charset = charset.split('').filter(c => !exclude.includes(c)).join('');
            return charset;
        }

        function generatePassword() {
            const charset = getCharset();
            if (charset.length === 0) {
                pwdText.textContent = 'Enable at least one option';
                updateStrength(null);
                return;
            }
            const length = parseInt(pwdLength.value);
            const bytes = new Uint8Array(length);
            crypto.getRandomValues(bytes);
            let password = '';
            for (let i = 0; i < length; i++) {
                password += charset[bytes[i] % charset.length];
            }
            pwdText.textContent = password;
            updateStrength(password);
        }

        function calcStrength(password) {
            let score = 0;
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            if (password.length >= 20) score++;
            if (/[a-z]/.test(password)) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^a-zA-Z0-9]/.test(password)) score++;
            if (password.length >= 16 && /[^a-zA-Z0-9]/.test(password)) score++;
            if (score <= 2) return { level: 1, label: 'Weak', cls: 'weak', bar: 'active-weak' };
            if (score <= 4) return { level: 2, label: 'Medium', cls: 'medium', bar: 'active-medium' };
            if (score <= 6) return { level: 3, label: 'Strong', cls: 'strong', bar: 'active-strong' };
            return { level: 4, label: 'Very Strong', cls: 'very-strong', bar: 'active-very-strong' };
        }

        function updateStrength(password) {
            const segments = [seg1, seg2, seg3, seg4];
            if (!password) {
                segments.forEach(seg => { seg.className = 'strength-bar__segment'; });
                strengthLabel.textContent = '-';
                strengthLabel.className = 'strength-label';
                return;
            }
            const strength = calcStrength(password);
            segments.forEach((seg, i) => {
                seg.className = 'strength-bar__segment';
                if (i < strength.level) seg.classList.add(strength.bar);
            });
            strengthLabel.className = 'strength-label ' + strength.cls;
            strengthLabel.textContent = strength.label;
        }
    })();
    </script>
</body>
</html>
