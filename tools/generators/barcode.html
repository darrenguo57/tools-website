<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Generator - ToolBox</title>
    <meta name="description" content="Generate barcodes">

    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>

    <!-- JsBarcode Library -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">

    <style>
        /* Tool Page Custom Styles */
        .barcode-options { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; padding: 1rem; background: var(--color-bg-secondary); border-radius: var(--radius-lg); border: 1px solid var(--color-border-light); }
        .barcode-option { display: flex; flex-direction: column; gap: 0.25rem; }
        .barcode-option label { font-size: var(--font-size-sm); color: var(--color-text-secondary); font-weight: 500; }
        .barcode-option input, .barcode-option select { padding: 0.5rem 0.75rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-text); font-size: var(--font-size-sm); min-width: 120px; }
        .barcode-option input:focus, .barcode-option select:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .barcode-preview { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 200px; padding: 2rem; background: white; border-radius: var(--radius-lg); border: 1px solid var(--color-border-light); overflow-x: auto; }
        .barcode-preview svg { max-width: 100%; height: auto; }
        .barcode-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; color: var(--color-text-tertiary); }
        .barcode-placeholder i { opacity: 0.5; }
        .barcode-actions { display: flex; gap: 0.5rem; margin-top: 1rem; justify-content: center; flex-wrap: wrap; }

        @media (max-width: 768px) {
            .barcode-options { flex-direction: column; }
            .barcode-option { width: 100%; }
            .barcode-option input, .barcode-option select { width: 100%; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="toolbox"></i>
                <span>ToolBox</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_generators" data-i18n="cat_generators">Generators</a> / <span>Barcode Generator</span></div></div>

    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="barcode"></i></div>
                    <h1>Barcode Generator</h1>
                    <p>Generate barcodes from text</p>
                </div>

                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <div class="workspace-grid">
                        <!-- Options Panel -->
                        <div class="full-width">
                            <div class="barcode-options">
                                <div class="barcode-option" style="flex: 2;">
                                    <label for="barcodeInput">Content</label>
                                    <input type="text" id="barcodeInput" placeholder="Enter barcode content (e.g., 1234567890123)">
                                </div>
                                <div class="barcode-option">
                                    <label for="barcodeFormat">Format</label>
                                    <select id="barcodeFormat">
                                        <option value="CODE128">CODE128</option>
                                        <option value="CODE39">CODE39</option>
                                        <option value="EAN13">EAN-13</option>
                                        <option value="EAN8">EAN-8</option>
                                        <option value="UPC">UPC</option>
                                        <option value="ITF14">ITF14</option>
                                        <option value="pharmacode">Pharmacode</option>
                                    </select>
                                </div>
                                <div class="barcode-option">
                                    <label for="barcodeWidth">Bar Width</label>
                                    <input type="number" id="barcodeWidth" value="2" min="1" max="4">
                                </div>
                                <div class="barcode-option">
                                    <label for="barcodeHeight">Height</label>
                                    <input type="number" id="barcodeHeight" value="100" min="40" max="300">
                                </div>
                                <div class="barcode-option">
                                    <label for="barcodeShowText">Show Text</label>
                                    <select id="barcodeShowText">
                                        <option value="true">Yes</option>
                                        <option value="false">No</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Results Panel -->
                        <div class="full-width">
                            <div class="barcode-preview" id="barcodePreview">
                                <div class="barcode-placeholder">
                                    <i data-lucide="barcode"></i>
                                    <span>Enter content above to generate barcode</span>
                                </div>
                            </div>
                            <svg id="barcodeSvg" style="display: none;"></svg>
                            <div class="barcode-actions">
                                <button class="btn btn-primary" id="btnGenerate"><i data-lucide="play"></i><span>Generate</span></button>
                                <button class="btn btn-secondary" id="btnDownload"><i data-lucide="download"></i><span>Download</span></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Ad Slot -->
                <div class="ad-slot" style="margin-top:2rem">
                    <span data-i18n="ad_label">Advertisement</span>
                </div>
            </div>
            <aside class="tool-sidebar">
                <div class="ad-slot">
                    <span data-i18n="ad_label">Advertisement</span>
                </div>
            </aside>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="#" data-i18n="footer_about">About</a>
                <a href="#" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="#" data-i18n="footer_terms">Terms of Service</a>
                <a href="#" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 ToolBox. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>

    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>

    <script>
    (function() {
        const barcodePreview = document.getElementById('barcodePreview');
        const barcodeInput = document.getElementById('barcodeInput');
        const barcodeFormat = document.getElementById('barcodeFormat');
        const barcodeWidth = document.getElementById('barcodeWidth');
        const barcodeHeight = document.getElementById('barcodeHeight');
        const barcodeShowText = document.getElementById('barcodeShowText');
        const barcodeSvg = document.getElementById('barcodeSvg');

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
            if (typeof I18n !== 'undefined') {
                I18n.init();
            }

            // Generate on button click
            document.getElementById('btnGenerate').addEventListener('click', generateBarcode);

            // Generate on Enter key
            barcodeInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    generateBarcode();
                }
            });

            // Download barcode
            document.getElementById('btnDownload').addEventListener('click', () => {
                if (barcodeSvg.style.display === 'none') return;
                const svgData = new XMLSerializer().serializeToString(barcodeSvg);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    const link = document.createElement('a');
                    link.download = 'barcode.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast('Downloaded!');
                };
                img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            });
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }
        }

        function generateBarcode() {
            const input = barcodeInput.value.trim();

            if (!input) {
                barcodePreview.innerHTML = '<div class="barcode-placeholder"><i data-lucide="barcode"></i><span>Enter content above to generate barcode</span></div>';
                barcodeSvg.style.display = 'none';
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            const format = barcodeFormat.value;
            const width = Math.max(1, Math.min(4, parseInt(barcodeWidth.value) || 2));
            const height = Math.max(40, Math.min(300, parseInt(barcodeHeight.value) || 100));
            const showText = barcodeShowText.value === 'true';

            try {
                // Configure JsBarcode
                JsBarcode(barcodeSvg, input, {
                    format: format,
                    width: width,
                    height: height,
                    displayValue: showText,
                    fontSize: 16,
                    margin: 10,
                    background: '#FFFFFF',
                    lineColor: '#000000'
                });
                barcodePreview.innerHTML = '';
                barcodePreview.appendChild(barcodeSvg);
                barcodeSvg.style.display = 'block';
            } catch (e) {
                barcodePreview.innerHTML = '<div class="barcode-placeholder" style="color: var(--color-error);"><i data-lucide="alert-circle"></i><span>Error: ' + e.message + '</span></div>';
                barcodeSvg.style.display = 'none';
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        }
    })();
    </script>
</body>
</html>
