<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoID Generator - UseEasyTool</title>
    <meta name="description" content="Generate short IDs">

    <!-- Favicon -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.453.0"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/dark.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">

    <style>
        /* Tool Page Custom Styles */
        .nano-options { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; padding: 1rem; background: var(--color-bg-secondary); border-radius: var(--radius-lg); border: 1px solid var(--color-border-light); }
        .nano-option { display: flex; flex-direction: column; gap: 0.25rem; }
        .nano-option label { font-size: var(--font-size-sm); color: var(--color-text-secondary); font-weight: 500; }
        .nano-option input, .nano-option select { padding: 0.5rem 0.75rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-text); font-size: var(--font-size-sm); min-width: 120px; }
        .nano-option input:focus, .nano-option select:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .length-display { font-weight: 600; color: var(--color-primary); min-width: 30px; text-align: center; }
        .nano-results { min-height: 100px; padding: 1rem; background: var(--color-bg-secondary); border-radius: var(--radius-lg); border: 1px solid var(--color-border-light); }
        .nano-results .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; color: var(--color-text-tertiary); padding: 2rem; text-align: center; }
        .nano-results .placeholder i { opacity: 0.5; }
        .nano-actions { display: flex; gap: 0.5rem; margin-top: 1rem; justify-content: center; }
        .result-count { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: 0.5rem; text-align: center; }

        @media (max-width: 768px) {
            .nano-options { flex-direction: column; }
            .nano-option { width: 100%; }
            .nano-option input, .nano-option select { width: 100%; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="../../index.html" class="logo">
                <i data-lucide="UseEasyTool"></i>
                <span>UseEasyTool</span>
            </a>
            <div class="header-search">
                <i data-lucide="search"></i>
                <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-label">EN</span>
                </button>
                <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="theme-icon-light"></i>
                    <i data-lucide="moon" class="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb"><div class="container"><a href="../../index.html" data-i18n="breadcrumb_home">Home</a> / <a href="../../index.html#cat_generators" data-i18n="cat_generators">Generators</a> / <span>NanoID Generator</span></div></div>

    <!-- Main Content -->
    <main class="tool-page">
        <div class="container tool-layout">
            <div class="tool-main">
                <!-- Tool Header -->
                <div class="tool-header">
                    <div class="tool-icon"><i data-lucide="hash"></i></div>
                    <h1>NanoID Generator</h1>
                    <p>Generate short unique IDs</p>
                </div>

                <!-- Tool Workspace -->
                <div class="tool-workspace">
                    <div class="workspace-grid">
                        <!-- Options Panel -->
                        <div class="full-width">
                            <div class="nano-options">
                                <div class="nano-option">
                                    <label for="nanoCount">Count</label>
                                    <input type="number" id="nanoCount" value="1" min="1" max="100">
                                </div>
                                <div class="nano-option">
                                    <label for="nanoLength">Length</label>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <input type="range" id="nanoLength" min="1" max="36" value="21" style="flex: 1;">
                                        <span class="length-display" id="lengthDisplay">21</span>
                                    </div>
                                </div>
                                <div class="nano-option" style="flex: 1;">
                                    <label for="nanoAlphabet">Alphabet (optional)</label>
                                    <input type="text" id="nanoAlphabet" placeholder="Leave empty for default">
                                </div>
                            </div>
                        </div>

                        <!-- Results Panel -->
                        <div class="full-width">
                            <div class="result-count" id="resultCount"></div>
                            <div class="nano-results" id="nanoResults">
                                <div class="placeholder">
                                    <i data-lucide="hash"></i>
                                    <span>Click "Generate" to create NanoIDs</span>
                                </div>
                            </div>
                            <div class="nano-actions">
                                <button class="btn btn-primary" id="btnGenerate"><i data-lucide="play"></i><span>Generate</span></button>
                                <button class="btn btn-secondary" id="btnCopyAll"><i data-lucide="copy"></i><span>Copy All</span></button>
                                <button class="btn btn-danger" id="btnClear"><i data-lucide="trash-2"></i><span>Clear</span></button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <aside class="tool-sidebar">
            </aside>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-links">
                <a href="../about.html" data-i18n="footer_about">About</a>
                <a href="../privacy.html" data-i18n="footer_privacy">Privacy Policy</a>
                <a href="../terms.html" data-i18n="footer_terms">Terms of Service</a>
                <a href="../contact.html" data-i18n="footer_contact">Contact</a>
            </div>
            <p class="footer-copyright">&copy; 2024 UseEasyTool. <span data-i18n="footer_rights">All rights reserved.</span></p>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i data-lucide="chevron-up"></i>
    </button>

    <!-- Scripts -->
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>

    <script>
    (function() {
        // Default NanoID alphabet (URL-safe characters)
        const DEFAULT_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

        const resultsContainer = document.getElementById('nanoResults');
        const resultCount = document.getElementById('resultCount');
        const lengthSlider = document.getElementById('nanoLength');
        const lengthDisplay = document.getElementById('lengthDisplay');

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
            if (typeof I18n !== 'undefined') {
                I18n.init();
            }

            // Length slider display
            lengthSlider.addEventListener('input', () => {
                lengthDisplay.textContent = lengthSlider.value;
            });

            // Generate button
            document.getElementById('btnGenerate').addEventListener('click', () => {
                const count = Math.max(1, Math.min(100, parseInt(document.getElementById('nanoCount').value) || 1));
                const length = Math.max(1, parseInt(lengthSlider.value) || 21);
                const alphabet = document.getElementById('nanoAlphabet').value.trim() || DEFAULT_ALPHABET;

                if (alphabet.length < 2) {
                    resultsContainer.innerHTML = '<div class="placeholder" style="color: var(--color-error);"><i data-lucide="alert-circle"></i><span>Alphabet must contain at least 2 characters.</span></div>';
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                    return;
                }

                const ids = [];
                for (let i = 0; i < count; i++) {
                    ids.push(generateNanoID(length, alphabet));
                }
                renderResults(ids);
            });

            // Copy All button
            document.getElementById('btnCopyAll').addEventListener('click', () => {
                const codes = resultsContainer.querySelectorAll('code');
                if (codes.length === 0) return;
                navigator.clipboard.writeText(Array.from(codes).map(c => c.textContent).join('\n')).then(() => {
                    showToast(typeof I18n !== 'undefined' ? I18n.t('toast.copied') : 'Copied!');
                });
            });

            // Clear button
            document.getElementById('btnClear').addEventListener('click', () => {
                renderResults([]);
                showToast(typeof I18n !== 'undefined' ? I18n.t('toast.cleared') : 'Cleared');
            });

            // Auto-generate on load
            document.getElementById('btnGenerate').click();
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }
        }

        function generateNanoID(length, alphabet) {
            const mask = (2 << (Math.log(alphabet.length - 1) / Math.LN2)) - 1;
            const step = Math.ceil(1.6 * mask * length / alphabet.length);
            let id = '';
            while (id.length < length) {
                const bytes = new Uint8Array(step);
                crypto.getRandomValues(bytes);
                for (let i = 0; i < step && id.length < length; i++) {
                    const idx = bytes[i] & mask;
                    if (idx < alphabet.length) {
                        id += alphabet[idx];
                    }
                }
            }
            return id;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderResults(ids) {
            if (ids.length === 0) {
                resultsContainer.innerHTML = '<div class="placeholder"><i data-lucide="hash"></i><span>Click "Generate" to create NanoIDs</span></div>';
                resultCount.textContent = '';
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }
            resultCount.textContent = ids.length + ' ID(s)';
            let html = '<div style="display:flex;flex-direction:column;gap:var(--space-2);">';
            ids.forEach(id => {
                html += '<div style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);background:var(--color-bg);border-radius:var(--radius-md);border:1px solid var(--color-border-light);">' +
                    '<code style="flex:1;font-family:var(--font-family-mono);font-size:var(--font-size-sm);color:var(--color-text);word-break:break-all;">' + escapeHtml(id) + '</code>' +
                    '<button class="tool-action-btn copy-single-btn" data-id="' + escapeHtml(id) + '" title="Copy"><i data-lucide="copy"></i></button>' +
                    '</div>';
            });
            html += '</div>';
            resultsContainer.innerHTML = html;
            if (typeof lucide !== 'undefined') lucide.createIcons();

            resultsContainer.querySelectorAll('.copy-single-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    navigator.clipboard.writeText(btn.dataset.id).then(() => {
                        btn.classList.add('tool-action-btn--success');
                        btn.innerHTML = '<i data-lucide="check"></i>';
                        if (typeof lucide !== 'undefined') lucide.createIcons();
                        setTimeout(() => {
                            btn.classList.remove('tool-action-btn--success');
                            btn.innerHTML = '<i data-lucide="copy"></i>';
                            if (typeof lucide !== 'undefined') lucide.createIcons();
                        }, 1500);
                    });
                });
            });
        }
    })();
    </script>
</body>
</html>
